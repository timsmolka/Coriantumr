// ============================================================================
//  StockRestore.cfg  --  Restore selected parts to their STOCK models/textures
//  while keeping Restock (1.5.1) installed.
// ----------------------------------------------------------------------------
//  HOW THIS WORKS
//  Every Restock art patch is guarded with :HAS[~RestockIgnore[*]]:FOR[000_ReStock].
//  By adding a "RestockIgnore" field to a part BEFORE Restock's pass runs, we
//  make Restock skip that part completely, leaving its stock model, textures and
//  variants untouched. The companion file (StockRestore.restockwhitelist) then
//  re-enables the stock art assets that Restock would otherwise disable.
//
//  Requires ModuleManager (already installed with Restock).
//  Edit freely: delete a line to let Restock re-skin that part again.
// ============================================================================


// ---------------------------------------------------------------------------
//  COMMAND PODS / PROBE CORES
// ---------------------------------------------------------------------------
@PART[mk1pod_v2]:BEFORE[000_ReStock]        { %RestockIgnore = True }   // Mk1 Command Pod
// HECS2 intentionally NOT reverted: its stock model (old "Asteroid Day" part)
// has a low-res, blurry top texture. Restock's version is far sharper, so we
// leave the HECS2 on Restock. To force it stock anyway, uncomment the next line:
// @PART[HECS2_ProbeCore]:BEFORE[000_ReStock]  { %RestockIgnore = True }   // Probodobodyne HECS2
@PART[probeStackSmall]:BEFORE[000_ReStock]  { %RestockIgnore = True }   // RC-001S Remote Guidance Unit
@PART[probeStackLarge]:BEFORE[000_ReStock]  { %RestockIgnore = True }   // RC-L01 Remote Guidance Unit


