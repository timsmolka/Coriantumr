  lib('reg' + n, n + '-bit register (from flip-flops)', 'Registers & shifting', 'intermediate',
    `${n} flip-flops with a clock in common. LD lets a new value in on the clock edge; without it each bit feeds its own output back round and holds. CLR (also on the edge) empties it.`, (c) => {
      const D = c.ins('D', n), LD = c.in('LD'), CL = c.in('CLR'), CK = c.in('CLK');
      const nl = c.gate('NOT', LD), nc = c.gate('NOT', CL);
      const Q = D.map((d) => {

        const next = c.gate('AND', nc, c.gate('OR', c.gate('AND', LD, d), c.gate('AND', nl, q)));

/** A synchronous counter: every flip-flop sees the clock, and a bit toggles
    only when all the bits below it are 1 (or, counting down, all 0). */
function buildCounter(c, n, opt) {
  const EN = c.in('EN'), DN = opt.updown ? c.in('DOWN') : null, CK = c.in('CLK'), CL = c.in('CLR');
  const q = bitsFn(n, () => c.ph()); let t = EN; const Q = [];
  const u = (i) => (DN ? c.gate('XOR', q[i], DN) : q[i]);
  const stop = opt.decade ? c.gate('AND', EN, q[3], q[0]) : null;       // 9 + EN: back to zero
  for (let i = 0; i < n; i++) {
    let d = c.gate('XOR', q[i], t);
    if (stop) d = c.gate('AND', c.gate('NOT', stop), d);
    const [o] = c.part('DFFR', null, d, CK, CL, c.zero()); Q.push(o); c.bind(q[i], o);
    t = c.gate('AND', t, u(i));
  }
  c.outs('Q', Q);
  c.out('CO', opt.decade ? stop : t);
}

/* ---- two tiny assemblers, so the sample programs are readable ------------- */

/** Split assembly text into {label, op, args} lines. ';' starts a comment. */
function asmLines(text) {
  const lines = [];
  for (let raw of text.split('\n')) {
    raw = raw.replace(/;.*$/, '').trim();
    if (!raw) continue;
    let label = null;
    const m = raw.match(/^([A-Za-z_]\w*):\s*(.*)$/);
    if (m) { label = m[1]; raw = m[2]; }
    if (!raw) { lines.push({ label }); continue; }
    const parts = raw.split(/\s+/);
    const op = parts.shift().toUpperCase();
    lines.push({ label, op, args: parts.join(' ').split(',').map((s) => s.trim()).filter(Boolean) });
  }
  return lines;
}
function asmValue(s, labels) {
  s = s.replace(/^\[|\]$/g, '').trim();
  if (/^'.'$/.test(s)) return s.charCodeAt(1);
  if (/^0x[0-9a-f]+$/i.test(s)) return parseInt(s, 16);
  if (/^-?\d+$/.test(s)) return parseInt(s, 10);
  if (s in labels) return labels[s];
  throw new Error('unknown value "' + s + '"');
}
function asmPass(text, encode) {
  const lines = asmLines(text), labels = {};
  let at = 0;
  for (const l of lines) { if (l.label) labels[l.label] = at; if (l.op) at++; }
  const words = [];
  for (const l of lines) if (l.op) words.push(encode(l.op, l.args, labels));
  return words;
}
const ASM4_OPS = { NOP: 0, LDI: 1, LDA: 2, STA: 3, ADD: 4, SUB: 5, AND: 6, OR: 7, XOR: 8, JMP: 9, JZ: 10, JNZ: 11, ADDI: 12, OUT: 13, JC: 14, HLT: 15 };
/** TINY-4: one byte per instruction, the operation in the top four bits. */
function assemble4(text) {
  return asmPass(text, (op, args, labels) => {
    if (!(op in ASM4_OPS)) throw new Error('TINY-4 has no instruction "' + op + '"');
    return (ASM4_OPS[op] << 4) | ((args.length ? asmValue(args[0], labels) : 0) & 15);
  });
}
const ASM8_OPS = { HLT: 0, LDI: 1, MOV: 2, ADD: 3, SUB: 4, AND: 5, OR: 6, XOR: 7, ADDI: 8, LD: 9, ST: 10, JMP: 11, JZ: 12, JNZ: 13, OUT: 14, CMP: 15 };
/** TINY-8: one 16-bit word per instruction: op(4) rd(2) rs(2) imm(8). */
function assemble8(text) {
  const reg = (s) => { const m = /^r([0-3])$/i.exec(s.trim()); if (!m) throw new Error('"' + s + '" is not a register (r0 to r3)'); return +m[1]; };
  return asmPass(text, (op, args, labels) => {
    if (!(op in ASM8_OPS)) throw new Error('TINY-8 has no instruction "' + op + '"');
    let rd = 0, rs = 0, imm = 0;
    if (['MOV', 'ADD', 'SUB', 'AND', 'OR', 'XOR', 'CMP'].includes(op)) { rd = reg(args[0]); rs = reg(args[1]); }
    else if (['LDI', 'ADDI', 'LD', 'ST'].includes(op)) { rd = reg(args[0]); imm = asmValue(args[1], labels) & 255; }
    else if (['JMP', 'JZ', 'JNZ'].includes(op)) imm = asmValue(args[0], labels) & 255;
    else if (op === 'OUT') rd = reg(args[0]);
    return (ASM8_OPS[op] << 12) | (rd << 10) | (rs << 8) | imm;
  });
}

/* ---- the processors ----------------------------------------------------- */

const orOf1 = (c, ...x) => (x.length === 1 ? x[0] : x.length <= 8 ? c.gate('OR', ...x) : c.gate('OR', c.gate('OR', ...x.slice(0, 8)), orOf1(c, ...x.slice(8))));

lib('cpu4', 'TINY-4 processor (from gates)', 'Processors', 'advanced',
  'A complete little processor (a CPU) made of gates and flip-flops, with a 4-bit accumulator. Each clock it fetches an instruction (op in I4–I7, operand in I0–I3), does it, and moves on. Operations: 0 NOP · 1 LDI n (load) · 2 LDA a (load from memory) · 3 STA a (store) · 4 ADD a · 5 SUB a · 6 AND a · 7 OR a · 8 XOR a · 9 JMP · A JZ · B JNZ · C ADDI n · D OUT · E JC · F HLT. Z and C are the zero and carry flags. Memory (a ROM for the program, a RAM for data) lives outside: PC is the address of the next instruction, A the memory address, M the memory’s answer. RST sends it back to the start.', (c) => {
    const CK = c.in('CLK'), R = c.in('RST'), I = c.ins('I', 8), M = c.ins('M', 4);
    const imm = I.slice(0, 4), L = decodeLines(c, I.slice(4, 8));
    const and = (...x) => c.gate('AND', ...x), or = (...x) => orOf1(c, ...x), not = (x) => c.gate('NOT', x);
    const accQ = bitsFn(4, () => c.ph()), pcQ = bitsFn(4, () => c.ph()), outQ = bitsFn(4, () => c.ph()), zQ = c.ph(), cQ = c.ph();
    const ff = (d, bound) => { const [o] = c.part('DFFR', null, d, CK, R, c.zero()); c.bind(bound, o); return o; };

    const B = c.chip('mux2x4', ...M, ...imm, or(L[1], L[12]));                  // the second number: memory, or the operand itself
    const sum = c.chip('addsub4', ...accQ, ...B.slice(0, 4), L[5]);              // S0..3, COUT, V
    const selAdd = or(L[4], L[5], L[12]), selPass = or(L[1], L[2]);
    const res = bitsFn(4, (i) => or(
      and(selPass, B[i]), and(selAdd, sum[i]),
      and(L[6], and(accQ[i], B[i])), and(L[7], or(accQ[i], B[i])), and(L[8], c.gate('XOR', accQ[i], B[i]))));
    const writeAcc = or(L[1], L[2], L[4], L[5], L[6], L[7], L[8], L[12]);
    const accD = c.chip('mux2x4', ...accQ, ...res, writeAcc);
    accQ.forEach((p, i) => ff(accD[i], p));

    /* the flags change only when an operation that produces a result runs */
    const cEn = or(L[4], L[5], L[12]);
    ff(or(and(writeAcc, c.gate('NOR', ...res)), and(not(writeAcc), zQ)), zQ);
    ff(or(and(cEn, sum[4]), and(not(cEn), cQ)), cQ);

    /* the program counter: next instruction, a jump, or stay put on HLT */
    const inc = c.chip('inc4', ...pcQ);
    const jump = or(L[9], and(L[10], zQ), and(L[11], not(zQ)), and(L[14], cQ));
    const nxt = c.chip('mux2x4', ...inc.slice(0, 4), ...imm, jump);
    const pcD = c.chip('mux2x4', ...nxt, ...pcQ, L[15]);
    pcQ.forEach((p, i) => ff(pcD[i], p));

    const outD = c.chip('mux2x4', ...outQ, ...accQ, L[13]);
    outQ.forEach((p, i) => ff(outD[i], p));

    c.outs('PC', pcQ); c.outs('A', imm); c.out('WR', L[3]); c.outs('ACC', accQ); c.outs('OUT', outQ);
    c.out('HLT', L[15]); c.out('Z', zQ); c.out('C', cQ);
  });

lib('cpu8', 'TINY-8 processor', 'Processors', 'advanced',
  'An 8-bit processor (CPU) with four registers (r0–r3), an ALU, flags and a program counter, built from the parts in the Blocks and Memory groups. Instructions are 16 bits: operation (I12–I15), destination register (I10–I11), source register (I8–I9), and an 8-bit number or address (I0–I7). Operations: 0 HLT · 1 LDI rd,n · 2 MOV rd,rs · 3 ADD · 4 SUB · 5 AND · 6 OR · 7 XOR · 8 ADDI rd,n · 9 LD rd,[a] · A ST rd,[a] · B JMP · C JZ · D JNZ · E OUT rd · F CMP rd,rs. Program memory and data memory sit outside: PC addresses the program, A addresses data, M is what data memory answers. OUT latches a byte and gives STB a pulse for each one, to drive a terminal.', (c) => {
    const CK = c.in('CLK'), R = c.in('RST'), I = c.ins('I', 16), M = c.ins('M', 8);
    const imm = I.slice(0, 8), rs = I.slice(8, 10), rd = I.slice(10, 12), op = I.slice(12, 16);
    const and = (...x) => c.gate('AND', ...x), or = (...x) => orOf1(c, ...x), not = (x) => c.gate('NOT', x);
    const Y = c.part('DECODER', { bits: 4 }, ...op), rdSel = c.part('DECODER', { bits: 2 }, ...rd);
    const zQ = c.ph(), cQ = c.ph(), nQ = c.ph(), wb = bitsFn(8, () => c.ph());

    const passB = or(Y[1], Y[2]), useImm = or(Y[1], Y[8]);
    const regWrite = or(Y[1], Y[2], Y[3], Y[4], Y[5], Y[6], Y[7], Y[8], Y[9]);
    const regs = rdSel.map((sel) => c.part('REG', { bits: 8 }, ...wb, and(regWrite, sel), R, CK));
    const read = (S) => bitsFn(8, (i) => c.part('MUX', { sel: 2 }, regs[0][i], regs[1][i], regs[2][i], regs[3][i], ...S)[0]);
    const ra = read(rd), rb = read(rs);

    const np = not(passB);
    const aIn = ra.map((a) => and(a, np));
    const bIn = bitsFn(8, (i) => c.part('MUX', { sel: 1 }, rb[i], imm[i], useImm)[0]);
    const alu = c.part('ALU', { bits: 8 }, ...aIn, ...bIn, or(Y[4], Y[6], Y[15]), or(Y[5], Y[6]), Y[7], c.zero());   // F0..7 CO Z N V
    bitsFn(8, (i) => c.bind(wb[i], c.part('MUX', { sel: 1 }, alu[i], M[i], Y[9])[0]));

    const flagEn = or(Y[3], Y[4], Y[5], Y[6], Y[7], Y[8], Y[15]), nf = not(flagEn);
    const flag = (q, now) => { const [o] = c.part('DFFR', null, or(and(flagEn, now), and(nf, q)), CK, R, c.zero()); c.bind(q, o); };
    flag(zQ, alu[9]); flag(cQ, alu[8]); flag(nQ, alu[10]);

    const jump = or(Y[11], and(Y[12], zQ), and(Y[13], not(zQ)));
    const pc = c.part('COUNTER', { bits: 8 }, ...imm, jump, not(Y[0]), c.zero(), R, CK);        // Q0..7, CO

    const outReg = c.part('REG', { bits: 8 }, ...ra, Y[14], R, CK);
    let [outv] = c.part('DFFR', null, Y[14], CK, R, c.zero());
    /* The strobe is "an OUT just ran" AND "the clock is low". The flag is held
       back by a few buffers so that, at the clock edge, the inverted clock has
       always fallen before the flag can change — otherwise the strobe would
       spit a spurious pulse there. */
    for (let i = 0; i < 3; i++) outv = c.gate('BUF', outv);
    c.outs('PC', pc.slice(0, 8)); c.outs('A', imm); c.out('WR', Y[10]); c.outs('DO', ra); c.outs('OUT', outReg);
    c.out('STB', and(not(CK), outv)); c.out('HLT', Y[0]); c.out('Z', zQ); c.out('C', cQ); c.out('N', nQ);
  });

/* ---- whole computers: a processor, a program and a memory in one chip ------ */

function computer4(prog) {
  return (c) => {
    const CK = c.in('CLK'), R = c.in('RST');
    const I = bitsFn(8, () => c.ph()), M = bitsFn(4, () => c.ph());
    const cpu = c.chip('cpu4', CK, R, ...I, ...M);              // PC0-3 A0-3 WR ACC0-3 OUT0-3 HLT Z C
    const rom = c.part('ROM', { abits: 4, dbits: 8, data: assemble4(prog) }, ...cpu.slice(0, 4));
    const ram = c.part('RAM', { abits: 4, dbits: 4, data: [] }, ...cpu.slice(4, 8), ...cpu.slice(9, 13), cpu[8], CK);
    rom.forEach((s, i) => c.bind(I[i], s)); ram.forEach((s, i) => c.bind(M[i], s));
    c.outs('OUT', cpu.slice(13, 17)); c.out('HLT', cpu[17]);
  };
}
function computer8(prog) {
  return (c) => {
    const CK = c.in('CLK'), R = c.in('RST');
    const I = bitsFn(16, () => c.ph()), M = bitsFn(8, () => c.ph());
    const cpu = c.chip('cpu8', CK, R, ...I, ...M);              // PC0-7 A0-7 WR DO0-7 OUT0-7 STB HLT Z C N
    const rom = c.part('ROM', { abits: 8, dbits: 16, data: assemble8(prog) }, ...cpu.slice(0, 8));
    const ram = c.part('RAM', { abits: 8, dbits: 8, data: [] }, ...cpu.slice(8, 16), ...cpu.slice(17, 25), cpu[16], CK);
    rom.forEach((s, i) => c.bind(I[i], s)); ram.forEach((s, i) => c.bind(M[i], s));
    c.outs('OUT', cpu.slice(25, 33)); c.out('STB', cpu[33]); c.out('HLT', cpu[34]);
  };
}

/** A clock, a reset button, one of the computer chips, and something to watch it. */
function exComputer(key, title, bits, opts) {
  opts = opts || {};
  const b = builder(title, CHIP_COLORS[5]);
  const comp = b.add('CHIP', 260, 100, { chip: installLib(key) });
  const ck = b.add('CLOCK', 60, 100, { hz: opts.hz || 2 });
  const rst = b.add('IN', 60, 220, { label: 'RST', momentary: true });
  b.w(ck, 0, comp, 0); b.w(rst, 0, comp, 1);
  if (opts.terminal) {
    const t = b.add('TERMINAL', 560, 40);
    for (let i = 0; i < 8; i++) b.w(comp, i, t, i);
    b.w(comp, 8, t, 8);                                          // STB is the terminal's write strobe
    b.w(comp, 9, b.add('LED', 560, 340), 0);
  } else {
    const num = b.add('NUM', 560, 100, { bits });
    for (let i = 0; i < bits; i++) b.w(comp, i, num, i);
    b.w(comp, opts.hlt != null ? opts.hlt : bits, b.add('LED', 560, 300), 0);
  }
  return b.def;
}
function exLibAdder() {

  for (let i = 0; i < 8; i++) { b.w(a, i, add, i); b.w(c, i, add, 8 + i); }

}

function openHelp() {
  const body = h('div', { class: 'help' });
  body.innerHTML = `
<p>A schematic you build from logic gates. The physical bench — a breadboard with real
chips that need real power, plus a bare design board — is a separate app:
<a href="breadboard.html" style="color:inherit">Breadboard</a>.</p>

<h4>Circuit editor</h4>
<ul>
  <li>Click a part on the left, then click the board to drop it. <kbd>Esc</kbd> cancels.</li>
  <li><b>To wire two things together</b>, either drag from one port to the other, or —
      easier — <b>click the first port, then click the second</b>. No dragging, no steady
      hand. <kbd>Esc</kbd> abandons a half-drawn wire.</li>
  <li>You do not have to hit the port exactly. A wire being drawn looks for the nearest
      port it could legally reach and rings it in green; let go anywhere near and it
      lands there. Let go in open space instead and you get a junction.</li>
  <li>To <b>move a wire you already drew</b>, point at it: a blue dot appears at each
      end. Drag a dot to take that end somewhere else. Dragging from a connected input
      does the same thing — it pulls the plug out.</li>
  <li>Wires run output → input. An output can feed as many inputs as you like; a gate
      input takes one wire, so plugging a second one in pulls the first one out.</li>
  <li><kbd>Esc</kbd> mid-drag puts a wire back where it was, and a whole re-route is a
      single undo.</li>
</ul>

<h4>Junctions — more than two wires at one point</h4>
<ul>
  <li><b>Drop a wire onto another wire</b> and a junction appears where you dropped it,
      joining the two. That is the way to tap a signal on its way past.</li>
  <li>It works at <b>any point on any wire</b>, and it does not matter which end you are
      holding: an input you are looking for a source for gets fed by the junction, and a
      wire you have branched off somewhere else becomes another wire into it.</li>
  <li>A junction takes as many wires in as out, and nothing already joined to one is ever
      unplugged to make room. It costs nothing and adds no delay — every wire touching it
      carries one and the same signal.</li>
  <li>That does let you join two wires that are driven by <em>different</em> outputs, which
      is a short. The join is made and the clash is reported — the warning bar counts the
      nets with two outputs fighting over them, and they turn red — rather than the board
      refusing to let you build it. <kbd>Ctrl</kbd>+<kbd>Z</kbd> if you did not mean it.</li>
  <li>Dragging from the <em>middle</em> of a wire branches it too: you get a second wire
      out of the same output, without a junction in the picture.</li>
  <li>Click an <b>input pin</b> to flip it between 0 and 1. Set it to “button” in the
      inspector if you want it to spring back.</li>
  <li>Add input and output pins, then press <b>Package as a chip</b>. Your chip joins the
      palette and can be dropped into bigger circuits. Double-click a placed chip to open it.</li>
  <li>Editing a chip updates every copy of it already in use.</li>
</ul>

<h4>The chip library — gates to a working computer</h4>
<p>The <b>Chip library</b> at the bottom of the parts list is a shelf of
ready-made chips, grouped by what they do and tagged <b>raw</b> (nothing but NANDs or NORs),
<b>simple</b>, <b>intermediate</b>, <b>advanced</b> or <b>computer</b>. Gates built out of NANDs;
latches and flip-flops; adders, subtractors, multipliers, comparators, shifters and a gate-built
ALU; decoders and multiplexers; registers, shift registers and counters; RAM, ROM, a register
file and a stack; two processors, <b>TINY-4</b> (made of gates and flip-flops, 4 bits) and
<b>TINY-8</b> (8 bits, four registers); and whole computers that run a program from their own
ROM — counting, Fibonacci, multiplying, and printing “Hello, World!” to a terminal.</p>
<p>Everything in it is made from this simulator’s own parts, so nothing is a black box. <b>Add to
parts</b> puts a chip in your parts list; <b>Place</b> picks it up; <b>Look inside</b> copies its
insides onto the board for you to take apart. Typing in the search box above the parts list finds
library chips too, and pressing one adds it. The parts list also has more building blocks of its
own now — JK and T flip-flops, registers, counters, shift registers, multiplexers, decoders,
adders, comparators and an ALU — and the inspector shows the gate-built twin of each.</p>
<p>To run a computer, set a clock going, press and release <b>RST</b>, and watch the output. Open
the computer chip and select its <b>ROM</b> to read the program, or type a different one in.</p>

<h4>Seeing inside a part</h4>
<p>Click any gate, latch or flip-flop and the panel on the right shows <b>what it is
made of</b> — the same job done with simpler gates. Click the picture to see it full
size, or press <b>Build it on the board</b> to drop a working copy next to your circuit
and take it apart. Every one of those diagrams is a real circuit, not an illustration.</p>
<p>A <b>NAND</b> is where it stops: that one is built into the simulator, and every other
gate here can be made from NANDs alone, which is why a NAND is all you need to build anything.</p>
<p>The same panel works on your own chips, so you can look inside something you built
last week without opening it for editing.</p>

<h4>Running something you built as a computer</h4>
<p>Wire a <b>TERMINAL</b> or a <b>KEYBOARD</b> onto the board (under Computer in the
palette) and an <b>▶ Operate</b> button appears in the top bar. It switches to a plain
screen and keyboard — the circuit's own screen and keyboard, not a debugging view of it —
and the simulation keeps running behind it the whole time you are there.</p>
<p>Neither part knows what it is being used for. A <b>TERMINAL</b> is eight data pins and a
write strobe: on the strobe's rising edge, whatever byte is on the data pins becomes one
character on screen — the same trick a real memory-mapped display uses. A <b>KEYBOARD</b>
is the same idea backwards: eight data pins carry the last key's code, and a ready pin
pulses once when a new key arrives for something to catch. What either one becomes — a
teletype, a text adventure, a login prompt — is entirely down to what you wire to them and
what you put in the ROM that drives it. <kbd>Esc</kbd>, or the button in the corner, comes
back to the circuit.</p>

<h4>How the simulation works</h4>
<p>Everything compiles to a flat netlist. Each tick, every gate reads its inputs and writes
its outputs at the same instant — one gate, one tick of delay. That is what lets a pair of
cross-coupled NANDs remember a bit and a ring of inverters oscillate. The speed slider sets
how many ticks run per frame; turn it down to 1 to watch a signal crawl through the gates.</p>

<h4>Getting rid of things</h4>
<p>Three ways — whichever suits what you are holding:</p>
<ul>
  <li>Click it, then press <kbd>Delete</kbd> (or <kbd>Backspace</kbd>).</li>
  <li>Click it and tap the red <b>✕</b> that appears beside it. This is the one for
      touchscreens, and it works on a whole selection at once.</li>
  <li><b>Right-click</b> it. A right-<em>drag</em> still pans, so nothing goes by accident.</li>
</ul>
<p>Undo brings anything back.</p>

<h4>Keyboard</h4>
<ul>
  <li><kbd>E</kbd> switches between <b>Edit</b> and <b>Use</b>. In Use, a click only works
      the thing you have built — flips a switch, holds a button down — and cannot start a
      wire, move a part or delete anything. You do not have to hit a switch exactly: the
      nearest one within reach is the one that flips. The left button never moves the view
      in Use mode, so nothing slides out from under you — right-drag does that instead.
      Reach for the palette and it puts you back in Edit by itself.</li>
  <li><kbd>R</kbd> turns whatever is selected a quarter turn, <kbd>Shift</kbd>+<kbd>R</kbd> the
      other way. One part spins on the spot; several turn as a block, so a row of gates
      becomes a column rather than a row of sideways gates. A circuit's pins are numbered by
      where they sit, so turning a whole circuit can renumber them — it says so when it
      does.</li>
  <li><kbd>J</kbd> puts a junction on the selected wire, where you are pointing. A junction
      takes as many wires in as out, so one signal can feed several inputs — the T and the
      cross a schematic draws as a solder dot. Dropping a wire onto a wire still splices one
      in as well.</li>
  <li><kbd>L</kbd> lines things up: every wire that is nearly straight already has the
      part at one end nudged until it is exactly straight. With nothing selected it tidies
      the whole board, with a selection only those parts. Dragging does the same thing one
      part at a time — come within a few pixels of level with something you are wired to and
      it snaps the rest of the way, with a dashed line to say why.</li>
  <li><kbd>Space</kbd> run / pause · <kbd>F</kbd> fit to view · <kbd>Shift</kbd>+<kbd>F</kbd>
      fullscreen · <kbd>Esc</kbd> deselect</li>
  <li><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> redo ·
      <kbd>Ctrl</kbd>+<kbd>D</kbd> duplicate · <kbd>Ctrl</kbd>+<kbd>A</kbd> select all ·
      <kbd>Ctrl</kbd>+<kbd>C</kbd> copy · <kbd>Ctrl</kbd>+<kbd>V</kbd> paste (under the pointer,
      if it is over the board)</li>
  <li><kbd>Delete</kbd> remove the selection · arrow keys nudge</li>
  <li>Middle-drag, right-drag or <kbd>Space</kbd>-drag to pan · scroll to zoom · two fingers on a touchscreen</li>
</ul>

<h4>Where your work lives</h4>
<p>In this browser, saved as you go. Nothing is uploaded. <b>File → Export</b> writes a
single JSON file with your chip library and the current circuit in it.</p>`;
  openModal('Help', body, h('button', { class: 'btn', onclick: closeModal }, 'Close'), true);
}

/* ==========================================================================
   17 · MODES AND BOOT
   ========================================================================== */

function setStatusTip() {
  $('#status-tip').textContent = S.play
    ? 'Use mode: click at or near an input pin to flip it — you do not have to be exact. Right-drag moves the view. Nothing you click can move a part or change a wire.'
    : 'Click a part on the left, then click the board. To wire: click one port, then the other. To remove something: click it and press Delete, tap the red ✕, or right-click it.';
}

/** Edit or Use. Everything that could change the circuit checks S.play. */
function setPlay(on) {
  S.play = !!on;
  S.armed = null; S.drag = null; S.pendingWire = null;
  $('#act-edit').classList.toggle('on', !S.play);
  $('#act-run').classList.toggle('on', S.play);
  const t = $('#act-toggle');
  t.textContent = S.play ? '▶' : '✎';
  t.classList.toggle('on', S.play);
  t.title = S.play ? 'Switch to Edit (E)' : 'Switch to Use (E)';
  document.body.classList.toggle('playing', S.play);
  setStatusTip();
  renderPalette(); renderInspector();
  scheduleSave();
}

function updateSpeedLabel() {
  $('#speed-lbl').textContent = SPEEDS[S.speedIx] + '×';
  $('#sim-speed').value = String(S.speedIx);
}

function refreshRuntimeWarnings() {
  const out = [];
  if (S.sim) {
    let n = 0;
    for (let i = 0; i < S.sim.clash.length; i++) if (S.sim.clash[i]) n++;
    if (n) out.push({ text: `<b>${n} net${n > 1 ? 's are' : ' is'} driven by two outputs at once.</b> Only one output may drive a wire.`, bad: true });
  }
  S.runWarn = out;
  paintWarnings();
}

function boot() {
  readColors();
  resize();
  const had = loadState();
  if (!had) {
    const ex = exHalfAdder();
    S.work = ex;
    S.work.name = 'Half adder';
  }

  /* top bar */
  $('#act-edit').onclick = () => setPlay(false);
  $('#act-run').onclick = () => setPlay(true);
  $('#act-toggle').onclick = () => setPlay(!S.play);
  $('#btn-undo').onclick = undo;
  $('#btn-redo').onclick = redo;
  $('#btn-operate').onclick = openOperate;
  $('#op-close').onclick = closeOperate;
  refreshOperateButton();
  $('#btn-chip').onclick = openMakeChip;
  $('#btn-examples').onclick = openExamples;
  $('#btn-file').onclick = openFileMenu;
  $('#btn-help').onclick = openHelp;
  $('#btn-theme').onclick = cycleTheme;
  $('#btn-full').onclick = toggleFullscreen;
  $('#btn-more').onclick = openMoreMenu;
  document.addEventListener('fullscreenchange', syncFullscreenButton);
  document.addEventListener('webkitfullscreenchange', syncFullscreenButton);
  $('#btn-pal').onclick = () => $('#app').classList.toggle('pal-open');
  $('#btn-insp').onclick = () => $('#app').classList.toggle('insp-open');

  /* stage docks */
  $('#btn-run').onclick = () => setRunning(!S.run);
  $('#btn-step').onclick = () => {
    setRunning(false);
    const now = performance.now();
    if (S.dirty) recompile();
    S.sim.tick(now);
  };
  $('#sim-speed').oninput = (e) => {
    S.speedIx = clamp(parseInt(e.target.value, 10) || 0, 0, SPEEDS.length - 1);
    updateSpeedLabel(); scheduleSave();
  };
  $('#btn-zin').onclick = () => zoomAt(VW / 2, VH / 2, 1.25);
  $('#btn-zout').onclick = () => zoomAt(VW / 2, VH / 2, 0.8);
  $('#btn-fit').onclick = fitView;
  $('#pal-q').oninput = renderPalette;

  updateSpeedLabel();
  setRunning(true);
  setStatusTip();
  renderPalette(); renderInspector(); renderCrumbs();
  setPlay(S.play);
  syncUndoButtons();
  recompile();
  fitView();

  /* The canvas also changes size when a drawer opens, not just on window
     resize, so watch the element itself. */
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('#stage'));
  else window.addEventListener('resize', resize);
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener && mq.addEventListener('change', readColors);
  setInterval(refreshRuntimeWarnings, 450);
  requestAnimationFrame(frame);
}

/* A handle for the console — and for the automated checks that ship with the
   repository, which drive the engine directly rather than through the UI. */
window.LogicLab = {
  S, PARTS, compile, Sim, computeTruthTable, LIBRARY, installLib, libEntry, assemble4, assemble8, PROGRAMS,
  newDef, makeNode, ioOrder, builder, ramArray, ramArraySize,
  geom: (n) => geom(n, ctx), toScreen, fitView, deleteHandle, renderInspector, renderPalette, renderCrumbs,
  wireHandles,
  examples: { EDITOR_EXAMPLES }, RECIPES,
  __diagTrail: () => diagTrail,
  get __diagDef() { return diagTrail.length ? diagTrail[diagTrail.length - 1].def : null; },
  __descendable: descendable,
  expandOnce, anySimpler, partsCensus, openableTypes,
  saveNow, setPlay, rotateSelection, turnOf, straightenWires, alignOffset, wirePoints,
  addJointToSelection, spliceJoint, hitTest, wireHops, recSevenSeg, SEG_BITS,
  copySelection, pasteClipboard, duplicateSelection, get clipboard() { return clipboard; },
  wiredPorts, refreshWiredPorts,
  hasComputerIO, openOperate, closeOperate, operateKey, asciiOf, updateOperateScreen,
  get lib() { return LIB; },
};

boot();
