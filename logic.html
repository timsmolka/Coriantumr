<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!--
  ===========================================================================
  Logic Lab — a digital logic / circuit simulator that runs in one file.
  ---------------------------------------------------------------------------
  Two workspaces share one simulation engine:

    1. CIRCUIT EDITOR — a schematic board. Drop gates, wire them together,
       toggle inputs, and watch the signals move. Any circuit you build can be
       packaged into a reusable CHIP, which then appears in the palette and can
       be dropped into bigger circuits (chips inside chips, as deep as you
       like). That is the "build a computer out of NAND gates" workflow.

    2. BREADBOARD — a solderless breadboard with real 74-series DIP chips,
       jumper wires, resistors, LEDs and switches. The tie points are wired the
       way a real board is (five-hole columns, continuous power rails), so the
       circuit only works if you actually power the chips and route every
       signal. Shorts, floating inputs and unpowered chips are reported instead
       of being quietly ignored.

  HOW IT SIMULATES. Both modes compile down to the same thing: a netlist of
  primitive gates joined by nets. Every net holds one bit, and every tick each
  gate reads its inputs and writes its outputs *simultaneously* — a unit-delay
  model. That single choice is what makes feedback work: cross-coupled NAND
  gates latch, a ring of inverters oscillates, and an edge-triggered flip-flop
  built from gates behaves like the real thing.

  NO BUILD STEP, NO NETWORK. Everything (markup, styling, engine, examples) is
  in this file, so it runs from a web server or straight off the filesystem,
  online or off. Nothing is uploaded; your work is saved in localStorage and
  can be exported to a JSON file.
  ===========================================================================
-->

<title>Logic Lab — digital logic and breadboard simulator</title>
<meta name="description" content="Build logic circuits from gates, package them into reusable chips, and wire up real 74-series parts on a simulated breadboard.">
<meta name="theme-color" content="#0f141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Logic Lab">

<style>
/* ==========================================================================
   THEME
   Dark by default (a lit workbench in a dark room), light when the system asks
   for it. The [data-theme] attribute on <html> lets the in-app toggle win.
   ========================================================================== */
:root{
  --bg:#0f141a; --panel:#151d26; --panel-2:#1b2634; --panel-3:#22303f;
  --line:#2a3849; --line-soft:#213040;
  --ink:#dbe6f2; --ink-soft:#93a5b9; --ink-faint:#61738a;
  --accent:#ffc247;          /* a HIGH signal */
  --accent-dim:#7a5c1f;
  --low:#3d4b5c;             /* a LOW signal */
  --select:#5cc8ff;
  --danger:#ff6b5e; --warn:#ffb03a; --ok:#4bd684;
  --wire-hi:#ffc247; --wire-lo:#41505f;
  --chip:#2f4257; --chip-ink:#dbe6f2;
  --grid:#1b2733; --grid-strong:#23323f;
  --board:#e8e4d8; --board-line:#c9c4b4; --board-hole:#8f8b7e;
  --shadow:0 6px 22px rgba(0,0,0,.45);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --rail:236px; --rail-r:270px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#eef1f5; --panel:#ffffff; --panel-2:#f3f5f9; --panel-3:#e6eaf1;
    --line:#d3dae4; --line-soft:#e2e7ee;
    --ink:#16202b; --ink-soft:#5a6b7d; --ink-faint:#8b9aab;
    --accent:#e08a00; --accent-dim:#f0c581;
    --low:#b4c0cd; --select:#0f83d6;
    --wire-hi:#e08a00; --wire-lo:#aab6c4;
    --chip:#c9d6e4; --chip-ink:#16202b;
    --grid:#e2e7ee; --grid-strong:#d6dde6;
    --shadow:0 6px 22px rgba(20,35,55,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#151d26; --panel-2:#1b2634; --panel-3:#22303f;
  --line:#2a3849; --line-soft:#213040;
  --ink:#dbe6f2; --ink-soft:#93a5b9; --ink-faint:#61738a;
  --accent:#ffc247; --accent-dim:#7a5c1f; --low:#3d4b5c; --select:#5cc8ff;
  --wire-hi:#ffc247; --wire-lo:#41505f; --chip:#2f4257; --chip-ink:#dbe6f2;
  --grid:#1b2733; --grid-strong:#23323f;
  --shadow:0 6px 22px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f3f5f9; --panel-3:#e6eaf1;
  --line:#d3dae4; --line-soft:#e2e7ee;
  --ink:#16202b; --ink-soft:#5a6b7d; --ink-faint:#8b9aab;
  --accent:#e08a00; --accent-dim:#f0c581; --low:#b4c0cd; --select:#0f83d6;
  --wire-hi:#e08a00; --wire-lo:#aab6c4; --chip:#c9d6e4; --chip-ink:#16202b;
  --grid:#e2e7ee; --grid-strong:#d6dde6;
  --shadow:0 6px 22px rgba(20,35,55,.14);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ==========================================================================
   APP SHELL — three columns (palette · stage · inspector), three rows.
   ========================================================================== */
#app{
  display:grid;height:100%;
  grid-template-columns:var(--rail) minmax(0,1fr) var(--rail-r);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "pal stage insp" "bar bar bar";
  padding-top:var(--safe-top);
}
#app.hide-insp{grid-template-columns:var(--rail) minmax(0,1fr) 0}
#app.hide-insp #inspector{display:none}

/* ---- top bar ---- */
#topbar{
  grid-area:top;display:flex;align-items:center;gap:10px;padding:7px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);min-height:46px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .mark{
  width:22px;height:22px;border-radius:6px;background:var(--accent);color:#1a1206;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto;
}
.brand .sub{color:var(--ink-faint);font-weight:400;font-size:12px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{
  background:none;border:0;padding:5px 11px;border-radius:7px;cursor:pointer;
  color:var(--ink-soft);font-size:13px;white-space:nowrap;
}
.seg button.on{background:var(--panel-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.grow{flex:1 1 auto;min-width:0}
#crumbs{
  display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:12.5px;
  min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
#crumbs .chipname{color:var(--ink);font-weight:600}
#crumbs button{background:none;border:0;color:var(--select);cursor:pointer;padding:0;font-size:12.5px}
.tools{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:5px 10px;cursor:pointer;color:var(--ink);white-space:nowrap;font-size:13px;
}
.btn:hover{background:var(--panel-3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:5px 8px;min-width:32px;text-align:center}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.wreck{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.wreck:hover{filter:brightness(1.08)}

/* ---- palette ---- */
#palette{
  grid-area:pal;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.pal-search{padding:8px;border-bottom:1px solid var(--line-soft)}
.pal-search input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;outline:none;
}
.pal-search input:focus{border-color:var(--select)}
.pal-scroll{overflow-y:auto;padding:6px 8px 14px;flex:1 1 auto;min-height:0}
.pal-group{margin:8px 0 2px;display:flex;align-items:center;gap:6px}
.pal-group h3{
  margin:0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;
}
.pal-group .rule{flex:1;height:1px;background:var(--line-soft)}
.pal-items{display:flex;flex-wrap:wrap;gap:5px}
.pal-item{
  display:flex;align-items:center;gap:6px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:grab;
  font-size:12.5px;user-select:none;-webkit-user-select:none;touch-action:none;
}
.pal-item:hover{border-color:var(--select)}
.pal-item.armed{border-color:var(--accent);background:var(--panel-3);box-shadow:0 0 0 1px var(--accent) inset}
.pal-item .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto;background:var(--chip)}
.pal-item .gear{margin-left:2px;color:var(--ink-faint);font-size:11px}
.pal-empty{color:var(--ink-faint);font-size:12px;padding:6px 2px}

/* ---- stage ---- */
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
.float{position:absolute;z-index:5}
.dock{
  display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px 6px;box-shadow:var(--shadow);
}
#simdock{left:10px;bottom:10px}
#zoomdock{right:10px;bottom:10px}
#simdock input[type=range]{width:96px;accent-color:var(--accent)}
.dock .lbl{color:var(--ink-faint);font-size:11px;padding:0 2px;white-space:nowrap}
#hint{
  left:50%;transform:translateX(-50%);top:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:5px 14px;box-shadow:var(--shadow);font-size:12.5px;color:var(--ink-soft);
  pointer-events:none;opacity:0;transition:opacity .18s;max-width:min(90%,560px);text-align:center;
}
#hint.show{opacity:1}
#warnbox{
  right:10px;top:10px;max-width:min(340px,60vw);display:flex;flex-direction:column;gap:6px;
  pointer-events:none;
}
.warn{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-soft);box-shadow:var(--shadow);
}
.warn.bad{border-left-color:var(--danger)}
.warn b{color:var(--ink);font-weight:600}

/* ---- inspector ---- */
#inspector{
  grid-area:insp;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow-y:auto;
}
.insp-sec{border-bottom:1px solid var(--line-soft);padding:10px 12px}
.insp-sec h3{
  margin:0 0 8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;
}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.row label{color:var(--ink-soft);font-size:12.5px;flex:0 0 84px}
.row .ctl{flex:1 1 auto;min-width:0}
input[type=text],input[type=number],select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  padding:5px 8px;outline:none;
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--select)}
input[type=range]{width:100%;accent-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatch{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.muted{color:var(--ink-faint);font-size:12px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
.kv span:first-child{color:var(--ink-soft)}
.kv span:last-child{font-family:var(--mono)}
.ttable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.ttable th,.ttable td{padding:2px 5px;text-align:center;border-bottom:1px solid var(--line-soft)}
.ttable th{color:var(--ink-faint);font-weight:600;position:sticky;top:0;background:var(--panel)}
.ttable td.one{color:var(--accent)}
.ttable td.zero{color:var(--ink-faint)}
.ttable .sep{border-left:1px solid var(--line)}
.tt-wrap{max-height:260px;overflow:auto;border:1px solid var(--line-soft);border-radius:8px}
.stack{display:flex;flex-direction:column;gap:6px}
.madeof{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
.madeof h4{margin:0 0 5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.madeof p{margin:0 0 8px;line-height:1.45}
canvas.preview{
  width:100%;height:140px;display:block;background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;cursor:zoom-in;
}
canvas.preview:hover{border-color:var(--select)}
canvas.preview.big{height:min(58vh,470px);cursor:default}
.madeof .zoomhint{
  margin:5px 0 0;font-size:11px;color:var(--ink-faint);text-align:center;
}
.pinlist{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:11.5px}
.pinlist div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.pinlist .n{color:var(--ink-faint)}

/* ---- status bar ---- */
#statusbar{
  grid-area:bar;display:flex;align-items:center;gap:14px;padding:3px 10px;
  background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;
  color:var(--ink-faint);min-height:24px;padding-bottom:calc(3px + var(--safe-bot));
}
#statusbar .sep{width:1px;height:12px;background:var(--line)}
#statusbar .tip{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#statusbar b{color:var(--ink-soft);font-weight:600;font-family:var(--mono)}

/* ==========================================================================
   MODALS
   ========================================================================== */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
#modal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);max-width:640px;width:100%;max-height:86vh;overflow:auto;
}
.sheet.wide{max-width:860px}
.sheet header{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel);z-index:1;
}
.sheet header h2{margin:0;font-size:15px}
.sheet .body{padding:14px 16px}
.sheet footer{
  display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--panel);
}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.card{
  text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;cursor:pointer;
}
.card:hover{border-color:var(--select)}
.card b{display:block;margin-bottom:3px}
.card span{color:var(--ink-faint);font-size:12px;line-height:1.35;display:block}
.help h4{margin:16px 0 6px;font-size:13px}
.help p,.help li{color:var(--ink-soft);font-size:13px}
.help ul{margin:6px 0;padding-left:18px}
.help kbd{
  font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink);
}
.help code{font-family:var(--mono);font-size:12px;color:var(--accent)}
.chiprow{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel-2);margin-bottom:6px;
}
.chiprow .sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.chiprow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chiprow .meta{color:var(--ink-faint);font-size:11.5px;font-family:var(--mono)}

/* ==========================================================================
   NARROW SCREENS — rails become slide-over drawers.
   ========================================================================== */
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "bar"}
  #palette,#inspector{
    position:fixed;z-index:30;top:calc(46px + var(--safe-top));bottom:0;width:min(280px,84vw);
    box-shadow:var(--shadow);transition:transform .2s ease;
  }
  #palette{left:0;transform:translateX(-101%)}
  #inspector{right:0;transform:translateX(101%);width:min(300px,88vw)}
  #app.pal-open #palette{transform:none}
  #app.insp-open #inspector{transform:none;display:flex}
  #app.hide-insp #inspector{display:flex}
  .brand .sub{display:none}
  #crumbs{display:none}
}
/* On a phone the top bar cannot hold everything, so the less-used controls
   move into a "⋯" sheet and the two stage docks shrink to fit side by side. */
.narrow-only{display:none}
@media (max-width:560px){
  .tools .wide-only{display:none}
  .brand span.nm{display:none}
  .narrow-only{display:inline-block}
  #topbar{gap:6px;padding:6px}
  .seg button{padding:5px 8px}
  #simdock{left:8px;bottom:8px;gap:3px}
  #simdock .lbl{display:none}
  #simdock input[type=range]{width:64px}
  #zoomdock{right:8px;bottom:8px;gap:3px}
  .dock{padding:4px}
}
.drawer-btn{display:none}
@media (max-width:900px){.drawer-btn{display:inline-block}}
</style>
</head>

<body>
<div id="app">

  <!-- ==================== TOP BAR ==================== -->
  <header id="topbar">
    <button class="btn icon drawer-btn" id="btn-pal" title="Parts">☰</button>
    <div class="brand">
      <span class="mark" aria-hidden="true">&amp;</span>
      <span class="nm">Logic Lab</span>
    </div>

    <div class="seg" role="tablist" aria-label="Workspace">
      <button id="mode-editor" class="on" role="tab">Circuit</button>
      <button id="mode-board" role="tab">Breadboard</button>
    </div>

    <div id="crumbs" class="grow"></div>

    <div class="tools">
      <button class="btn icon" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="btn icon wide-only" id="btn-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button class="btn wide-only" id="btn-chip" title="Package this circuit as a reusable chip">Make chip</button>
      <button class="btn wide-only" id="btn-examples">Examples</button>
      <button class="btn wide-only" id="btn-file">File</button>
      <button class="btn icon wide-only" id="btn-help" title="Help">?</button>
      <button class="btn icon wide-only" id="btn-theme" title="Light / dark">◐</button>
      <button class="btn icon narrow-only" id="btn-more" title="More">⋯</button>
      <button class="btn icon drawer-btn" id="btn-insp" title="Inspector">⚙</button>
    </div>
  </header>

  <!-- ==================== PALETTE ==================== -->
  <aside id="palette">
    <div class="pal-search">
      <input id="pal-q" type="text" placeholder="Search parts…" autocomplete="off" spellcheck="false">
    </div>
    <div class="pal-scroll" id="pal-scroll"></div>
  </aside>

  <!-- ==================== STAGE ==================== -->
  <main id="stage">
    <canvas id="cv"></canvas>

    <p class="float" id="hint"></p>
    <div class="float" id="warnbox"></div>

    <div class="float dock" id="simdock">
      <button class="btn icon" id="btn-run" title="Run / pause (Space)">⏸</button>
      <button class="btn icon" id="btn-step" title="Advance one tick">⏭</button>
      <span class="lbl">speed</span>
      <input id="sim-speed" type="range" min="0" max="10" step="1" value="6" title="Ticks per frame">
      <span class="lbl" id="speed-lbl">32×</span>
    </div>

    <div class="float dock" id="zoomdock">
      <button class="btn icon" id="btn-zout" title="Zoom out">−</button>
      <button class="btn icon" id="btn-zin" title="Zoom in">+</button>
      <button class="btn icon" id="btn-fit" title="Fit to view (F)">⤢</button>
    </div>
  </main>

  <!-- ==================== INSPECTOR ==================== -->
  <aside id="inspector"></aside>

  <!-- ==================== STATUS BAR ==================== -->
  <footer id="statusbar">
    <span class="tip" id="status-tip"></span>
    <span class="sep"></span>

<script>
'use strict';
/* ==========================================================================
   0 · SMALL HELPERS
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (n = 8) => Math.random().toString(36).slice(2, 2 + n);
const uid = () => rnd(4) + Date.now().toString(36).slice(-4);
const clone = (o) => JSON.parse(JSON.stringify(o));
const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;

/** Build a DOM element from a tag, an attribute bag and children. */
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}

/** Union-find over arbitrary string keys — the backbone of both netlists. */
class DSU {
  constructor() { this.idx = new Map(); this.parent = []; }
  id(key) {
    let i = this.idx.get(key);
    if (i === undefined) { i = this.parent.length; this.idx.set(key, i); this.parent.push(i); }
    return i;
  }
  find(i) { while (this.parent[i] !== i) { this.parent[i] = this.parent[this.parent[i]]; i = this.parent[i]; } return i; }
  union(a, b) { const ra = this.find(a), rb = this.find(b); if (ra !== rb) this.parent[rb] = ra; return ra; }
  rootOf(key) { return this.find(this.id(key)); }
}

/* ==========================================================================
   1 · PART DEFINITIONS (the primitives every circuit bottoms out in)

   Each entry describes how a part looks, how many ports it has, and — for the
   parts that actually compute something — what it does on a tick. Anything not
   listed here is a user-made chip, which the compiler expands into these.
   ========================================================================== */

const GATE_COLORS = {
  io: '#3f7d55', src: '#7a5aa8', gate: '#2f4257', seq: '#7d5233',
  disp: '#365f7d', plumb: '#4a4f58',
};

const PORT_GAP = 20;     // vertical spacing between a part's ports
const GRID = 10;         // editor snap grid, in world units

/** Bit helpers used by the gate bodies. */
const andOf = (a) => a.every(Boolean) ? 1 : 0;
const orOf = (a) => a.some(Boolean) ? 1 : 0;
const xorOf = (a) => a.reduce((s, v) => s ^ (v ? 1 : 0), 0);

const PARTS = {
  /* ---- chip boundary ------------------------------------------------- */
  IN: {
    name: 'Input pin', cat: 'io', group: 'Signals', shape: 'pin',
    ins: () => [], outs: () => [''], w: 30, h: 30,
    make: () => ({ label: 'in', value: 0, momentary: false }),
    tip: 'A pin on the edge of the chip. Click it to flip it between 0 and 1.',
    sim: (p, v, put) => put(p.outs[0], p.node.value ? 1 : 0),
  },
  OUT: {
    name: 'Output pin', cat: 'io', group: 'Signals', shape: 'pin',
    ins: () => [''], outs: () => [], w: 30, h: 30,
    make: () => ({ label: 'out' }),
    tip: 'A pin on the edge of the chip. Lights up when the signal is 1.',
  },
  CONST: {
    name: 'Constant', cat: 'src', group: 'Signals', shape: 'const',
    ins: () => [], outs: () => [''], w: 40, h: 26,
    make: () => ({ value: 1 }),
    tip: 'A permanent 0 or 1. Click to flip it.',
    sim: (p, v, put) => put(p.outs[0], p.node.value ? 1 : 0),
  },
  CLOCK: {
    name: 'Clock', cat: 'src', group: 'Signals', shape: 'clock',
    ins: () => [], outs: () => [''], w: 46, h: 30,
    make: () => ({ hz: 2 }),
    tip: 'A square wave. Set its rate in the inspector.',
    sim: (p, v, put, ctx) => {
      const half = 500 / Math.max(0.05, p.node.hz || 2);
      if (p.st.t === undefined) { p.st.t = ctx.now; p.st.q = 0; }
      // Catch up in whole half-periods so a slow frame does not desynchronise it.
      while (ctx.now - p.st.t >= half) { p.st.t += half; p.st.q ^= 1; }
      put(p.outs[0], p.st.q);
    },
  },

  /* ---- gates ---------------------------------------------------------- */
  AND: { name: 'AND', cat: 'gate', group: 'Gates', vin: true, tip: '1 only when every input is 1.',
    sim: (p, v, put) => put(p.outs[0], andOf(p.ins.map((n) => v[n]))) },
  OR: { name: 'OR', cat: 'gate', group: 'Gates', vin: true, tip: '1 when at least one input is 1.',
    sim: (p, v, put) => put(p.outs[0], orOf(p.ins.map((n) => v[n]))) },
  NAND: { name: 'NAND', cat: 'gate', group: 'Gates', vin: true, bubble: true,
    tip: 'AND, inverted. Every other gate can be built from these.',
    sim: (p, v, put) => put(p.outs[0], andOf(p.ins.map((n) => v[n])) ^ 1) },
  NOR: { name: 'NOR', cat: 'gate', group: 'Gates', vin: true, bubble: true, tip: 'OR, inverted.',
    sim: (p, v, put) => put(p.outs[0], orOf(p.ins.map((n) => v[n])) ^ 1) },
  XOR: { name: 'XOR', cat: 'gate', group: 'Gates', vin: true, tip: '1 when an odd number of inputs are 1.',
    sim: (p, v, put) => put(p.outs[0], xorOf(p.ins.map((n) => v[n]))) },
  XNOR: { name: 'XNOR', cat: 'gate', group: 'Gates', vin: true, bubble: true, tip: 'XOR, inverted — 1 when the inputs match.',
    sim: (p, v, put) => put(p.outs[0], xorOf(p.ins.map((n) => v[n])) ^ 1) },
  NOT: {
    name: 'NOT', cat: 'gate', group: 'Gates', bubble: true, w: 46,
    ins: () => [''], outs: () => [''], tip: 'Flips the bit.',
    sim: (p, v, put) => put(p.outs[0], v[p.ins[0]] ^ 1),
  },
  BUF: {
    name: 'BUFFER', cat: 'gate', group: 'Gates', w: 56,
    ins: () => [''], outs: () => [''], tip: 'Passes the bit through, one tick later.',
    sim: (p, v, put) => put(p.outs[0], v[p.ins[0]]),
  },

  /* ---- memory ---------------------------------------------------------
     Provided ready-made because they are what you reach for once the
     combinational stuff works — but nothing stops you building your own out
     of NANDs and packaging that instead. */
  DFF: {
    name: 'D FLIP-FLOP', cat: 'seq', group: 'Memory', w: 76,
    ins: () => ['D', '>'], outs: () => ['Q', 'Q̄'],
    tip: 'Copies D to Q on each rising edge of the clock input.',
    sim: (p, v, put) => {
      const d = v[p.ins[0]], c = v[p.ins[1]];
      if (c && !p.st.pc) p.st.q = d;
      p.st.pc = c;
      put(p.outs[0], p.st.q | 0); put(p.outs[1], (p.st.q | 0) ^ 1);
    },
  },
  DLATCH: {
    name: 'D LATCH', cat: 'seq', group: 'Memory', w: 66,
    ins: () => ['D', 'E'], outs: () => ['Q', 'Q̄'],
    tip: 'While enable is 1, Q follows D. When it drops to 0, Q holds.',
    sim: (p, v, put) => {
      if (v[p.ins[1]]) p.st.q = v[p.ins[0]];
      put(p.outs[0], p.st.q | 0); put(p.outs[1], (p.st.q | 0) ^ 1);
    },
  },

  /* ---- displays -------------------------------------------------------- */
  LED: {
    name: 'LED', cat: 'disp', group: 'Displays', shape: 'led',
    ins: () => [''], outs: () => [], w: 26, h: 26,
    make: () => ({ color: '#ff5b4a' }),
    tip: 'Glows while its input is 1.',
  },
  SEG7: {
    name: '7-SEGMENT', cat: 'disp', group: 'Displays', shape: 'seg7',
    ins: () => ['a', 'b', 'c', 'd', 'e', 'f', 'g', '.'], outs: () => [], w: 104, h: 8 * PORT_GAP + 16,
    make: () => ({ color: '#ff5b4a' }),
    tip: 'Eight segments, driven one bit each — a through g plus the dot.',
  },
  HEX: {
    name: 'HEX DIGIT', cat: 'disp', group: 'Displays', shape: 'seg7',
    ins: () => ['8', '4', '2', '1'], outs: () => [], w: 76, h: 92,
    make: () => ({ color: '#ffc247' }),
    tip: 'Shows a 4-bit number as one hex digit, 0–F. Decoding is done for you.',
  },

  /* ---- routing ---------------------------------------------------------
     Neither of these computes anything: the compiler simply fuses the nets on
     either side, so they cost nothing and add no delay. */
  JOINT: {
    name: 'Junction', cat: 'plumb', group: 'Routing', shape: 'joint',
    ins: () => [''], outs: () => [''], w: 18, h: 18,
    tip: 'A meeting point for wires: one wire in, as many out as you like. Drop a wire onto another wire to make one.',
  },
  TUNNEL: {
    name: 'Tunnel', cat: 'plumb', group: 'Routing', shape: 'tunnel',
    ins: () => [''], outs: () => [''], w: 62, h: 24,
    make: () => ({ label: 'net' }),
    tip: 'Every tunnel with the same name is wired together — a wire without the wire.',
  },
};

/* A chip instance is not in PARTS; it is described by the library entry it
   points at. This stand-in supplies the bits the renderer needs. */
const CHIP_PART = { name: 'chip', cat: 'chip', group: 'My chips', tip: 'A chip you built.' };

const CHIP_COLORS = ['#2f4257', '#3f7d55', '#7a5aa8', '#7d5233', '#365f7d', '#a8445a', '#4a7d7a', '#6d7d33'];
const LED_COLORS = ['#ff5b4a', '#ffc247', '#4bd684', '#5cc8ff', '#c77dff', '#ffffff'];

/* ==========================================================================
   2 · THE DESIGN MODEL

   A "def" is one circuit: a bag of nodes plus the wires between them. The
   circuit on screen is a def; every chip in the library is a def too. That
   sameness is the whole trick — packaging a circuit as a chip just moves a def
   into the library, and opening a chip for editing moves a copy back out.
   ========================================================================== */

function newDef(name = 'Untitled') {
  return { id: uid(), name, color: CHIP_COLORS[0], nodes: [], wires: [] };
}

function makeNode(type, x, y, extra) {
  const part = PARTS[type];
  const n = { id: uid(), type, x, y };
  if (part && part.vin) n.n = 2;                    // gates with a variable input count
  if (part && part.make) Object.assign(n, part.make());
  return Object.assign(n, extra || {});
}

/** Input pins and output pins of a def, ordered top-to-bottom.
    That ordering is what decides the port order on every instance of the chip,
    so dragging a pin up or down in the editor reorders the chip's ports. */
function ioOrder(def) {
  const by = (a, b) => a.y - b.y || a.x - b.x;
  return {
    ins: def.nodes.filter((n) => n.type === 'IN').sort(by),
    outs: def.nodes.filter((n) => n.type === 'OUT').sort(by),
  };
}

/** Port names and label for any node, primitive or chip instance. */
function portsOf(node) {
  if (node.type === 'CHIP') {
    const def = LIB[node.chip];
    if (!def) return { ins: [], outs: [], label: '?missing?' };
    const io = ioOrder(def);
    return {
      ins: io.ins.map((p) => p.label || 'in'),
      outs: io.outs.map((p) => p.label || 'out'),
      label: def.name,
    };
  }
  const part = PARTS[node.type];
  if (!part) return { ins: [], outs: [], label: node.type };
  const n = node.n || 2;
  const ins = part.ins ? part.ins(node) : Array.from({ length: n }, () => '');
  const outs = part.outs ? part.outs(node) : [''];
  return { ins, outs, label: part.name };
}

/** Box and port positions in world coordinates. */
const _textW = new Map();
function textWidth(ctx, s, font) {
  const k = font + '|' + s;
  let w = _textW.get(k);
  if (w === undefined) { ctx.font = font; w = ctx.measureText(s).width; _textW.set(k, w); }
  return w;
}

function geom(node, ctx) {
  const p = portsOf(node);
  const part = node.type === 'CHIP' ? CHIP_PART : PARTS[node.type] || {};
  const rows = Math.max(p.ins.length, p.outs.length, 1);
  let w = part.w || 64;
  const h = part.h || Math.max(38, rows * PORT_GAP + 16);
  /* Plain boxes grow to hold their name and their port labels; a part with a
     long name and named ports would otherwise print over itself. */
  if (ctx && !part.shape) {
    const named = p.ins.some((s) => s) || p.outs.some((s) => s);
    const size = node.type === 'CHIP' ? 12 : 11.5;
    w = Math.max(w, textWidth(ctx, p.label, `600 ${size}px ${FONT}`) + (named ? 50 : 22));
  }
  if (node.type === 'TUNNEL' && ctx) w = Math.max(52, textWidth(ctx, node.label || 'net', '11px ' + FONT) + 30);
  const spread = (count, i) => (count <= 1 ? h / 2 : (h - (count - 1) * PORT_GAP) / 2 + i * PORT_GAP);
  return {
    x: node.x, y: node.y, w, h, label: p.label,
    ins: p.ins.map((name, i) => ({ name, x: node.x, y: node.y + spread(p.ins.length, i) })),
    outs: p.outs.map((name, i) => ({ name, x: node.x + w, y: node.y + spread(p.outs.length, i) })),
  };
}

const nodeById = (def, id) => def.nodes.find((n) => n.id === id);

/** Does chip `hostId` already contain chip `needleId`, at any depth?
    Used to refuse the one edit that would make the compiler run forever. */
function chipContains(hostId, needleId, seen = new Set()) {
  if (hostId === needleId) return true;
  if (seen.has(hostId)) return false;
  seen.add(hostId);
  const def = LIB[hostId];
  if (!def) return false;
  return def.nodes.some((n) => n.type === 'CHIP' && chipContains(n.chip, needleId, seen));
}

/* ==========================================================================
   3 · COMPILER — flatten a design into primitives and nets

   Chips are expanded in place, recursively. Everything that ends up
   electrically joined — wires, joints, tunnels of the same name, the pins on
   either side of a chip boundary — is unioned into one net. What comes out is
   a flat array of gates addressing nets by index, which is all the simulator
   needs to know.
   ========================================================================== */

function compile(def) {
  const dsu = new DSU();
  const prims = [];
  const errors = [];
  const seen = [];                       // every pin key we touched, for net numbering

  const K = (path, id, side, i) => `${path}/${id}.${side}${i}`;
  const touch = (k) => { seen.push(k); return dsu.id(k); };

  function walk(def, path, bound, stack) {
    const io = ioOrder(def);
    const tunnels = new Map();

    for (const node of def.nodes) {
      const ports = portsOf(node);
      const inK = ports.ins.map((_, i) => K(path, node.id, 'i', i));
      const outK = ports.outs.map((_, i) => K(path, node.id, 'o', i));
      inK.forEach(touch); outK.forEach(touch);

      switch (node.type) {
        case 'IN': {
          // Top level: a switch the user can flip. Inside a chip: just the
          // near side of the boundary, fused with the caller's wire.
          const idx = io.ins.indexOf(node);
          if (bound && bound.ins[idx] != null) dsu.union(dsu.id(outK[0]), dsu.id(bound.ins[idx]));
          else if (!bound) prims.push({ type: 'IN', node, path, ins: [], outs: outK, st: {} });
          break;
        }
        case 'OUT': {
          const idx = io.outs.indexOf(node);
          if (bound && bound.outs[idx] != null) dsu.union(dsu.id(inK[0]), dsu.id(bound.outs[idx]));
          break;
        }
        case 'JOINT':
          dsu.union(dsu.id(inK[0]), dsu.id(outK[0]));
          break;
        case 'TUNNEL': {
          dsu.union(dsu.id(inK[0]), dsu.id(outK[0]));
          const name = (node.label || 'net').trim().toLowerCase();
          if (tunnels.has(name)) dsu.union(dsu.id(tunnels.get(name)), dsu.id(inK[0]));
          else tunnels.set(name, inK[0]);
          break;
        }
        case 'CHIP': {
          const child = LIB[node.chip];
          if (!child) { errors.push(`A missing chip is placed in "${def.name}".`); break; }
          if (stack.includes(node.chip)) { errors.push(`"${child.name}" contains itself — that branch was skipped.`); break; }
          walk(child, path + '/' + node.id, { ins: inK, outs: outK }, stack.concat(node.chip));
          break;
        }
        default: {
          const part = PARTS[node.type];
          if (!part) { errors.push(`Unknown part "${node.type}".`); break; }
          prims.push({ type: node.type, node, path, ins: inK, outs: outK, st: {} });
        }
      }
    }

    for (const w of def.wires) {
      const a = endKey(def, path, w.a), b = endKey(def, path, w.b);
      if (a == null || b == null) continue;
      dsu.union(touch(a), touch(b));
    }
  }

  function endKey(def, path, e) {
    const node = nodeById(def, e.n);
    if (!node) return null;
    const ports = portsOf(node);
    const count = e.s === 'in' ? ports.ins.length : ports.outs.length;
    if (e.i >= count) return null;                    // port disappeared (input count lowered)
    return K(path, e.n, e.s === 'in' ? 'i' : 'o', e.i);
  }

  walk(def, '', null, []);

  /* Number the nets, then rewrite every pin key as a net index. */
  const netOf = new Map();
  let count = 0;
  const net = (k) => {
    const root = dsu.find(dsu.id(k));
    let n = netOf.get(root);
    if (n === undefined) { n = count++; netOf.set(root, n); }
    return n;
  };
  for (const k of seen) net(k);
  for (const p of prims) { p.ins = p.ins.map(net); p.outs = p.outs.map(net); }

  /* A lookup so the renderer can ask "what is this port's value?". Only
     top-level ports matter for drawing, and those all live at path "". */
  const portNet = new Map();
  for (const k of seen) if (k.startsWith('/') && k.indexOf('/', 1) === -1) portNet.set(k.slice(1), net(k));

  return { def, prims, nets: count, portNet, errors };
}

/* ==========================================================================
   4 · SIMULATOR — unit-delay, synchronous

   One tick: every primitive reads the net values from the previous tick and
   drives its outputs; only then do the new values become visible. Gates
   therefore all take exactly one tick, which is what makes feedback loops
   behave — a NAND pair holds its state, a ring of inverters rings.
   ========================================================================== */

/* Real gates are not all equally quick, and a latch depends on it: two
   perfectly matched cross-coupled NANDs would sit and oscillate forever, which
   is metastability — a real circuit escapes it because one gate is a shade
   faster than the other. Handing out a small spread of propagation delays does
   the same job here. Consecutive gates never draw the same pair, so a
   cross-coupled pair always has a tie-break. */
const DELAY_PLAN = [[1, 0], [2, 0], [2, 1], [3, 0], [3, 1], [3, 2]];

class Sim {
  constructor(compiled, carry) {
    this.c = compiled;
    this.v = new Uint8Array(compiled.nets);       // this tick's values
    this.next = new Uint8Array(compiled.nets);    // swapped in, never reallocated
    this.driven = new Uint8Array(compiled.nets);
    this.clash = new Uint8Array(compiled.nets);
    this.ticks = 0;
    this.last = new Array(compiled.prims.length).fill(null);
    compiled.prims.forEach((p, i) => {
      // A fresh Sim is a fresh machine — unless a recompile handed us the
      // flip-flop contents, so that editing one corner of a circuit does not
      // wipe the memory in another.
      const st = carry ? carry.get(p.path + '/' + p.node.id) : null;
      p.st = st || {};
      const d = DELAY_PLAN[i % DELAY_PLAN.length];
      p.per = d[0]; p.ph = d[1];
    });
  }
  states() {
    const m = new Map();
    for (const p of this.c.prims) if (Object.keys(p.st).length) m.set(p.path + '/' + p.node.id, p.st);
    return m;
  }
  tick(now) {
    const v = this.v, drive = this.next, driven = this.driven, clash = this.clash;
    drive.fill(0); driven.fill(0); clash.fill(0);
    const put = (net, val) => {
      const b = val ? 1 : 0;
      if (driven[net] && drive[net] !== b) clash[net] = 1;   // two outputs disagreeing
      driven[net] = 1; drive[net] |= b;
    };
    const ctx = { now };
    const prims = this.c.prims;
    for (let i = 0; i < prims.length; i++) {
      const p = prims[i];
      const fn = PARTS[p.type] && PARTS[p.type].sim;
      if (!fn) continue;
      const held = this.last[i];
      if (held && (this.ticks + p.ph) % p.per !== 0) {
        // Still propagating: keep driving what it last decided.
        for (let k = 0; k < held.length; k += 2) put(held[k], held[k + 1]);
      } else {
        const rec = held || (this.last[i] = []);   // reused, not reallocated
        rec.length = 0;
        fn(p, v, (net, val) => { rec.push(net, val ? 1 : 0); put(net, val); }, ctx);
      }
    }
    this.v = drive; this.next = v;   // swap; undriven nets fell to 0 in the fill
    this.ticks++;
    return this.v;
  }
  /** Run until nothing changes (combinational) or we give up (sequential).
      Needs a few quiet ticks in a row, because the slowest gate only speaks
      every third one. */
  settle(max = 400, now = 0) {
    let quiet = 0;
    for (let i = 0; i < max; i++) {
      const before = this.v;                       // still intact right after the swap
      this.tick(now);
      quiet = sameBits(before, this.v) ? quiet + 1 : 0;
      if (quiet >= 4) return true;
    }
    return false;
  }
  val(net) { return net === undefined ? 0 : this.v[net]; }
}

function sameBits(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

/* ==========================================================================
   5 · APPLICATION STATE
   ========================================================================== */

const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const MONO = 'ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace';
const SPEEDS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024];

let LIB = {};                                   // id -> chip def (see partOf/portsOf)

const S = {
  mode: 'editor',
  work: newDef('Untitled'),                     // the circuit on the board
  editing: null,                                // library id, when editing a saved chip
  cam: { x: 0, y: 0, z: 1 },
  bcam: { x: 0, y: 0, z: 1 },                   // the breadboard keeps its own camera
  sel: new Set(), selWires: new Set(),
  run: true, speedIx: 6,
  dirty: true, compiled: null, sim: null,
  armed: null,                                  // part waiting to be placed
  drag: null, hover: null,
  undo: [], redo: [],                           // the circuit's history
  bundo: [], bredo: [],                         // the breadboard keeps its own
  compileWarn: [], runWarn: [],
  ttable: null, stash: null, bsel: null, bpending: null, pressing: null, pendingWire: null,
  board: null,                                  // breadboard state (section 9)
  bsim: null, bdirty: true,
};

const cv = $('#cv');
/* Not const: the inspector's little "what it's made of" diagrams borrow the
   drawing code by pointing this at their own canvas for one frame. */
let ctx = cv.getContext('2d');
const gm = (n) => geom(n, ctx);
let VW = 0, VH = 0, DPR = 1;

let C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = (n, f) => (cs.getPropertyValue(n) || f).trim() || f;
  C = {
    bg: g('--bg', '#0f141a'), grid: g('--grid', '#1b2733'), gridStrong: g('--grid-strong', '#23323f'),
    ink: g('--ink', '#dbe6f2'), inkSoft: g('--ink-soft', '#93a5b9'), inkFaint: g('--ink-faint', '#61738a'),
    line: g('--line', '#2a3849'), panel: g('--panel', '#151d26'), panel2: g('--panel-2', '#1b2634'),
    hi: g('--wire-hi', '#ffc247'), lo: g('--wire-lo', '#41505f'), accent: g('--accent', '#ffc247'),
    sel: g('--select', '#5cc8ff'), danger: g('--danger', '#ff6b5e'), warn: g('--warn', '#ffb03a'),
    ok: g('--ok', '#4bd684'),
    chip: g('--chip', '#2f4257'), chipInk: g('--chip-ink', '#dbe6f2'),
    board: g('--board', '#e8e4d8'), boardLine: g('--board-line', '#c9c4b4'), boardHole: g('--board-hole', '#8f8b7e'),
  };
  _textW.clear();
}

function resize() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  VW = Math.max(1, Math.round(r.width)); VH = Math.max(1, Math.round(r.height));
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
}

const cam = () => (S.mode === 'editor' ? S.cam : S.bcam);
const toWorld = (sx, sy) => { const c = cam(); return { x: (sx - c.x) / c.z, y: (sy - c.y) / c.z }; };
const toScreen = (wx, wy) => { const c = cam(); return { x: wx * c.z + c.x, y: wy * c.z + c.y }; };
function pointerPos(ev) {
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

/* ==========================================================================
   6 · DRAWING THE CIRCUIT EDITOR
   ========================================================================== */

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawGrid() {
  const c = cam();
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, VW, VH);
  if (c.z < 0.35) return;
  const step = GRID * c.z * (c.z < 0.7 ? 5 : 1);
  const ox = ((c.x % step) + step) % step, oy = ((c.y % step) + step) % step;
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = ox; x < VW; x += step) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, VH); }
  for (let y = oy; y < VH; y += step) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(VW, Math.round(y) + 0.5); }
  ctx.stroke();
  // A heavier line every ten squares, so panning has a sense of scale.
  const big = step * 10;
  const bx = ((c.x % big) + big) % big, by = ((c.y % big) + big) % big;
  ctx.strokeStyle = C.gridStrong;
  ctx.beginPath();
  for (let x = bx; x < VW; x += big) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, VH); }
  for (let y = by; y < VH; y += big) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(VW, Math.round(y) + 0.5); }
  ctx.stroke();
}

/** Where a wire endpoint sits in world coordinates. */
function endPos(def, e) {
  const node = nodeById(def, e.n);
  if (!node) return null;
  const g = gm(node);
  const list = e.s === 'in' ? g.ins : g.outs;
  return list[e.i] || null;
}

function wirePath(a, b) {
  const dx = Math.abs(b.x - a.x);
  const k = clamp(dx * 0.55, 18, 110);
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.bezierCurveTo(a.x + k, a.y, b.x - k, b.y, b.x, b.y);
}

/** Sample the same bezier for hit-testing. */
function wirePoints(a, b, n = 18) {
  const dx = Math.abs(b.x - a.x);
  const k = clamp(dx * 0.55, 18, 110);
  const p = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    p.push({
      x: u * u * u * a.x + 3 * u * u * t * (a.x + k) + 3 * u * t * t * (b.x - k) + t * t * t * b.x,
      y: u * u * u * a.y + 3 * u * u * t * a.y + 3 * u * t * t * b.y + t * t * t * b.y,
    });
  }
  return p;
}

/* ---- wire ends you can pick up --------------------------------------------
   Sitting the handles a little way along the curve keeps them clear of the
   ports underneath, so grabbing a handle re-routes the wire you can see while
   grabbing the port still starts a new one. */

function wireHandles(wr) {
  const a = endPos(S.work, wr.a), b = endPos(S.work, wr.b);
  if (!a || !b) return null;
  const pts = wirePoints(a, b, 20);
  return { a: pts[2], b: pts[18] };
}

/** Handles only appear on the wire under the pointer or the selected one, so
    a crowded board does not sprout grab points everywhere. */
function liveWireIds() {
  const ids = new Set(S.selWires);
  if (S.hover && S.hover.kind === 'wire' && S.hover.wire) ids.add(S.hover.wire);
  return ids;
}

function hitWireHandle(w, touch) {
  const tol = (touch ? 16 : 11) / cam().z;
  const ids = liveWireIds();
  if (!ids.size) return null;
  for (const wr of S.work.wires) {
    if (!ids.has(wr.id)) continue;
    const hs = wireHandles(wr);
    if (!hs) continue;
    if (dist2(w.x, w.y, hs.a.x, hs.a.y) <= tol * tol) return { wire: wr, end: 'a' };
    if (dist2(w.x, w.y, hs.b.x, hs.b.y) <= tol * tol) return { wire: wr, end: 'b' };
  }
  return null;
}

/** Pull one end of a wire off and follow the pointer with it. The wire is
    lifted out of the circuit for the duration, so the drop lands it exactly
    like a fresh one — including dropping it back where it came from. */
function startRewire(wr, end, w, p) {
  pushUndo();
  S.work.wires = S.work.wires.filter((x) => x.id !== wr.id);
  const anchor = end === 'a' ? wr.b : wr.a;      // the end that stays put
  const pos = endPos(S.work, anchor);
  if (!pos) { S.work.wires.push(wr); return; }
  S.selWires.delete(wr.id);
  S.drag = {
    kind: 'wire', end: { n: anchor.n, s: anchor.s, i: anchor.i },
    from: { x: pos.x, y: pos.y }, to: { x: w.x, y: w.y },
    rev: anchor.s === 'in', restore: wr, sx0: p.x, sy0: p.y,
  };
  markDirty();
}

function netAt(nodeId, side, i) {
  const c = S.compiled;
  if (!c) return undefined;
  return c.portNet.get(nodeId + '.' + (side === 'in' ? 'i' : 'o') + i);
}
const valAt = (nodeId, side, i) => (S.sim ? S.sim.val(netAt(nodeId, side, i)) : 0);
const clashAt = (nodeId, side, i) => {
  const n = netAt(nodeId, side, i);
  return S.sim && n !== undefined ? S.sim.clash[n] : 0;
};

const SEG_BITS = [63, 6, 91, 79, 102, 109, 125, 7, 127, 111, 119, 124, 57, 94, 121, 113];

function drawSevenSeg(x, y, w, h, bits, dot, color) {
  const pad = w * 0.16, t = Math.max(3, w * 0.13);
  const x0 = x + pad, x1 = x + w - pad, ym = y + h / 2, y0 = y + pad, y1 = y + h - pad;
  const on = (i) => (bits >> i) & 1;
  const seg = (ax, ay, bx, by, i) => {
    ctx.strokeStyle = on(i) ? color : C.line;
    ctx.globalAlpha = on(i) ? 1 : 0.5;
    ctx.lineWidth = t; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.globalAlpha = 1;
  };
  const inset = t * 0.7;
  seg(x0 + inset, y0, x1 - inset, y0, 0);              // a
  seg(x1, y0 + inset, x1, ym - inset, 1);              // b
  seg(x1, ym + inset, x1, y1 - inset, 2);              // c
  seg(x0 + inset, y1, x1 - inset, y1, 3);              // d
  seg(x0, ym + inset, x0, y1 - inset, 4);              // e
  seg(x0, y0 + inset, x0, ym - inset, 5);              // f
  seg(x0 + inset, ym, x1 - inset, ym, 6);              // g
  ctx.beginPath();
  ctx.arc(x1 + t * 0.9, y1, t * 0.5, 0, 7);
  ctx.fillStyle = dot ? color : C.line; ctx.globalAlpha = dot ? 1 : 0.5;
  ctx.fill(); ctx.globalAlpha = 1;
}

function drawNode(node, ghost) {
  const g = gm(node);
  const part = node.type === 'CHIP' ? CHIP_PART : PARTS[node.type] || {};
  const selected = S.sel.has(node.id);
  const shape = part.shape || 'box';
  const chipDef = node.type === 'CHIP' ? LIB[node.chip] : null;
  ctx.globalAlpha = ghost ? 0.55 : 1;

  /* --- port stubs and dots (drawn under the body) --- */
  const drawPorts = () => {
    for (const [side, list] of [['in', g.ins], ['out', g.outs]]) {
      list.forEach((p, i) => {
        const v = ghost ? 0 : valAt(node.id, side, i);
        const bad = !ghost && clashAt(node.id, side, i);
        ctx.strokeStyle = bad ? C.danger : v ? C.hi : C.lo;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + (side === 'in' ? 5 : -5), p.y);
        ctx.stroke();
        ctx.fillStyle = bad ? C.danger : v ? C.hi : C.lo;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.4, 0, 7); ctx.fill();
        const hov = S.hover && S.hover.kind === 'port' && S.hover.node === node.id
          && S.hover.side === side && S.hover.i === i;
        if (hov) {
          ctx.strokeStyle = C.sel; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, 7); ctx.stroke();
        }
      });
    }
  };

  const body = (fill, stroke) => {
    roundRect(g.x, g.y, g.w, g.h, node.type === 'CHIP' ? 9 : 6);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke || C.line; ctx.lineWidth = 1.5; ctx.stroke();
  };

  const label = (text, color, size = 12, weight = '600') => {
    ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, g.x + g.w / 2, g.y + g.h / 2 + 0.5);
  };

  switch (shape) {
    case 'pin': {
      const isIn = node.type === 'IN';
      const v = ghost ? 0 : isIn ? (node.value ? 1 : 0) : valAt(node.id, 'in', 0);
      drawPorts();
      roundRect(g.x, g.y, g.w, g.h, node.momentary ? 15 : 7);
      ctx.fillStyle = v ? C.hi : C.panel2;
      ctx.fill();
      ctx.strokeStyle = v ? C.hi : C.line; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = v ? '#1a1206' : C.inkFaint;
      ctx.font = `700 13px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(v ? '1' : '0', g.x + g.w / 2, g.y + g.h / 2 + 0.5);
      ctx.font = `11px ${FONT}`; ctx.fillStyle = C.inkSoft;
      ctx.textAlign = isIn ? 'right' : 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(node.label || '', isIn ? g.x - 9 : g.x + g.w + 9, g.y + g.h / 2);
      break;
    }
    case 'const': {
      drawPorts();
      body(C.panel2);
      label(node.value ? '1' : '0', node.value ? C.hi : C.inkFaint, 14, '700');
      break;
    }
    case 'clock': {
      drawPorts();
      body(C.panel2);
      const v = ghost ? 0 : valAt(node.id, 'out', 0);
      ctx.strokeStyle = v ? C.hi : C.inkFaint; ctx.lineWidth = 2;
      const x = g.x + 9, y = g.y + g.h / 2, w = g.w - 18, a = 5;
      ctx.beginPath();
      ctx.moveTo(x, y + a); ctx.lineTo(x + w * 0.25, y + a); ctx.lineTo(x + w * 0.25, y - a);
      ctx.lineTo(x + w * 0.6, y - a); ctx.lineTo(x + w * 0.6, y + a); ctx.lineTo(x + w, y + a);
      ctx.stroke();
      break;
    }
    case 'led': {
      drawPorts();
      const v = ghost ? 0 : valAt(node.id, 'in', 0);
      const cx = g.x + g.w / 2, cy = g.y + g.h / 2, r = g.w / 2 - 1;
      if (v) {
        const gr = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 2.6);
        gr.addColorStop(0, node.color + 'cc'); gr.addColorStop(1, node.color + '00');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(cx, cy, r * 2.6, 0, 7); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
      ctx.fillStyle = v ? node.color : C.panel2; ctx.fill();
      ctx.strokeStyle = v ? node.color : C.line; ctx.lineWidth = 2; ctx.stroke();
      break;
    }
    case 'seg7': {
      drawPorts();
      body(C.panel2);
      let bits = 0, dot = 0;
      if (!ghost) {
        if (node.type === 'HEX') {
          const n = (valAt(node.id, 'in', 0) << 3) | (valAt(node.id, 'in', 1) << 2)
            | (valAt(node.id, 'in', 2) << 1) | valAt(node.id, 'in', 3);
          bits = SEG_BITS[n];
        } else {
          for (let i = 0; i < 7; i++) bits |= valAt(node.id, 'in', i) << i;
          dot = valAt(node.id, 'in', 7);
        }
      }
      const dh = g.h - 24, dw = Math.min(g.w - 34, dh * 0.58);
      drawSevenSeg(g.x + (g.w - dw) / 2 + 8, g.y + 12, dw, dh, bits, dot, node.color || C.accent);
      ctx.font = `10px ${FONT}`; ctx.fillStyle = C.inkFaint;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      g.ins.forEach((p) => ctx.fillText(p.name, p.x + 7, p.y));
      break;
    }
    case 'joint': {
      const v = ghost ? 0 : valAt(node.id, 'in', 0);
      ctx.fillStyle = v ? C.hi : C.lo;
      ctx.beginPath(); ctx.arc(g.x + g.w / 2, g.y + g.h / 2, g.w / 2, 0, 7); ctx.fill();
      break;
    }
    case 'tunnel': {
      drawPorts();
      const v = ghost ? 0 : valAt(node.id, 'in', 0);
      ctx.beginPath();
      ctx.moveTo(g.x + 6, g.y); ctx.lineTo(g.x + g.w - 6, g.y);
      ctx.lineTo(g.x + g.w, g.y + g.h / 2); ctx.lineTo(g.x + g.w - 6, g.y + g.h);
      ctx.lineTo(g.x + 6, g.y + g.h); ctx.lineTo(g.x, g.y + g.h / 2);
      ctx.closePath();
      ctx.fillStyle = C.panel2; ctx.fill();
      ctx.strokeStyle = v ? C.hi : C.line; ctx.lineWidth = 1.5; ctx.stroke();
      label(node.label || 'net', v ? C.hi : C.inkSoft, 11, '500');
      break;
    }
    default: {
      drawPorts();
      const fill = chipDef ? chipDef.color : (GATE_COLORS[part.cat] || C.chip);
      body(fill);
      const named = g.ins.some((p) => p.name) || g.outs.some((p) => p.name);
      label(g.label, C.chipInk, node.type === 'CHIP' ? 12 : 11.5, '600');
      if (named) {
        ctx.font = `9.5px ${FONT}`; ctx.fillStyle = C.chipInk; ctx.globalAlpha = (ghost ? 0.55 : 1) * 0.65;
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        g.ins.forEach((p) => p.name && ctx.fillText(p.name, p.x + 5, p.y));
        ctx.textAlign = 'right';
        g.outs.forEach((p) => p.name && ctx.fillText(p.name, p.x - 5, p.y));
        ctx.globalAlpha = ghost ? 0.55 : 1;
      }
      if (part.bubble) {                                   // the inverting circle
        const p = g.outs[0];
        ctx.beginPath(); ctx.arc(p.x - 5, p.y, 3.2, 0, 7);
        ctx.fillStyle = C.bg; ctx.fill();
        ctx.strokeStyle = C.chipInk; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.7; ctx.stroke();
        ctx.globalAlpha = ghost ? 0.55 : 1;
      }
    }
  }

  if (selected && !ghost) {
    roundRect(g.x - 4, g.y - 4, g.w + 8, g.h + 8, 9);
    ctx.strokeStyle = C.sel; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
}

/** The circuit itself — wires then parts — with the world transform already
    applied. Split out so the inspector's diagrams can reuse it. */
function drawWorld() {
  /* wires */
  ctx.lineCap = 'round';
  for (const w of S.work.wires) {
    const a = endPos(S.work, w.a), b = endPos(S.work, w.b);
    if (!a || !b) continue;
    const net = netAt(w.a.n, w.a.s, w.a.i);
    const v = S.sim ? S.sim.val(net) : 0;
    const bad = S.sim && net !== undefined && S.sim.clash[net];
    const on = S.selWires.has(w.id);
    ctx.lineWidth = on ? 4.5 : 3;
    ctx.strokeStyle = on ? C.sel : bad ? C.danger : v ? C.hi : C.lo;
    if (v && !bad) { ctx.shadowColor = C.hi; ctx.shadowBlur = 7; }
    wirePath(a, b); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  /* grab handles on whichever wire is under the pointer or selected */
  const live = liveWireIds();
  if (live.size) {
    const r = 5.5 / cam().z;
    for (const wr of S.work.wires) {
      if (!live.has(wr.id)) continue;
      const hs = wireHandles(wr);
      if (!hs) continue;
      for (const p of [hs.a, hs.b]) {
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
        ctx.fillStyle = C.sel; ctx.fill();
        ctx.strokeStyle = C.bg; ctx.lineWidth = 2 / cam().z; ctx.stroke();
      }
    }
  }

  for (const n of S.work.nodes) drawNode(n, false);

  /* the wire currently being drawn — dragged, or waiting for its second click */
  const aim = (S.drag && S.drag.kind === 'wire') ? S.drag : S.pendingWire;
  if (aim) {
    const at = aim === S.pendingWire ? (S.hover && S.hover.world) || aim.from : aim.to;
    const land = wireLanding(aim.end, at, false);
    // Show where it would land, so you can see it has caught before letting go.
    let b = at;
    if (land.kind === 'port') {
      const t = nodeById(S.work, land.port.n);
      if (t) {
        const g = gm(t);
        const p2 = (land.port.s === 'in' ? g.ins : g.outs)[land.port.i];
        if (p2) {
          b = p2;
          ctx.beginPath(); ctx.arc(p2.x, p2.y, 11 / cam().z, 0, 7);
          ctx.strokeStyle = C.ok; ctx.lineWidth = 3 / cam().z; ctx.stroke();
        }
      }
    } else if (land.kind === 'wire') {
      const t = S.work.wires.find((x) => x.id === land.wire);
      const ea = t && endPos(S.work, t.a), eb = t && endPos(S.work, t.b);
      if (ea && eb) {
        ctx.beginPath(); ctx.arc(at.x, at.y, 8 / cam().z, 0, 7);
        ctx.strokeStyle = C.ok; ctx.lineWidth = 3 / cam().z; ctx.stroke();
      }
    }
    const a = aim.from;
    ctx.lineWidth = 2.5; ctx.strokeStyle = land.kind === 'none' ? C.lo : C.sel;
    ctx.setLineDash([6, 4]);
    wirePath(aim.rev ? b : a, aim.rev ? a : b); ctx.stroke();
    ctx.setLineDash([]);
  }


  /* the part waiting to be dropped */
  if (S.armed && S.hover && S.hover.world) {
    const g = armedGhost(S.hover.world);
    if (g) drawNode(g, true);
  }
}

function drawEditor() {
  const c = S.cam;
  drawGrid();
  ctx.save();
  ctx.translate(c.x, c.y); ctx.scale(c.z, c.z);
  drawWorld();
  ctx.restore();

  drawDeleteHandle();

  /* marquee */
  if (S.drag && S.drag.kind === 'marquee') {
    const a = toScreen(S.drag.x0, S.drag.y0), b = toScreen(S.drag.x1, S.drag.y1);
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    ctx.fillStyle = C.sel + '22'; ctx.strokeStyle = C.sel; ctx.lineWidth = 1;
    ctx.fillRect(x, y, Math.abs(b.x - a.x), Math.abs(b.y - a.y));
    ctx.strokeRect(x + 0.5, y + 0.5, Math.abs(b.x - a.x), Math.abs(b.y - a.y));
  }
}

function armedGhost(w) {
  if (!S.armed) return null;
  const n = S.armed.type === 'CHIP'
    ? makeNode('CHIP', 0, 0, { chip: S.armed.chip })
    : makeNode(S.armed.type, 0, 0);
  const g = gm(n);
  n.x = snap(w.x - g.w / 2); n.y = snap(w.y - g.h / 2);
  return n;
}

const snap = (v) => Math.round(v / GRID) * GRID;

/* ==========================================================================
   7 · EDITING — hit-testing, dragging, wiring, undo
   ========================================================================== */

function hitTest(w, touch) {
  const z = cam().z;
  const pr = (touch ? 20 : 13) / z;                // port grab radius, in world units
  const nodes = S.work.nodes;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i], g = gm(n);
    if (w.x < g.x - pr - 6 || w.x > g.x + g.w + pr + 6 || w.y < g.y - pr - 6 || w.y > g.y + g.h + pr + 6) continue;
    for (const [side, list] of [['out', g.outs], ['in', g.ins]]) {
      for (let k = 0; k < list.length; k++) {
        if (dist2(w.x, w.y, list[k].x, list[k].y) <= pr * pr) {
          return { kind: 'port', node: n.id, side, i: k, pos: list[k] };
        }
      }
    }
  }
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i], g = gm(n);
    if (w.x >= g.x && w.x <= g.x + g.w && w.y >= g.y && w.y <= g.y + g.h) return { kind: 'node', node: n.id };
  }
  const tol = (touch ? 12 : 7) / z;
  for (let i = S.work.wires.length - 1; i >= 0; i--) {
    const wr = S.work.wires[i];
    const a = endPos(S.work, wr.a), b = endPos(S.work, wr.b);
    if (!a || !b) continue;
    const pts = wirePoints(a, b, 22);
    for (let k = 0; k < pts.length - 1; k++) {
      if (segDist(w, pts[k], pts[k + 1]) <= tol) return { kind: 'wire', wire: wr.id, at: w };
    }
  }
  return { kind: 'empty' };
}

/* ---- getting rid of things ----------------------------------------------
   Three ways, because a keyboard is not always to hand: press Delete, click
   the ✕ that appears on whatever is selected, or right-click it. The ✕ is the
   one that works on a touchscreen. It is positioned in screen coordinates so
   it stays the same size however far you zoom out. */

function deleteHandle() {
  const R = 13;
  if (S.mode === 'board') {
    const p = S.board && S.board.parts.find((q) => q.id === S.bsel);
    if (!p) return null;
    const span = partSpan(p);
    let wx, wy;
    if (span) { wx = holeX(span[1]) + BB.P * 0.75; wy = holeY(4) - BB.P * 0.1; }
    else if (p.b) { wx = (holeX(p.a.c) + holeX(p.b.c)) / 2; wy = (holeY(p.a.r) + holeY(p.b.r)) / 2 - BB.P * 0.8; }
    else { wx = holeX(p.a.c) + BB.P * 0.55; wy = holeY(p.a.r) - BB.P * 0.55; }
    const s = toScreen(wx, wy);
    return { x: s.x, y: s.y, r: R };
  }
  if (S.sel.size) {
    let x1 = -Infinity, y0 = Infinity;
    for (const n of S.work.nodes) {
      if (!S.sel.has(n.id)) continue;
      const g = gm(n);
      x1 = Math.max(x1, g.x + g.w); y0 = Math.min(y0, g.y);
    }
    if (x1 === -Infinity) return null;
    const s = toScreen(x1, y0);
    return { x: s.x + 11, y: s.y - 11, r: R };
  }
  if (S.selWires.size) {
    const wr = S.work.wires.find((w) => S.selWires.has(w.id));
    if (!wr) return null;
    const a = endPos(S.work, wr.a), b = endPos(S.work, wr.b);
    if (!a || !b) return null;
    const mid = wirePoints(a, b, 10)[5];
    const s = toScreen(mid.x, mid.y);
    return { x: s.x, y: s.y - 18, r: R };
  }
  return null;
}

/** Screen-space, so call it outside the world transform. */
function drawDeleteHandle() {
  const hd = deleteHandle();
  if (!hd) return;
  ctx.beginPath(); ctx.arc(hd.x, hd.y, hd.r, 0, 7);
  ctx.fillStyle = C.danger; ctx.fill();
  ctx.strokeStyle = C.bg; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  const k = hd.r * 0.36;
  ctx.beginPath();
  ctx.moveTo(hd.x - k, hd.y - k); ctx.lineTo(hd.x + k, hd.y + k);
  ctx.moveTo(hd.x + k, hd.y - k); ctx.lineTo(hd.x - k, hd.y + k);
  ctx.stroke();
}

/** True when a press at this screen point landed on the ✕. */
function hitDeleteHandle(sx, sy) {
  const hd = deleteHandle();
  if (!hd) return false;
  const grab = hd.r + 8;                       // fingers are bigger than the dot
  return dist2(sx, sy, hd.x, hd.y) <= grab * grab;
}

/** Right-click deletes whatever is under the pointer, in either workspace. */
function deleteAt(w) {
  if (S.armCancel) { S.armCancel = false; return; }   // that click cancelled a placement
  if (S.mode === 'board') {
    const p = hitBoardPart(w);
    if (p) { boardDelete(p.id); toast('Removed. Ctrl+Z puts it back.'); }
    return;
  }
  const hit = hitTest(w);
  if (hit.kind === 'node' || hit.kind === 'port') {
    select([hit.node]); deleteSelection(); toast('Deleted. Ctrl+Z puts it back.');
  } else if (hit.kind === 'wire') {
    select([], [hit.wire]); deleteSelection(); toast('Wire cut. Ctrl+Z puts it back.');
  }
}

function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L = dx * dx + dy * dy;
  const t = L ? clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / L, 0, 1) : 0;
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}

function markDirty() { S.dirty = true; scheduleSave(); }

/* One gesture, one undo step. Re-routing a wire removes it and adds another,
   and dropping one in space leaves a joint behind as well — without this you
   would have to press undo two or three times to take back a single drag. */
function beginBatch() { S.batching = true; S.batched = false; }
function endBatch() { S.batching = false; S.batched = false; }

/* History. Each workspace keeps its own stack, so undoing on the breadboard
   never reaches behind you and changes the circuit. */
const hist = () => (S.mode === 'board'
  ? { undo: S.bundo, redo: S.bredo, read: () => JSON.stringify(S.board, noScratch) }
  : { undo: S.undo, redo: S.redo, read: () => JSON.stringify(S.work) });

function pushUndo() {
  if (S.batching) {
    if (S.batched) return;                       // this gesture is already recorded
    S.batched = true;
  }
  const h2 = hist();
  h2.undo.push(h2.read());
  if (h2.undo.length > 200) h2.undo.shift();
  h2.redo.length = 0;
  markDirty();
  syncUndoButtons();
}
function undo() { shiftHistory('undo', 'redo'); }
function redo() { shiftHistory('redo', 'undo'); }

function shiftHistory(from, to) {
  const h2 = hist();
  if (!h2[from].length) return;
  h2[to].push(h2.read());
  const state = JSON.parse(h2[from].pop());
  if (S.mode === 'board') { S.board = state; S.bsel = null; S.bdirty = true; scheduleSave(); }
  else { S.work = state; S.sel.clear(); S.selWires.clear(); markDirty(); }
  syncUndoButtons(); renderInspector();
}
function syncUndoButtons() {
  const h2 = hist();
  $('#btn-undo').disabled = !h2.undo.length;
  $('#btn-redo').disabled = !h2.redo.length;
}

function select(ids, wires, add) {
  if (!add) { S.sel.clear(); S.selWires.clear(); }
  (ids || []).forEach((i) => S.sel.add(i));
  (wires || []).forEach((i) => S.selWires.add(i));
  renderInspector();
}

function placeNode(type, wx, wy, extra) {
  if (type === 'CHIP' && S.editing && chipContains(extra.chip, S.editing)) {
    toast('A chip cannot contain itself.', true);
    return null;
  }
  pushUndo();
  const n = makeNode(type, 0, 0, extra);
  const g = gm(n);
  n.x = snap(wx - g.w / 2); n.y = snap(wy - g.h / 2);
  S.work.nodes.push(n);
  select([n.id]);
  return n;
}

function deleteSelection() {
  if (!S.sel.size && !S.selWires.size) return;
  pushUndo();
  S.work.nodes = S.work.nodes.filter((n) => !S.sel.has(n.id));
  S.work.wires = S.work.wires.filter(
    (w) => !S.selWires.has(w.id) && !S.sel.has(w.a.n) && !S.sel.has(w.b.n));
  S.sel.clear(); S.selWires.clear();
  renderInspector();
}

function duplicateSelection() {
  if (!S.sel.size) return;
  pushUndo();
  const map = new Map();
  const copies = [];
  for (const n of S.work.nodes) {
    if (!S.sel.has(n.id)) continue;
    const c = clone(n); c.id = uid(); c.x += 20; c.y += 20;
    map.set(n.id, c.id); copies.push(c);
  }
  const newWires = S.work.wires
    .filter((w) => map.has(w.a.n) && map.has(w.b.n))
    .map((w) => ({ id: uid(), a: { n: map.get(w.a.n), s: w.a.s, i: w.a.i }, b: { n: map.get(w.b.n), s: w.b.s, i: w.b.i } }));
  S.work.nodes.push(...copies); S.work.wires.push(...newWires);
  select(copies.map((c) => c.id));
}

/** Wires always run output -> input. Re-driving an input replaces its wire. */
function addWire(a, b) {
  if (a.s === 'in') { const t = a; a = b; b = t; }
  if (a.s !== 'out' || b.s !== 'in') { toast('Wires run from an output to an input.', true); return null; }
  if (a.n === b.n && a.i === b.i) return null;
  const dup = S.work.wires.some((w) => w.a.n === a.n && w.a.i === a.i && w.b.n === b.n && w.b.i === b.i);
  if (dup) return null;
  pushUndo();
  S.work.wires = S.work.wires.filter((w) => !(w.b.n === b.n && w.b.i === b.i));
  const w = { id: uid(), a: { n: a.n, s: 'out', i: a.i }, b: { n: b.n, s: 'in', i: b.i } };
  S.work.wires.push(w);
  return w;
}

/* ---- landing a wire ------------------------------------------------------
   Wiring should not demand a steady hand. A wire being drawn looks for the
   nearest port it could legally land on, well beyond the port itself, and
   shows you which one it has picked before you let go. */

const SNAP_PX = 55;

function snapTarget(w, want, from) {
  const r = SNAP_PX / cam().z;
  let best = null, bd = r * r;
  for (const n of S.work.nodes) {
    const g = gm(n);
    const list = want === 'in' ? g.ins : g.outs;
    for (let i = 0; i < list.length; i++) {
      if (from && from.n === n.id && from.i === i && from.s === want) continue;
      const d = dist2(w.x, w.y, list[i].x, list[i].y);
      if (d < bd) { bd = d; best = { n: n.id, s: want, i, pos: list[i] }; }
    }
  }
  return best;
}

/** Cut a joint into an existing wire, so several wires can meet at one point. */
function spliceJoint(wire, at) {
  const j = makeNode('JOINT', 0, 0);
  const g = gm(j);
  j.x = snap(at.x - g.w / 2); j.y = snap(at.y - g.h / 2);
  S.work.nodes.push(j);
  S.work.wires = S.work.wires.filter((x) => x.id !== wire.id);
  S.work.wires.push({ id: uid(), a: { ...wire.a }, b: { n: j.id, s: 'in', i: 0 } });
  S.work.wires.push({ id: uid(), a: { n: j.id, s: 'out', i: 0 }, b: { ...wire.b } });
  return j;
}

/** Where a wire being drawn would land right now, if you let go here. */
function wireLanding(end, w, touch) {
  const want = end.s === 'out' ? 'in' : 'out';
  const hit = hitTest(w, touch);
  if (hit.kind === 'wire') return { kind: 'wire', wire: hit.wire, want };
  if (hit.kind === 'node') {
    const port = resolveDrop(hit, want, w);
    if (port) return { kind: 'port', port, want };
  }
  const near = snapTarget(w, want, end);
  if (near) return { kind: 'port', port: near, want };
  if (hit.kind === 'empty') return { kind: 'empty', want };
  return { kind: 'none', want };
}

/** Finish a wire that is being drawn, wherever it happens to be pointing.
    `fromClick` is the click-then-click flow: a click on nothing means the
    person changed their mind, whereas dragging a wire out into open space and
    letting go there is a deliberate request for a junction. */
function landWire(end, w, touch, restore, fromClick) {
  const land = wireLanding(end, w, touch);
  if (fromClick && (land.kind === 'empty' || land.kind === 'none')) {
    if (restore) { S.work.wires.push(restore); markDirty(); }
    toast('Nothing there to connect to — wire cancelled.');
    return null;
  }
  let made = null;
  if (land.kind === 'wire') {
    const target = S.work.wires.find((x) => x.id === land.wire);
    if (target) {
      if (end.s === 'out') toast('Two outputs cannot share a wire. Aim at an input.', true);
      else {
        // Tapping into an existing wire: put a junction where you dropped it.
        pushUndo();
        const j = spliceJoint(target, w);
        made = addWire({ n: j.id, s: 'out', i: 0 }, end);
      }
    }
  } else if (land.kind === 'port') {
    if (!(land.port.n === end.n && land.port.i === end.i && land.port.s === end.s)) {
      made = addWire(end, { n: land.port.n, s: land.port.s, i: land.port.i });
    }
  } else if (land.kind === 'empty') {
    const j = placeNode('JOINT', w.x, w.y);
    if (j) made = addWire(end, { n: j.id, s: land.want, i: 0 });
  }
  if (made) select([], [made.id]);
  else if (restore) { S.work.wires.push(restore); markDirty(); select([], [restore.id]); }
  return made;
}

/** Dropping on a node body (not exactly on a port) still connects: pick the
    nearest port on the side we need, preferring one that is still free. */
function resolveDrop(hit, want, at) {
  if (hit.kind === 'port') return hit.side === want ? { n: hit.node, s: hit.side, i: hit.i } : null;
  if (hit.kind !== 'node') return null;
  const node = nodeById(S.work, hit.node);
  if (!node) return null;
  const g = gm(node);
  const list = want === 'in' ? g.ins : g.outs;
  if (!list.length) return null;
  const taken = (i) => want === 'in' && S.work.wires.some((w) => w.b.n === node.id && w.b.i === i);
  let best = -1, bestD = Infinity, bestFree = -1, bestFreeD = Infinity;
  list.forEach((p, i) => {
    const d = Math.abs(p.y - at.y);
    if (d < bestD) { bestD = d; best = i; }
    if (!taken(i) && d < bestFreeD) { bestFreeD = d; bestFree = i; }
  });
  const i = bestFree >= 0 ? bestFree : best;
  return { n: node.id, s: want, i };
}

/* ---- pointer plumbing --------------------------------------------------- */

const ptrs = new Map();
let spaceDown = false;
let pinch = null;

cv.addEventListener('pointerdown', (ev) => {
  cv.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId, pointerPos(ev));
  if (ptrs.size === 2) { startPinch(); return; }
  if (ptrs.size > 2) return;

  /* The ✕ on the selection sits above everything, in both workspaces. */
  const sp = pointerPos(ev);
  if (ev.button === 0 && hitDeleteHandle(sp.x, sp.y)) {
    if (S.mode === 'board') boardDelete(); else deleteSelection();
    toast('Deleted. Ctrl+Z puts it back.');
    return;
  }
  if (S.mode === 'board') { boardDown(ev); return; }

  const p = sp;
  const w = toWorld(p.x, p.y);
  const touch = ev.pointerType === 'touch';

  if (ev.button === 1 || ev.button === 2 || spaceDown) {
    S.drag = { kind: 'pan', sx: p.x, sy: p.y, cx: S.cam.x, cy: S.cam.y, btn: ev.button };
    return;
  }
  if (S.armed) {
    placeNode(S.armed.type, w.x, w.y, S.armed.type === 'CHIP' ? { chip: S.armed.chip } : null);
    if (!ev.shiftKey) armPart(null);
    return;
  }

  /* a wire waiting for its second click */
  if (S.pendingWire) {
    const pend = S.pendingWire;
    S.pendingWire = null;
    landWire(pend.end, w, touch, pend.restore, true);
    endBatch();
    return;
  }

  /* an end of the wire you are pointing at, lifted off and re-routed */
  const handle = hitWireHandle(w, touch);
  if (handle) {
    beginBatch();
    startRewire(handle.wire, handle.end, w, p);
    return;
  }

  const hit = hitTest(w, touch);
  if (hit.kind === 'port') {
    // An input takes only one wire, so grabbing a connected one pulls the plug
    // out rather than starting a second wire that would replace it anyway.
    if (hit.side === 'in') {
      const plugged = S.work.wires.find((x) => x.b.n === hit.node && x.b.i === hit.i);
      if (plugged) { beginBatch(); startRewire(plugged, 'b', w, p); return; }
    }
    const pos = hit.pos;
    beginBatch();
    S.drag = {
      kind: 'wire', end: { n: hit.node, s: hit.side, i: hit.i },
      from: { x: pos.x, y: pos.y }, to: { x: w.x, y: w.y }, rev: hit.side === 'in',
      sx0: p.x, sy0: p.y,
    };
    return;
  }
  if (hit.kind === 'node') {
    const node = nodeById(S.work, hit.node);
    if (!S.sel.has(node.id)) select([node.id], [], ev.shiftKey);
    else if (ev.shiftKey) { S.sel.delete(node.id); renderInspector(); return; }
    if (node.type === 'IN' && node.momentary) { node.value = 1; }
    S.drag = {
      kind: 'move', sx: p.x, sy: p.y, moved: false, node: node.id,
      start: S.work.nodes.filter((n) => S.sel.has(n.id)).map((n) => ({ n, x: n.x, y: n.y })),
    };
    return;
  }
  if (hit.kind === 'wire') {
    // The middle of a wire still branches: drag from it and you get a second
    // wire out of the same output, which is how one signal feeds many inputs.
    const wr = S.work.wires.find((x) => x.id === hit.wire);
    select([], [wr.id], ev.shiftKey);
    const a = endPos(S.work, wr.a);
    beginBatch();
    S.drag = { kind: 'branch', end: { ...wr.a }, from: { x: a.x, y: a.y }, to: { x: w.x, y: w.y }, sx: p.x, sy: p.y, moved: false };
    return;
  }
  if (touch) { S.drag = { kind: 'pan', sx: p.x, sy: p.y, cx: S.cam.x, cy: S.cam.y }; return; }
  if (!ev.shiftKey) select([]);
  S.drag = { kind: 'marquee', x0: w.x, y0: w.y, x1: w.x, y1: w.y, add: ev.shiftKey };
});

cv.addEventListener('pointermove', (ev) => {
  if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, pointerPos(ev));
  if (pinch && ptrs.size >= 2) { movePinch(); return; }
  const p = pointerPos(ev);
  const w = toWorld(p.x, p.y);
  if (S.mode === 'board') { boardMove(ev, p, w); return; }

  const d = S.drag;
  if (!d) {
    const touch = ev.pointerType === 'touch';
    const onHandle = hitWireHandle(w, touch);
    const hit = hitTest(w, touch);
    S.hover = hit.kind === 'port'
      ? { kind: 'port', node: hit.node, side: hit.side, i: hit.i, world: w }
      : hit.kind === 'wire'
        ? { kind: 'wire', wire: hit.wire, world: w }
        : { kind: hit.kind, world: w };
    cv.style.cursor = S.pendingWire ? 'crosshair' : onHandle ? 'grab'
      : hit.kind === 'port' ? 'crosshair'
        : hit.kind === 'node' ? 'move' : S.armed ? 'copy' : 'default';
    return;
  }
  S.hover = { kind: 'drag', world: w };
  switch (d.kind) {
    case 'pan':
      S.cam.x = d.cx + (p.x - d.sx); S.cam.y = d.cy + (p.y - d.sy);
      break;
    case 'move': {
      const dx = (p.x - d.sx) / S.cam.z, dy = (p.y - d.sy) / S.cam.z;
      if (Math.abs(p.x - d.sx) + Math.abs(p.y - d.sy) > 3) {
        if (!d.moved) { d.moved = true; pushUndo(); }
        for (const s of d.start) { s.n.x = snap(s.x + dx); s.n.y = snap(s.y + dy); }
      }
      break;
    }
    case 'branch':
      if (Math.abs(p.x - d.sx) + Math.abs(p.y - d.sy) > 4) d.moved = true;
      d.to = w;
      if (d.moved) { S.drag = { kind: 'wire', end: d.end, from: d.from, to: w, rev: false, sx0: d.sx, sy0: d.sy }; }
      break;
    case 'wire':
      d.to = w;
      break;
    case 'marquee':
      d.x1 = w.x; d.y1 = w.y;
      break;
  }
});

function finishDrag(ev) {
  const d = S.drag;
  S.drag = null;
  if (!d) return;
  const p = pointerPos(ev);
  const w = toWorld(p.x, p.y);
  if (d.kind === 'pan') {
    // A right-click that did not turn into a pan means "delete this".
    if (d.btn === 2 && Math.abs(p.x - d.sx) + Math.abs(p.y - d.sy) < 5) deleteAt(w);
    return;
  }
  if (d.kind === 'wire') {
    const touch = ev.pointerType === 'touch';
    const slack = touch ? 12 : 6;
    if (Math.abs(p.x - (d.sx0 || p.x)) + Math.abs(p.y - (d.sy0 || p.y)) < slack) {
