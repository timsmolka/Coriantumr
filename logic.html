    if (!a2 || !b2) { lines.push(null); continue; }
    const pts = wireRoute(w, a2, b2) || wirePoints(a2, b2, 14);
    lines.push({ pts, box: boxOf(pts) });
  }
  const hops = [];
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    if (!L) continue;
    for (let j = 0; j < i; j++) {
      const M = lines[j];
      if (!M || !boxesMeet(L.box, M.box)) continue;
      for (let a3 = 0; a3 < L.pts.length - 1; a3++) {
        for (let b3 = 0; b3 < M.pts.length - 1; b3++) {
          const c = crossAt(L.pts[a3], L.pts[a3 + 1], M.pts[b3], M.pts[b3 + 1]);
          if (c) hops.push({ wire: i, x: c.x, y: c.y, dx: c.dx / c.len, dy: c.dy / c.len });
        }
      }
    }
  }
  /* A wire that could not get round something goes over it — and says so, at
     the edge it crosses, so a line disappearing behind a chip is never mistaken
     for a line that stops there. */
  const rects = wireObstacles();
  for (let i = 0; i < lines.length; i++) {
    const L = lines[i];
    if (!L) continue;
    const own = new Set([S.work.wires[i].a.n, S.work.wires[i].b.n]);
    for (const r of rects) {
      if (own.has(r.id)) continue;
      if (!boxesMeet(L.box, r)) continue;
      const edges = [
        [{ x: r.x0, y: r.y0 }, { x: r.x1, y: r.y0 }], [{ x: r.x1, y: r.y0 }, { x: r.x1, y: r.y1 }],
        [{ x: r.x1, y: r.y1 }, { x: r.x0, y: r.y1 }], [{ x: r.x0, y: r.y1 }, { x: r.x0, y: r.y0 }],
      ];
      for (let a3 = 0; a3 < L.pts.length - 1; a3++) {
        for (const e of edges) {
          const c = crossAt(L.pts[a3], L.pts[a3 + 1], e[0], e[1]);
          if (c) hops.push({ wire: i, x: c.x, y: c.y, dx: c.dx / c.len, dy: c.dy / c.len });
        }
      }
    }
  }
  hopCache = { key, hops };
  return hops;
}

/** Mark a crossing on the wire passing over it. Neither wire breaks — the
    tick is a flag, not a repair, so it is drawn in a colour no wire ever is,
    and never the live on/off/selected colour of either signal. That is what
    keeps it reading as "these do not touch" rather than as a third wire. */
function drawHop(hop) {
  const ang = Math.atan2(hop.dy, hop.dx);
  ctx.save();
  ctx.translate(hop.x, hop.y);
  ctx.rotate(ang);
  ctx.strokeStyle = C.inkFaint; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -HOP_TICK); ctx.lineTo(0, HOP_TICK); ctx.stroke();
  ctx.restore();
}

/** Trace a route with its corners rounded, or the old curve when there is none. */
function strokeRoute(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i - 1], c = pts[i], n = pts[i + 1];
    const d1 = Math.hypot(c.x - p.x, c.y - p.y), d2 = Math.hypot(n.x - c.x, n.y - c.y);
    const r = Math.min(WIRE_ROUND, d1 / 2, d2 / 2);
    if (r < 0.6) { ctx.lineTo(c.x, c.y); continue; }
    ctx.lineTo(c.x - (c.x - p.x) / d1 * r, c.y - (c.y - p.y) / d1 * r);
    ctx.quadraticCurveTo(c.x, c.y, c.x + (n.x - c.x) / d2 * r, c.y + (n.y - c.y) / d2 * r);
  }
  const last = pts[pts.length - 1];
  ctx.lineTo(last.x, last.y);
}

function wirePath(a, b, wr) {
  const pts = wr && wireRoute(wr, a, b);
  if (pts) { strokeRoute(pts); return; }
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  /* Level ends get a real straight line rather than a curve that merely looks
     like one — the whole point of lining parts up is being able to see that
     they are lined up. */
  if (Math.abs(b.y - a.y) < 0.5 || Math.abs(b.x - a.x) < 0.5) { ctx.lineTo(b.x, b.y); return; }
  const k = clamp(Math.abs(b.x - a.x) * 0.55, 18, 110);
  ctx.bezierCurveTo(a.x + k, a.y, b.x - k, b.y, b.x, b.y);
}

/** Sample the same bezier for hit-testing. */
function wirePoints(a, b, n = 18, wr) {
  /* must follow whatever wirePath drew, or clicking a wire would miss it by
     however far the drawn line is from the one being tested */
  const route = wr && wireRoute(wr, a, b);
  if (route) {
    let total = 0;
    for (let i = 1; i < route.length; i++) total += Math.hypot(route[i].x - route[i - 1].x, route[i].y - route[i - 1].y);
    const out = [];
    for (let i = 0; i <= n; i++) {
      let want = total * (i / n), j = 1;
      for (; j < route.length; j++) {
        const len = Math.hypot(route[j].x - route[j - 1].x, route[j].y - route[j - 1].y);
        if (want <= len || j === route.length - 1) {
          const t = len ? want / len : 0;
          out.push({ x: route[j - 1].x + (route[j].x - route[j - 1].x) * t,
            y: route[j - 1].y + (route[j].y - route[j - 1].y) * t });
          break;
        }
        want -= len;
      }
    }
    return out;
  }
  const dx = Math.abs(b.x - a.x);
  const k = clamp(dx * 0.55, 18, 110);
  /* must follow the same rule wirePath draws by, or clicking a straightened
     wire would miss it by the width of the curve that is no longer there */
  if (Math.abs(b.y - a.y) < 0.5 || Math.abs(b.x - a.x) < 0.5) {
    const line = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      line.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
    }
    return line;
  }
  const p = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t;
    p.push({
      x: u * u * u * a.x + 3 * u * u * t * (a.x + k) + 3 * u * t * t * (b.x - k) + t * t * t * b.x,
      y: u * u * u * a.y + 3 * u * u * t * a.y + 3 * u * t * t * b.y + t * t * t * b.y,
    });
  }
  return p;
}

/* ---- wire ends you can pick up --------------------------------------------
   Sitting the handles a little way along the curve keeps them clear of the
   ports underneath, so grabbing a handle re-routes the wire you can see while
   grabbing the port still starts a new one. */

function wireHandles(wr) {
  const a = endPos(S.work, wr.a), b = endPos(S.work, wr.b);
  if (!a || !b) return null;
  const pts = wirePoints(a, b, 20, wr);
  return { a: pts[2], b: pts[18] };
}

/** Handles only appear on the wire under the pointer or the selected one, so
    a crowded board does not sprout grab points everywhere. */
function liveWireIds() {
  const ids = new Set(S.selWires);
  if (S.hover && S.hover.kind === 'wire' && S.hover.wire) ids.add(S.hover.wire);
  return ids;
}

function hitWireHandle(w, touch) {
  const tol = (touch ? 16 : 11) / cam().z;
  const ids = liveWireIds();
  if (!ids.size) return null;
  for (const wr of S.work.wires) {
    if (!ids.has(wr.id)) continue;
    const hs = wireHandles(wr);
    if (!hs) continue;
    if (dist2(w.x, w.y, hs.a.x, hs.a.y) <= tol * tol) return { wire: wr, end: 'a' };
    if (dist2(w.x, w.y, hs.b.x, hs.b.y) <= tol * tol) return { wire: wr, end: 'b' };
  }
  return null;
}

/** Pull one end of a wire off and follow the pointer with it. The wire is
    lifted out of the circuit for the duration, so the drop lands it exactly
    like a fresh one — including dropping it back where it came from. */
function startRewire(wr, end, w, p) {
  pushUndo();
  S.work.wires = S.work.wires.filter((x) => x.id !== wr.id);
  const anchor = end === 'a' ? wr.b : wr.a;      // the end that stays put
  const pos = endPos(S.work, anchor);
  if (!pos) { S.work.wires.push(wr); return; }
  S.selWires.delete(wr.id);
  S.drag = {
    kind: 'wire', end: { n: anchor.n, s: anchor.s, i: anchor.i },
    from: { x: pos.x, y: pos.y }, to: { x: w.x, y: w.y },
    rev: anchor.s === 'in', restore: wr, sx0: p.x, sy0: p.y,
  };
  markDirty();
}

function netAt(nodeId, side, i) {
  const c = S.compiled;
  if (!c) return undefined;
  return c.portNet.get(nodeId + '.' + (side === 'in' ? 'i' : 'o') + i);
}
const valAt = (nodeId, side, i) => (S.sim ? S.sim.val(netAt(nodeId, side, i)) : 0);
const clashAt = (nodeId, side, i) => {
  const n = netAt(nodeId, side, i);
  return S.sim && n !== undefined ? S.sim.clash[n] : 0;
};

const SEG_BITS = [63, 6, 91, 79, 102, 109, 125, 7, 127, 111, 119, 124, 57, 94, 121, 113];

function drawSevenSeg(x, y, w, h, bits, dot, color) {
  const pad = w * 0.16, t = Math.max(3, w * 0.13);
  const x0 = x + pad, x1 = x + w - pad, ym = y + h / 2, y0 = y + pad, y1 = y + h - pad;
  const on = (i) => (bits >> i) & 1;
  const seg = (ax, ay, bx, by, i) => {
    ctx.strokeStyle = on(i) ? color : C.line;
    ctx.globalAlpha = on(i) ? 1 : 0.5;
    ctx.lineWidth = t; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.globalAlpha = 1;
  };
  const inset = t * 0.7;
  seg(x0 + inset, y0, x1 - inset, y0, 0);              // a
  seg(x1, y0 + inset, x1, ym - inset, 1);              // b
  seg(x1, ym + inset, x1, y1 - inset, 2);              // c
  seg(x0 + inset, y1, x1 - inset, y1, 3);              // d
  seg(x0, ym + inset, x0, y1 - inset, 4);              // e
  seg(x0, y0 + inset, x0, ym - inset, 5);              // f
  seg(x0 + inset, ym, x1 - inset, ym, 6);              // g
  ctx.beginPath();
  ctx.arc(x1 + t * 0.9, y1, t * 0.5, 0, 7);
  ctx.fillStyle = dot ? color : C.line; ctx.globalAlpha = dot ? 1 : 0.5;
  ctx.fill(); ctx.globalAlpha = 1;
}

/* ---- the drawn shapes of the gates ---------------------------------------
   The distinctive shapes every schematic in the world uses: a D for AND, a
   shield with a pointed nose for OR, a triangle for a plain pass-through, an
   extra curved back for XOR, and a small circle on the nose for the inverting
   half of each pair. The name stays written inside, because a beginner reading
   this has not learned the shapes yet — that is the whole point of showing
   both. The box the shape is drawn in is exactly the box that was there
   before, so ports, wires and hit-testing are untouched. */
const GATE_SHAPE = {
  AND: 'and', NAND: 'and',
  OR: 'or', NOR: 'or',
  XOR: 'xor', XNOR: 'xor',
  NOT: 'tri', BUF: 'tri',
};

/** Trace a gate outline into the current path. `bw` is how much of the width
    the body may use; the rest is left for the inverting circle. */
function gateSymbolPath(c, kind, x, y, w, h, bubble) {
  const bw = w - (bubble ? 7 : 0);
  const my = y + h / 2;
  c.beginPath();
  if (kind === 'and') {
    const flat = x + bw * 0.42;
    c.moveTo(x, y);
    c.lineTo(flat, y);
    c.bezierCurveTo(flat + bw * 0.78, y, flat + bw * 0.78, y + h, flat, y + h);
    c.lineTo(x, y + h);
    c.closePath();
    return;
  }
  if (kind === 'tri') {
    c.moveTo(x, y); c.lineTo(bw + x, my); c.lineTo(x, y + h);
    c.closePath();
    return;
  }
  /* or / xor: the back dishes inwards, the front comes to a nose */
  const back = kind === 'xor' ? x + 6 : x;      // xor keeps room for its second line
  c.moveTo(back, y);
  c.quadraticCurveTo(back + bw * 0.5, y, x + bw, my);
  c.quadraticCurveTo(back + bw * 0.5, y + h, back, y + h);
  c.quadraticCurveTo(back + bw * 0.22, my, back, y);
  c.closePath();
}

/** The second, outer back line that tells an XOR from an OR. */
function xorBackPath(c, x, y, h) {
  c.beginPath();
  c.moveTo(x, y);
  c.quadraticCurveTo(x + 9, y + h / 2, x, y + h);
}

/** Which ports have a wire on them. Rebuilt once at the top of each frame —
    every port on the board asks, so working it out on demand would walk the
    whole wire list once per port. */
let wired = new Set();
function refreshWiredPorts() {
  wired.clear();
  for (const w of S.work.wires) {
    wired.add(w.a.n + 'out' + w.a.i);
    wired.add(w.b.n + 'in' + w.b.i);
  }
}
const wiredPorts = () => wired;

function drawNode(node, ghost) {
  const world = gm(node);
  const part = node.type === 'CHIP' ? CHIP_PART : PARTS[node.type] || {};

  /* Everything below draws the part upright; the canvas is turned instead, so
     none of the shape code has to know about angles. Text is the exception —
     an upside-down NAND is a NAND, but upside-down lettering is just wrong —
     so `upright` spins the frame back for the length of one word. */
  const rot = world.rot;
  const cx = world.x + world.w / 2, cy = world.y + world.h / 2;
  if (rot) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(rot * Math.PI / 180); ctx.translate(-cx, -cy);
  }
  /* At a quarter turn the part is tall and narrow, and a label held horizontal
     hangs out either side of it. So the writing rides with the part — it reads
     like the spine of a book, which is what a turned part wants. Half a turn is
     the exception: the box is the same shape either way, and riding with it
     would only put the writing upside down. */
  const flip = rot === 180 ? 180 : 0;
  const upright = (x, y, fn) => {
    if (!flip) { fn(x, y); return; }
    ctx.save();
    ctx.translate(x, y); ctx.rotate(-flip * Math.PI / 180);
    fn(0, 0);
    ctx.restore();
  };
  const done = () => { if (rot) ctx.restore(); };

  const g = { ...world, x: world.up.x, y: world.up.y, w: world.up.w, h: world.up.h };
  /* ports, in the upright frame the canvas transform will turn for us */
  {
    const p = portsOf(node);
    const rows = Math.max(p.ins.length, p.outs.length, 1);
    const gap = (count, i) => (part.shape === 'joint' || count <= 1
      ? g.h / 2 : (g.h - (count - 1) * PORT_GAP) / 2 + i * PORT_GAP);
    g.ins = p.ins.map((name, i) => ({ name, x: g.x, y: g.y + gap(p.ins.length, i) }));
    g.outs = p.outs.map((name, i) => ({ name, x: g.x + g.w, y: g.y + gap(p.outs.length, i) }));
    void rows;
  }
  const selected = S.sel.has(node.id);
  const shape = part.shape || 'box';
  const chipDef = node.type === 'CHIP' ? LIB[node.chip] : null;
  ctx.globalAlpha = ghost ? 0.55 : 1;

  /* --- ports (drawn under the body) -------------------------------------
     A port that has a wire on it needs no decoration: the wire is already
     there, running up to the edge of the part, and anything drawn on top of
     its end can only be a lump on an otherwise clean line. Every port used to
     get a stub and a dot nearly seven across — more than twice the width of
     the wire — so every connection on the board ended in a little whisker
     poking out past the body.

     What the marks were really for is the ports with nothing on them: those
     still need to say "you can attach here", so they keep a dot, and it is
     drawn no wider than a wire. Hovering rings whichever port you are pointing
     at, connected or not, which is what tells you where a wire would land. */
  const drawPorts = () => {
    for (const [side, list] of [['in', g.ins], ['out', g.outs]]) {
      list.forEach((p, i) => {
        const v = ghost ? 0 : valAt(node.id, side, i);
        const bad = !ghost && clashAt(node.id, side, i);
        const hov = S.hover && S.hover.kind === 'port' && S.hover.node === node.id
          && S.hover.side === side && S.hover.i === i;
        if (!ghost && !hov && wiredPorts().has(node.id + side + i)) return;
        ctx.fillStyle = bad ? C.danger : v ? C.hi : C.lo;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 7); ctx.fill();
        if (hov) {
          ctx.strokeStyle = C.sel; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(p.x, p.y, 6.5, 0, 7); ctx.stroke();
        }
      });
    }
  };

  const body = (fill, stroke) => {
    roundRect(g.x, g.y, g.w, g.h, node.type === 'CHIP' ? 9 : 6);
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = stroke || C.line; ctx.lineWidth = 1.5; ctx.stroke();
  };

  const label = (text, color, size = 12, weight = '600') => {
    upright(g.x + g.w / 2, g.y + g.h / 2 + 0.5, (x, y) => {
      ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y);
    });
  };

  switch (shape) {
    case 'pin': {
      const isIn = node.type === 'IN';
      const v = ghost ? 0 : isIn ? (node.value ? 1 : 0) : valAt(node.id, 'in', 0);
      drawPorts();
      roundRect(g.x, g.y, g.w, g.h, node.momentary ? 15 : 7);
      ctx.fillStyle = v ? C.hi : C.panel2;
      ctx.fill();
      ctx.strokeStyle = v ? C.hi : C.line; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = v ? '#1a1206' : C.inkFaint;
      ctx.font = `700 13px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(v ? '1' : '0', g.x + g.w / 2, g.y + g.h / 2 + 0.5);
      ctx.font = `11px ${FONT}`; ctx.fillStyle = C.inkSoft;
      ctx.textAlign = isIn ? 'right' : 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(node.label || '', isIn ? g.x - 9 : g.x + g.w + 9, g.y + g.h / 2);
      break;
    }
    case 'const': {
      drawPorts();
      body(C.panel2);
      label(node.value ? '1' : '0', node.value ? C.hi : C.inkFaint, 14, '700');
      break;
    }
    case 'clock': {
      drawPorts();
      body(C.panel2);
      const v = ghost ? 0 : valAt(node.id, 'out', 0);
      ctx.strokeStyle = v ? C.hi : C.inkFaint; ctx.lineWidth = 2;
      const x = g.x + 9, y = g.y + g.h / 2, w = g.w - 18, a = 5;
      ctx.beginPath();
      ctx.moveTo(x, y + a); ctx.lineTo(x + w * 0.25, y + a); ctx.lineTo(x + w * 0.25, y - a);
      ctx.lineTo(x + w * 0.6, y - a); ctx.lineTo(x + w * 0.6, y + a); ctx.lineTo(x + w, y + a);
      ctx.stroke();
      break;
    }
    case 'led': {
      drawPorts();
      const v = ghost ? 0 : valAt(node.id, 'in', 0);
      const cx = g.x + g.w / 2, cy = g.y + g.h / 2, r = g.w / 2 - 1;
      if (v) {
        const gr = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 2.6);
        gr.addColorStop(0, node.color + 'cc'); gr.addColorStop(1, node.color + '00');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(cx, cy, r * 2.6, 0, 7); ctx.fill();
      }
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7);
      ctx.fillStyle = v ? node.color : C.panel2; ctx.fill();
      ctx.strokeStyle = v ? node.color : C.line; ctx.lineWidth = 2; ctx.stroke();
      break;
    }
    case 'seg7': {
      drawPorts();
      body(C.panel2);
      let bits = 0, dot = 0;
      if (!ghost) {
        if (node.type === 'HEX') {
          const n = (valAt(node.id, 'in', 0) << 3) | (valAt(node.id, 'in', 1) << 2)
            | (valAt(node.id, 'in', 2) << 1) | valAt(node.id, 'in', 3);
          bits = SEG_BITS[n];
        } else {
          for (let i = 0; i < 7; i++) bits |= valAt(node.id, 'in', i) << i;
          dot = valAt(node.id, 'in', 7);
        }
      }
      const dh = g.h - 24, dw = Math.min(g.w - 34, dh * 0.58);
      drawSevenSeg(g.x + (g.w - dw) / 2 + 8, g.y + 12, dw, dh, bits, dot, node.color || C.accent);
      ctx.font = `10px ${FONT}`; ctx.fillStyle = C.inkFaint;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      g.ins.forEach((p) => ctx.fillText(p.name, p.x + 7, p.y));
      break;
    }
    case 'num': {
      drawPorts();
      body(C.panel2);
      const bits = node.bits || 8;
      let val = 0;
      if (ghost) val = 0;
      else if (node.type === 'NUMIN') val = node.value | 0;
      else for (let i = 0; i < bits; i++) val |= valAt(node.id, 'in', i) << i;
      const isIn = node.type === 'NUMIN';
      ctx.fillStyle = C.inkFaint; ctx.font = `9.5px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(isIn ? 'number in' : 'number out', g.x + g.w / 2, g.y + 13);
      ctx.fillStyle = val ? C.hi : C.inkSoft;
      ctx.font = `700 20px ${MONO}`;
      ctx.fillText(String(val), g.x + g.w / 2, g.y + g.h / 2 + 3);
      ctx.fillStyle = C.inkFaint; ctx.font = `10px ${MONO}`;
      ctx.fillText('0x' + val.toString(16).toUpperCase().padStart(Math.ceil(bits / 4), '0'),
        g.x + g.w / 2, g.y + g.h - 13);
      break;
    }
    case 'joint': {
      /* A solder dot, drawn the way a schematic draws one: a little fatter
         than the wire, so it reads as deliberate rather than as two wires
         happening to cross — and no fatter, because a blob the size of a gate
         is not a join, it is an obstruction. Wires are three units wide, so
         seven across is the right dot; it is a fixed size rather than half the
         part's box, which is what let it grow into a ball. */
      /* Just the dot. There used to be a stub drawn from the middle towards
         each wire meeting here, to make the join read as a T or a cross — but
         it was aimed at the far END of the wire, and a wire leaves square and
         then turns, so the stub pointed nowhere the wire actually went. The
         result was a dot with two or three diagonal spikes coming off it at
         angles that matched nothing on the board. The wires already run right
         up to the dot; they draw the T themselves. */
      const v = ghost ? 0 : valAt(node.id, 'in', 0);
      const cx2 = g.x + g.w / 2, cy2 = g.y + g.h / 2;
      ctx.fillStyle = v ? C.hi : C.lo;
      ctx.beginPath(); ctx.arc(cx2, cy2, JOINT_DOT, 0, 7); ctx.fill();
      if (selected && !ghost) {
        ctx.strokeStyle = C.sel; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx2, cy2, JOINT_DOT + 4, 0, 7); ctx.stroke();
      }
      break;
    }
    case 'tunnel': {
      drawPorts();
      const v = ghost ? 0 : valAt(node.id, 'in', 0);
      ctx.beginPath();
      ctx.moveTo(g.x + 6, g.y); ctx.lineTo(g.x + g.w - 6, g.y);
      ctx.lineTo(g.x + g.w, g.y + g.h / 2); ctx.lineTo(g.x + g.w - 6, g.y + g.h);
      ctx.lineTo(g.x + 6, g.y + g.h); ctx.lineTo(g.x, g.y + g.h / 2);
      ctx.closePath();
      ctx.fillStyle = C.panel2; ctx.fill();
      ctx.strokeStyle = v ? C.hi : C.line; ctx.lineWidth = 1.5; ctx.stroke();
      label(node.label || 'net', v ? C.hi : C.inkSoft, 11, '500');
      break;
    }
    default: {
      drawPorts();
      const fill = chipDef ? chipDef.color : (GATE_COLORS[part.cat] || C.chip);
      const sym = GATE_SHAPE[node.type];
      let inkX = g.x + g.w / 2;
      if (sym) {
        gateSymbolPath(ctx, sym, g.x, g.y, g.w, g.h, part.bubble);
        ctx.fillStyle = fill; ctx.fill();
        ctx.strokeStyle = C.line; ctx.lineWidth = 1.5; ctx.stroke();
        if (sym === 'xor') {
          xorBackPath(ctx, g.x, g.y, g.h);
          ctx.stroke();
        }
        /* an OR is fattest to the left of centre and a triangle to the left of
           that, so the name is nudged to where there is actually room */
        if (sym === 'or' || sym === 'xor') inkX = g.x + g.w * 0.42;
        else if (sym === 'tri') inkX = g.x + g.w * 0.36;
      } else body(fill);
      const named = g.ins.some((p) => p.name) || g.outs.some((p) => p.name);
      if (sym) {
        upright(inkX, g.y + g.h / 2 + 0.5, (x, y) => {
          ctx.fillStyle = C.chipInk;
          ctx.font = `600 ${sym === 'tri' ? 9 : 10.5}px ${FONT}`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(g.label, x, y);
        });
      } else label(g.label, C.chipInk, node.type === 'CHIP' ? 12 : 11.5, '600');
      if (named) {
        ctx.globalAlpha = (ghost ? 0.55 : 1) * 0.65;
        const pinName = (p, align, dx) => upright(p.x + dx, p.y, (x, y) => {
          ctx.font = `9.5px ${FONT}`; ctx.fillStyle = C.chipInk;
          ctx.textBaseline = 'middle'; ctx.textAlign = align;
          ctx.fillText(p.name, x, y);
        });
        g.ins.forEach((p) => p.name && pinName(p, 'left', 5));
        g.outs.forEach((p) => p.name && pinName(p, 'right', -5));
        ctx.globalAlpha = ghost ? 0.55 : 1;
      }
      if (part.bubble) {                                   // the inverting circle
        const p = g.outs[0];
        ctx.beginPath(); ctx.arc(p.x - 5, p.y, 3.2, 0, 7);
        ctx.fillStyle = C.bg; ctx.fill();
        ctx.strokeStyle = C.chipInk; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.7; ctx.stroke();
        ctx.globalAlpha = ghost ? 0.55 : 1;
      }
    }
  }

  done();                                            // back to the world frame

  /* the instance name, written above the part in the world frame so it stays
     level however the part is turned, and never inside where the type is */
  if (node.tag) {
    ctx.font = `600 10px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillStyle = C.sel;
    ctx.globalAlpha = (ghost ? 0.55 : 1) * 0.95;
    ctx.fillText(node.tag, world.x + world.w / 2, world.y - 4);
    ctx.globalAlpha = ghost ? 0.55 : 1;
  }
  if (selected && !ghost) {
    roundRect(world.x - 4, world.y - 4, world.w + 8, world.h + 8, 9);
    ctx.strokeStyle = C.sel; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]);
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
}

/** The circuit itself — wires then parts — with the world transform already
    applied. Split out so the inspector's diagrams can reuse it. */
function drawWorld() {
  refreshWiredPorts();                               // once, for every port below
  /* wires */
  ctx.lineCap = 'round';
  /* grouped by which wire carries them, so each is drawn with its own wire */
  const hopsFor = new Map();
  for (const hop of wireHops()) {
    if (!hopsFor.has(hop.wire)) hopsFor.set(hop.wire, []);
    hopsFor.get(hop.wire).push(hop);
  }
  let wi = -1;
  for (const w of S.work.wires) {
    wi++;
    const a = endPos(S.work, w.a), b = endPos(S.work, w.b);
    if (!a || !b) continue;
    const net = netAt(w.a.n, w.a.s, w.a.i);
    const v = S.sim ? S.sim.val(net) : 0;
    const bad = S.sim && net !== undefined && S.sim.clash[net];
    const on = S.selWires.has(w.id);
    ctx.lineWidth = on ? 4.5 : 3;
    ctx.strokeStyle = on ? C.sel : bad ? C.danger : v ? C.hi : C.lo;
    if (v && !bad) { ctx.shadowColor = C.hi; ctx.shadowBlur = 7; }
    wirePath(a, b, w); ctx.stroke();
    ctx.shadowBlur = 0;
    /* the ticks belonging to this wire, drawn straight after it so they land
       on top of the line they mark */
    for (const hop of hopsFor.get(wi) || []) drawHop(hop);
  }

  /* grab handles on whichever wire is under the pointer or selected */
  const live = liveWireIds();
  if (live.size) {
    const r = 5.5 / cam().z;
    for (const wr of S.work.wires) {
      if (!live.has(wr.id)) continue;
      const hs = wireHandles(wr);
      if (!hs) continue;
      for (const p of [hs.a, hs.b]) {
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7);
        ctx.fillStyle = C.sel; ctx.fill();
        ctx.strokeStyle = C.bg; ctx.lineWidth = 2 / cam().z; ctx.stroke();
      }
    }
  }

  for (const n of S.work.nodes) drawNode(n, false);

  /* the line something just snapped onto, so the jump is explained */
  if (alignGuides.length && S.drag && S.drag.kind === 'move') {
    ctx.save();
    ctx.strokeStyle = C.sel; ctx.lineWidth = 1 / S.cam.z; ctx.setLineDash([5 / S.cam.z, 4 / S.cam.z]);
    for (const g of alignGuides) {
      const pad = 28;
      ctx.beginPath();
      if (g.horiz) { ctx.moveTo(g.a - pad, g.at); ctx.lineTo(g.b + pad, g.at); }
      else { ctx.moveTo(g.at, g.a - pad); ctx.lineTo(g.at, g.b + pad); }
      ctx.stroke();
    }
    ctx.restore();
  } else if (!S.drag) alignGuides = [];

  /* the wire currently being drawn — dragged, or waiting for its second click */
  const aim = (S.drag && S.drag.kind === 'wire') ? S.drag : S.pendingWire;
  if (aim) {
    const at = aim === S.pendingWire ? (S.hover && S.hover.world) || aim.from : aim.to;
    const land = wireLanding(aim.end, at, false);
    // Show where it would land, so you can see it has caught before letting go.
    let b = at;
    if (land.kind === 'port') {
      const t = nodeById(S.work, land.port.n);
      if (t) {
        const g = gm(t);
        const p2 = (land.port.s === 'in' ? g.ins : g.outs)[land.port.i];
        if (p2) {
          b = p2;
          ctx.beginPath(); ctx.arc(p2.x, p2.y, 11 / cam().z, 0, 7);
          ctx.strokeStyle = C.ok; ctx.lineWidth = 3 / cam().z; ctx.stroke();
        }
      }
    } else if (land.kind === 'wire') {
      const t = S.work.wires.find((x) => x.id === land.wire);
      const ea = t && endPos(S.work, t.a), eb = t && endPos(S.work, t.b);
      if (ea && eb) {
        ctx.beginPath(); ctx.arc(at.x, at.y, 8 / cam().z, 0, 7);
        ctx.strokeStyle = C.ok; ctx.lineWidth = 3 / cam().z; ctx.stroke();
      }
    }
    const a = aim.from;
    ctx.lineWidth = 2.5; ctx.strokeStyle = land.kind === 'none' ? C.lo : C.sel;
    ctx.setLineDash([6, 4]);
    wirePath(aim.rev ? b : a, aim.rev ? a : b); ctx.stroke();
    ctx.setLineDash([]);
  }


  /* the part waiting to be dropped */
  if (S.armed && S.hover && S.hover.world) {
    const g = armedGhost(S.hover.world);
    if (g) drawNode(g, true);
  }
}

function drawEditor() {
  const c = S.cam;
  drawGrid();
  ctx.save();
  ctx.translate(c.x, c.y); ctx.scale(c.z, c.z);
  drawWorld();
  ctx.restore();

  drawDeleteHandle();

  /* marquee */
  if (S.drag && S.drag.kind === 'marquee') {
    const a = toScreen(S.drag.x0, S.drag.y0), b = toScreen(S.drag.x1, S.drag.y1);
    const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
    ctx.fillStyle = C.sel + '22'; ctx.strokeStyle = C.sel; ctx.lineWidth = 1;
    ctx.fillRect(x, y, Math.abs(b.x - a.x), Math.abs(b.y - a.y));
    ctx.strokeRect(x + 0.5, y + 0.5, Math.abs(b.x - a.x), Math.abs(b.y - a.y));
  }
}

function armedGhost(w) {
  if (!S.armed) return null;
  const n = S.armed.type === 'CHIP'
    ? makeNode('CHIP', 0, 0, { chip: S.armed.chip })
    : makeNode(S.armed.type, 0, 0);
  const g = gm(n);
  n.x = snap(w.x - g.w / 2); n.y = snap(w.y - g.h / 2);
  return n;
}

const snap = (v) => Math.round(v / GRID) * GRID;

/* ==========================================================================
   7 · EDITING — hit-testing, dragging, wiring, undo
   ========================================================================== */

function hitTest(w, touch) {
  const z = cam().z;
  const pr = (touch ? 20 : 13) / z;                // port grab radius, in world units
  const prJoint = (touch ? 26 : 18) / z;           // a junction is small; be kind
  const nodes = S.work.nodes;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i], g = gm(n);
    if (w.x < g.x - pr - 6 || w.x > g.x + g.w + pr + 6 || w.y < g.y - pr - 6 || w.y > g.y + g.h + pr + 6) continue;
    for (const [side, list] of [['out', g.outs], ['in', g.ins]]) {
      for (let k = 0; k < list.length; k++) {
        const reach = n.type === 'JOINT' ? prJoint : pr;
        if (dist2(w.x, w.y, list[k].x, list[k].y) <= reach * reach) {
          return { kind: 'port', node: n.id, side, i: k, pos: list[k] };
        }
      }
    }
  }
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i], g = gm(n);
    /* A junction is one grid square, which is a hard thing to hit and an
       even harder thing to hit on a phone. It gets a much bigger catch than it
       draws, and it is checked before the boxes so a junction sitting on top of
       a chip still wins its own clicks. */
    const pad = n.type === 'JOINT' ? (touch ? 16 : 10) / z : 0;
    if (w.x >= g.x - pad && w.x <= g.x + g.w + pad && w.y >= g.y - pad && w.y <= g.y + g.h + pad) {
      return { kind: 'node', node: n.id };
    }
  }
  /* A wire is three units wide and used to catch clicks within seven — barely
     more than its own edge. A port gets thirteen and a junction eighteen,
     because both are known to be hard to land on; a wire joining another wire
     is exactly that same gesture and deserves the same reach, so it gets one
     to match. */
  const tol = (touch ? 16 : 10) / z;
  for (let i = S.work.wires.length - 1; i >= 0; i--) {
    const wr = S.work.wires[i];
    const a = endPos(S.work, wr.a), b = endPos(S.work, wr.b);
    if (!a || !b) continue;
    const pts = wirePoints(a, b, 22, wr);
    for (let k = 0; k < pts.length - 1; k++) {
      if (segDist(w, pts[k], pts[k + 1]) <= tol) return { kind: 'wire', wire: wr.id, at: w };
    }
  }
  return { kind: 'empty' };
}

/* ---- getting rid of things ----------------------------------------------
   Three ways, because a keyboard is not always to hand: press Delete, click
   the ✕ that appears on whatever is selected, or right-click it. The ✕ is the
   one that works on a touchscreen. It is positioned in screen coordinates so
   it stays the same size however far you zoom out. */

function deleteHandle() {
  const R = 13;
  if (S.play) return null;                         // nothing is deletable in Use mode
  if (S.sel.size) {
    let x1 = -Infinity, y0 = Infinity;
    for (const n of S.work.nodes) {
      if (!S.sel.has(n.id)) continue;
      const g = gm(n);
      x1 = Math.max(x1, g.x + g.w); y0 = Math.min(y0, g.y);
    }
    if (x1 === -Infinity) return null;
    const s = toScreen(x1, y0);
    return { x: s.x + 11, y: s.y - 11, r: R };
  }
  if (S.selWires.size) {
    const wr = S.work.wires.find((w) => S.selWires.has(w.id));
    if (!wr) return null;
    const a = endPos(S.work, wr.a), b = endPos(S.work, wr.b);
    if (!a || !b) return null;
    const mid = wirePoints(a, b, 10, wr)[5];
    const s = toScreen(mid.x, mid.y);
    return { x: s.x, y: s.y - 18, r: R };
  }
  return null;
}

/** Screen-space, so call it outside the world transform. */
function drawDeleteHandle() {
  const hd = deleteHandle();
  if (!hd) return;
  ctx.beginPath(); ctx.arc(hd.x, hd.y, hd.r, 0, 7);
  ctx.fillStyle = C.danger; ctx.fill();
  ctx.strokeStyle = C.bg; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  const k = hd.r * 0.36;
  ctx.beginPath();
  ctx.moveTo(hd.x - k, hd.y - k); ctx.lineTo(hd.x + k, hd.y + k);
  ctx.moveTo(hd.x + k, hd.y - k); ctx.lineTo(hd.x - k, hd.y + k);
  ctx.stroke();
}

/** True when a press at this screen point landed on the ✕. */
function hitDeleteHandle(sx, sy) {
  const hd = deleteHandle();
  if (!hd) return false;
  const grab = hd.r + 8;                       // fingers are bigger than the dot
  return dist2(sx, sy, hd.x, hd.y) <= grab * grab;
}

/** Right-click deletes whatever is under the pointer, in either workspace. */
function deleteAt(w) {
  if (S.armCancel) { S.armCancel = false; return; }   // that click cancelled a placement
  const hit = hitTest(w);
  if (hit.kind === 'node' || hit.kind === 'port') {
    select([hit.node]); deleteSelection(); toast('Deleted. Ctrl+Z puts it back.');
  } else if (hit.kind === 'wire') {
    select([], [hit.wire]); deleteSelection(); toast('Wire cut. Ctrl+Z puts it back.');
  }
}

function segDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const L = dx * dx + dy * dy;
  const t = L ? clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / L, 0, 1) : 0;
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}

function markDirty() { S.dirty = true; scheduleSave(); }

/* One gesture, one undo step. Re-routing a wire removes it and adds another,
   and dropping one in space leaves a joint behind as well — without this you
   would have to press undo two or three times to take back a single drag. */
function beginBatch() { S.batching = true; S.batched = false; }
function endBatch() { S.batching = false; S.batched = false; }

/* History: one undo stack, for the circuit. */
const hist = () => ({ undo: S.undo, redo: S.redo, read: () => JSON.stringify(S.work) });

function pushUndo() {
  if (S.batching) {
    if (S.batched) return;                       // this gesture is already recorded
    S.batched = true;
  }
  const h2 = hist();
  h2.undo.push(h2.read());
  if (h2.undo.length > 200) h2.undo.shift();
  h2.redo.length = 0;
  markDirty();
  syncUndoButtons();
}
function undo() { shiftHistory('undo', 'redo'); }
function redo() { shiftHistory('redo', 'undo'); }

function shiftHistory(from, to) {
  const h2 = hist();
  if (!h2[from].length) return;
  h2[to].push(h2.read());
  const state = JSON.parse(h2[from].pop());
  { S.work = state; S.sel.clear(); S.selWires.clear(); markDirty(); }
  syncUndoButtons(); renderInspector();
}
function syncUndoButtons() {
  const h2 = hist();
  $('#btn-undo').disabled = !h2.undo.length;
  $('#btn-redo').disabled = !h2.redo.length;
}

function select(ids, wires, add) {
  if (!add) { S.sel.clear(); S.selWires.clear(); }
  (ids || []).forEach((i) => S.sel.add(i));
  (wires || []).forEach((i) => S.selWires.add(i));
  renderInspector();
}

function placeNode(type, wx, wy, extra) {
  if (type === 'CHIP' && S.editing && chipContains(extra.chip, S.editing)) {
    toast('A chip cannot contain itself.', true);
    return null;
  }
  pushUndo();
  const n = makeNode(type, 0, 0, extra);
  const g = gm(n);
  n.x = snap(wx - g.w / 2); n.y = snap(wy - g.h / 2);
  S.work.nodes.push(n);
  select([n.id]);
  return n;
}

function deleteSelection() {
  if (!S.sel.size && !S.selWires.size) return;
  pushUndo();
  S.work.nodes = S.work.nodes.filter((n) => !S.sel.has(n.id));
  S.work.wires = S.work.wires.filter(
    (w) => !S.selWires.has(w.id) && !S.sel.has(w.a.n) && !S.sel.has(w.b.n));
  S.sel.clear(); S.selWires.clear();
  renderInspector();
}

/* ---- lining things up ----------------------------------------------------
   A part lands on a ten-unit grid, but its ports do not: they are spaced down
   the middle of a box whose height depends on how many there are. So two gates
   can sit perfectly on the grid and the wire between them still has a kink in
   it. What has to line up is the ports, not the boxes — so while a part is
   being dragged, any wire it already has is checked, and if one of its ends is
   within reach of level with the other, it is nudged the rest of the way and a
   guide is drawn to say why it moved.

   Ports now sit on the wire lanes, so a part dragged around the grid is either
   exactly level with what it feeds or a whole square out — never three units
   out, the way it used to be. The pull is therefore a square rather than a few
   pixels: a square is the smallest miss there is, and closing it leaves the
   part on the grid instead of parking it between two lines. */
const ALIGN_REACH = GRID;                           // world units of pull

let alignGuides = [];                               // drawn for one frame

/** The offset that would make some wire on `moving` perfectly straight, or null.
    Only ends outside the moving group count — dragging two wired parts together
    should not have them fight each other. */
function alignOffset(moving) {
  const ids = new Set(moving.map((n) => n.id));
  const reach = ALIGN_REACH;
  let best = null;
  for (const wire of S.work.wires) {
    const insideA = ids.has(wire.a.n), insideB = ids.has(wire.b.n);
    if (insideA === insideB) continue;              // both ends move, or neither
    const mine = insideA ? wire.a : wire.b, theirs = insideA ? wire.b : wire.a;
    const from = endPos(S.work, mine), to = endPos(S.work, theirs);
    if (!from || !to) continue;
    /* a horizontal run wants equal y; a vertical one equal x. Whichever is
       already the nearer to true is the one being aimed at. */
    const dy = to.y - from.y, dx = to.x - from.x;
    const horiz = Math.abs(dx) >= Math.abs(dy);
    const gap = horiz ? dy : dx;
    if (Math.abs(gap) > reach || Math.abs(gap) < 0.01) continue;
    if (!best || Math.abs(gap) < Math.abs(best.gap)) {
      best = { gap, horiz, at: horiz ? to.y : to.x, from, to };
    }
  }
  return best;
}

/** Nudge the parts being dragged so a wire they carry comes out straight. */
function applyAlignSnap(moving) {
  alignGuides = [];
  const hit = alignOffset(moving);
  if (!hit) return;
  for (const n of moving) { if (hit.horiz) n.y += hit.gap; else n.x += hit.gap; }
  alignGuides.push(hit.horiz
    ? { horiz: true, at: hit.at, a: Math.min(hit.from.x, hit.to.x), b: Math.max(hit.from.x, hit.to.x) }
    : { horiz: false, at: hit.at, a: Math.min(hit.from.y, hit.to.y), b: Math.max(hit.from.y, hit.to.y) });
}

/** Straighten every wire that is nearly straight already, in one go — the
    tidy-up for a board that was thrown together and now wants to be read.
    Parts are moved, never wires: a wire has no shape of its own here. */
function straightenWires(scope) {
  if (S.play) return;
  const pool = scope && scope.length ? scope : S.work.nodes;
  const movable = new Set(pool.map((n) => n.id));
  pushUndo();
  let fixed = 0;
  const moved = new Set();
  /* Left to right, so a chain settles from its source outwards: the pin feeds
     the gate, so the gate moves to the pin, then the next thing moves to the
     gate. Doing it in wire order instead makes each fix break the one before —
     each part is moved at most once, and the ones upstream go first. */
  const wires = [...S.work.wires].sort((p, q) => {
    const a = endPos(S.work, p.a), b = endPos(S.work, q.a);
    return (a ? a.x : 0) - (b ? b.x : 0);
  });
  /* Decide first, from the layout as it stands, THEN move. Judging each wire
     after the previous one has already shifted a part is how the first fix
     talks the second out of happening: straightening A→gate can push the
     gate→B gap past the limit, and B is left stranded. */
  const plan = [];
  for (const wire of wires) {
    const from = endPos(S.work, wire.a), to = endPos(S.work, wire.b);
    if (!from || !to) continue;
    const horiz = Math.abs(to.x - from.x) >= Math.abs(to.y - from.y);
    const gap = horiz ? to.y - from.y : to.x - from.x;
    /* Half a gate's height. Tighter than this and ordinary sloppy placement is
       left alone, which makes the button look broken; looser and it starts
       hauling parts across the board. */
    if (!gap || Math.abs(gap) > GRID * 5) continue;
    plan.push({ wire, horiz });
  }
  for (const { wire, horiz } of plan) {
    const pick = movable.has(wire.b.n) && !moved.has(wire.b.n) ? wire.b
      : movable.has(wire.a.n) && !moved.has(wire.a.n) ? wire.a : null;
    if (!pick) continue;
    const from = endPos(S.work, wire.a), to = endPos(S.work, wire.b);
    if (!from || !to) continue;
    /* the live gap, not the one it was judged on — the chain has to follow
       through once the part upstream of it has moved */
    const gap = horiz ? to.y - from.y : to.x - from.x;
    if (!gap) continue;
    const node = nodeById(S.work, pick.n);
    const sign = pick === wire.b ? -1 : 1;
    if (horiz) node.y += gap * sign; else node.x += gap * sign;
    moved.add(pick.n);
    fixed++;
  }
  markDirty();
  toast(fixed ? `Straightened ${fixed} connection${fixed === 1 ? '' : 's'}.`
    : 'Nothing was close enough to straighten.');
}

/** Turn the selection a quarter turn — `dir` is 1 clockwise, -1 the other way.
    One part spins where it stands. Several turn as a block: each one turns on
    the spot AND its place turns about the middle of the group, which is what
    makes a row of gates become a column rather than a row of sideways gates. */
function rotateSelection(dir) {
  if (S.play) return;
  const nodes = S.work.nodes.filter((n) => S.sel.has(n.id));
  if (!nodes.length) { toast('Select something to turn first.'); return; }
  pushUndo();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    const g = gm(n);
    x0 = Math.min(x0, g.x); y0 = Math.min(y0, g.y);
    x1 = Math.max(x1, g.x + g.w); y1 = Math.max(y1, g.y + g.h);
  }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  /* A chip's pins are ordered by where they sit, so turning a circuit that has
     pins can renumber them — and every copy of that chip already on a board is
     wired by number. Dragging a pin has always been able to do this; turning
     makes it easy to do to all of them at once, so it is worth saying out loud
     rather than leaving to be discovered. */
  const pinOrder = () => {
    const io = ioOrder(S.work);
    return io.ins.map((n) => n.label).join(',') + '|' + io.outs.map((n) => n.label).join(',');
  };
  const orderWas = pinOrder();
  for (const n of nodes) {
    const g = gm(n);
    const dx = g.x + g.w / 2 - cx, dy = g.y + g.h / 2 - cy;
    const nx = dir > 0 ? cx - dy : cx + dy;          // where its middle lands
    const ny = dir > 0 ? cy + dx : cy - dx;
    n.rot = turnOf({ rot: (n.rot || 0) + dir * 90 });
    const after = gm(n);                             // width and height may have swapped
    n.x = snap(nx - after.w / 2);
    n.y = snap(ny - after.h / 2);
  }
  if (pinOrder() !== orderWas) {
    toast('That moved the pins into a different order, which changes this chip’s pin numbering. Ctrl+Z if you did not mean to.', true);
  }
  markDirty(); renderInspector();
}

function duplicateSelection() {
  if (!S.sel.size) return;
  pushUndo();
  const map = new Map();
  const copies = [];
  for (const n of S.work.nodes) {
    if (!S.sel.has(n.id)) continue;
    const c = clone(n); c.id = uid(); c.x += 20; c.y += 20;
    map.set(n.id, c.id); copies.push(c);
  }
  const newWires = S.work.wires
    .filter((w) => map.has(w.a.n) && map.has(w.b.n))
    .map((w) => ({ id: uid(), a: { n: map.get(w.a.n), s: w.a.s, i: w.a.i }, b: { n: map.get(w.b.n), s: w.b.s, i: w.b.i } }));
  S.work.nodes.push(...copies); S.work.wires.push(...newWires);
  select(copies.map((c) => c.id));
}

/* ---- copy / paste --------------------------------------------------------
   Duplicate drops a copy right where it stands, which is right for "one more
   of these". Copy and paste are for the other reason to select something:
   to carry it somewhere else — into a different chip you are editing, onto a
   board you switched to and back from, or just to a spot your hand is
   already resting on. The clipboard outlives the selection, so it is still
   there after you click away, open a chip, or reload the page. */
let clipboard = null;                                  // { nodes, wires } or null

function copySelection() {
  if (!S.sel.size) return;
  const nodes = S.work.nodes.filter((n) => S.sel.has(n.id)).map(clone);
  const ids = new Set(nodes.map((n) => n.id));
  const wires = S.work.wires.filter((w) => ids.has(w.a.n) && ids.has(w.b.n)).map(clone);
  clipboard = { nodes, wires };
  toast(`Copied ${nodes.length} part${nodes.length === 1 ? '' : 's'}.`);
}

/* Repeated pastes with nowhere better to go step diagonally, the way most
   editors do, so ten pastes in a row make a staircase instead of one stack
   nothing can be told apart in. Pointing at the board beats that: paste lands
   centred under the pointer instead, because that is where you meant it. */
let pasteStep = 0;

function pasteClipboard() {
  if (!clipboard || !clipboard.nodes.length) return;
  pushUndo();
  const b = contentBoundsOf(clipboard.nodes);
  let ox, oy;
  if (S.hover && S.hover.world && b) {
    ox = snap(S.hover.world.x - (b.x0 + b.x1) / 2); oy = snap(S.hover.world.y - (b.y0 + b.y1) / 2);
    pasteStep = 0;
  } else {
    pasteStep += 20; ox = oy = pasteStep;
  }
  const map = new Map();
  const copies = clipboard.nodes.map((n) => {
    const c = clone(n); const newId = uid();
    map.set(n.id, newId); c.id = newId; c.x += ox; c.y += oy;
    return c;
  });
  const newWires = clipboard.wires.map((w) => ({
    id: uid(), a: { n: map.get(w.a.n), s: w.a.s, i: w.a.i }, b: { n: map.get(w.b.n), s: w.b.s, i: w.b.i },
  }));
  S.work.nodes.push(...copies); S.work.wires.push(...newWires);
  select(copies.map((c) => c.id));
  toast(`Pasted ${copies.length} part${copies.length === 1 ? '' : 's'}.`);
}

const isJoint = (id) => {
  const n = nodeById(S.work, id);
  return !!n && n.type === 'JOINT';
};

/** The slot an arriving wire should take on a junction: the lowest one free,
    or a fresh one. A gate input is a socket and takes one plug, but a junction
    is a meeting point — wires gather at it, so nothing already connected is
    quietly pulled out to make room. */
function jointSlot(id) {
  const taken = new Set(S.work.wires.filter((w) => w.b.n === id).map((w) => w.b.i));
  let i = 0;
  while (taken.has(i)) i++;
  return i;
}

/** Wires always run output -> input. Re-driving an input replaces its wire —
    except at a junction, which gathers them instead. */
function addWire(a, b) {
  if (a.s === 'in') { const t = a; a = b; b = t; }
  if (a.s !== 'out' || b.s !== 'in') { toast('Wires run from an output to an input.', true); return null; }
  if (a.n === b.n && a.i === b.i) return null;
  const joint = isJoint(b.n);
  if (joint && a.n === b.n) return null;             // a junction cannot meet itself
  const dup = joint
    ? S.work.wires.some((w) => w.a.n === a.n && w.a.i === a.i && w.b.n === b.n)
    : S.work.wires.some((w) => w.a.n === a.n && w.a.i === a.i && w.b.n === b.n && w.b.i === b.i);
  if (dup) return null;
  const slot = joint ? jointSlot(b.n) : b.i;
  pushUndo();
  if (joint) {
    const j = nodeById(S.work, b.n);
    if (slot + 1 > (j.n || 1)) j.n = slot + 1;
  } else {
    S.work.wires = S.work.wires.filter((w) => !(w.b.n === b.n && w.b.i === b.i));
  }
  const w = { id: uid(), a: { n: a.n, s: 'out', i: a.i }, b: { n: b.n, s: 'in', i: slot } };
  S.work.wires.push(w);
  return w;
}

/* ---- landing a wire ------------------------------------------------------
   Wiring should not demand a steady hand. A wire being drawn looks for the
   nearest port it could legally land on, well beyond the port itself, and
   shows you which one it has picked before you let go. */

const SNAP_PX = 55;

function snapTarget(w, want, from) {
  const r = SNAP_PX / cam().z;
  let best = null, bd = r * r;
  for (const n of S.work.nodes) {
    const g = gm(n);
    const list = want === 'in' ? g.ins : g.outs;
    for (let i = 0; i < list.length; i++) {
      if (from && from.n === n.id && from.i === i && from.s === want) continue;
      const d = dist2(w.x, w.y, list[i].x, list[i].y);
      if (d < bd) { bd = d; best = { n: n.id, s: want, i, pos: list[i] }; }
    }
  }
  return best;
}

/** How many outputs end up driving the net a port sits on. One is a wire; two
    is a short, and worth saying out loud at the moment it is made. */
function driversOn(def, ref) {
  const c = compile(def);
  const net = c.portNet.get(ref.n + '.' + (ref.s === 'in' ? 'i' : 'o') + ref.i);
  if (net === undefined) return 0;
  let n = 0;
  for (const p of c.prims) if (p.outs.includes(net)) n++;
  return n;
}

/** Cut a joint into an existing wire, so several wires can meet at one point. */
function spliceJoint(wire, at) {
  const j = makeNode('JOINT', 0, 0);
  const g = gm(j);
  j.x = snap(at.x - g.w / 2); j.y = snap(at.y - g.h / 2);
  S.work.nodes.push(j);
  S.work.wires = S.work.wires.filter((x) => x.id !== wire.id);
  S.work.wires.push({ id: uid(), a: { ...wire.a }, b: { n: j.id, s: 'in', i: 0 } });
  S.work.wires.push({ id: uid(), a: { n: j.id, s: 'out', i: 0 }, b: { ...wire.b } });
  return j;
}

/** Put a junction on the wire you have selected, at the point you last pointed
    at (or halfway along, if that is not on it). Splicing one in has always been
    possible by dropping a wire onto a wire, but only as a side effect of doing
    something else — this is the way to say you want one. */
function addJointToSelection(at) {
  if (S.play) return;
  const wr = S.work.wires.find((x) => S.selWires.has(x.id));
  if (!wr) { toast('Click a wire first, then add a junction to it.'); return; }
  const a2 = endPos(S.work, wr.a), b2 = endPos(S.work, wr.b);
  if (!a2 || !b2) return;
  const pts = wirePoints(a2, b2, 24, wr);
  /* the point on the wire nearest where you were pointing, so the junction
     lands under the cursor rather than at some arbitrary midpoint */
  let spot = pts[12];
  if (at) {
    let best = Infinity;
    for (const p2 of pts) {
      const d = dist2(at.x, at.y, p2.x, p2.y);
      if (d < best) { best = d; spot = p2; }
    }
  }
  pushUndo();
  const j = spliceJoint(wr, spot);
  select([j.id], []);
  markDirty();
  toast('Junction added. Drag from it to feed another input.');
}

/** Where a wire being drawn would land right now, if you let go here. */
function wireLanding(end, w, touch) {
  const want = end.s === 'out' ? 'in' : 'out';
  const hit = hitTest(w, touch);
  if (hit.kind === 'wire') return { kind: 'wire', wire: hit.wire, want };
  if (hit.kind === 'node') {
    const port = resolveDrop(hit, want, w);
    if (port) return { kind: 'port', port, want };
  }
  const near = snapTarget(w, want, end);
  if (near) return { kind: 'port', port: near, want };
  if (hit.kind === 'empty') return { kind: 'empty', want };
  return { kind: 'none', want };
}

/** Finish a wire that is being drawn, wherever it happens to be pointing.
    `fromClick` is the click-then-click flow: a click on nothing means the
    person changed their mind, whereas dragging a wire out into open space and
    letting go there is a deliberate request for a junction. */
function landWire(end, w, touch, restore, fromClick) {
  const land = wireLanding(end, w, touch);
  if (fromClick && (land.kind === 'empty' || land.kind === 'none')) {
    if (restore) { S.work.wires.push(restore); markDirty(); }
    toast('Nothing there to connect to — wire cancelled.');
    return null;
  }
  let made = null;
  if (land.kind === 'wire') {
    const target = S.work.wires.find((x) => x.id === land.wire);
    if (target) {
      /* Tapping into an existing wire: a junction goes in exactly where you
         dropped it and the end you are holding joins it. Which end that is
         does not matter — an input is fed by the junction, an output becomes
         another wire into it — so any wire joins any other wire at any point.
         Two outputs meeting that way really is a short, but the circuit is
         allowed to say so: the join is made and the clash is reported, the
         same way the breadboard reports a short rather than refusing the
         jumper that caused it. */
      pushUndo();
      const j = spliceJoint(target, w);
      made = end.s === 'out'
        ? addWire(end, { n: j.id, s: 'in', i: 0 })
        : addWire({ n: j.id, s: 'out', i: 0 }, end);
      if (made && end.s === 'out' && driversOn(S.work, { n: j.id, s: 'out', i: 0 }) > 1) {
        toast('Joined — but two outputs drive that net now, which is a short. Ctrl+Z undoes it.', true);
      }
    }
  } else if (land.kind === 'port') {
    if (!(land.port.n === end.n && land.port.i === end.i && land.port.s === end.s)) {
      made = addWire(end, { n: land.port.n, s: land.port.s, i: land.port.i });
    }
  } else if (land.kind === 'empty') {
    const j = placeNode('JOINT', w.x, w.y);
    if (j) made = addWire(end, { n: j.id, s: land.want, i: 0 });
  }
  if (made) select([], [made.id]);
  else if (restore) { S.work.wires.push(restore); markDirty(); select([], [restore.id]); }
  return made;
}

/** Dropping on a node body (not exactly on a port) still connects: pick the
    nearest port on the side we need, preferring one that is still free. */
function resolveDrop(hit, want, at) {
  if (hit.kind === 'port') return hit.side === want ? { n: hit.node, s: hit.side, i: hit.i } : null;
  if (hit.kind !== 'node') return null;
  const node = nodeById(S.work, hit.node);
  if (!node) return null;
  const g = gm(node);
  const list = want === 'in' ? g.ins : g.outs;
  if (!list.length) return null;
  const taken = (i) => want === 'in' && S.work.wires.some((w) => w.b.n === node.id && w.b.i === i);
  let best = -1, bestD = Infinity, bestFree = -1, bestFreeD = Infinity;
  list.forEach((p, i) => {
    const d = Math.abs(p.y - at.y);
    if (d < bestD) { bestD = d; best = i; }
    if (!taken(i) && d < bestFreeD) { bestFreeD = d; bestFree = i; }
  });
  const i = bestFree >= 0 ? bestFree : best;
  return { n: node.id, s: want, i };
}

/* The nearest input pin you could plausibly have been reaching for, or null.
   Distance is to the edge of the pin, so anywhere inside it counts as zero, and
   the reach is a fixed number of screen pixels — zoomed out, a pin is a few
   pixels across and needs all the help it can get. Only used in Use mode, where
   nothing else is competing for the click. */
function nearestInput(w) {
  const R = 34 / Math.max(0.15, S.cam.z);
  let best = null, bestD = Infinity;
  for (const n of S.work.nodes) {
    if (n.type !== 'IN') continue;
    const g = gm(n);
    const dx = w.x - clamp(w.x, g.x, g.x + g.w), dy = w.y - clamp(w.y, g.y, g.y + g.h);
    const d = Math.hypot(dx, dy);
    if (d < bestD) { bestD = d; best = n; }
  }
  return bestD <= R ? best : null;
}

/* ---- pointer plumbing --------------------------------------------------- */

const ptrs = new Map();
let spaceDown = false;
let pinch = null;

cv.addEventListener('pointerdown', (ev) => {
  cv.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId, pointerPos(ev));
  if (ptrs.size === 2) { startPinch(); return; }
  if (ptrs.size > 2) return;

  /* The ✕ on the selection sits above everything. */
  const sp = pointerPos(ev);
  if (ev.button === 0 && hitDeleteHandle(sp.x, sp.y)) {
    deleteSelection();
    toast('Deleted. Ctrl+Z puts it back.');
    return;
  }
  const p = sp;
  const w = toWorld(p.x, p.y);
  const touch = ev.pointerType === 'touch';

  if (ev.button === 1 || ev.button === 2 || spaceDown) {
    S.drag = { kind: 'pan', sx: p.x, sy: p.y, cx: S.cam.x, cy: S.cam.y, btn: ev.button };
    return;
  }

  /* In Use mode a click works the circuit and nothing else. The left button
     never pans here — it is for reaching switches, and a switch you nearly hit
     should still flip rather than sliding the whole board out from under you.
     Right-hold pans instead. */
  if (S.play) {
    /* Something you landed squarely on wins, so an input pin sitting next to a
       gate cannot steal a click meant for the gate. The generous reach only
       comes into play when the click landed on nothing at all. */
    const hit = hitTest(w, touch);
    const exact = (hit.kind === 'node' || hit.kind === 'port') ? nodeById(S.work, hit.node) : null;
    const use = exact || (hit.kind === 'wire' ? null : nearestInput(w));
    if (use) {
      select([use.id]);
      if (use.type === 'IN') {
        if (use.momentary) use.value = 1;           // finishDrag lets it back up
        else { use.value = use.value ? 0 : 1; scheduleSave(); }
      }
      return;
    }
    if (hit.kind === 'wire') select([], [hit.wire]); else select([]);
    /* a finger has no second button, so one-finger drag still pushes the view */
    if (touch) S.drag = { kind: 'pan', sx: p.x, sy: p.y, cx: S.cam.x, cy: S.cam.y };
    return;
  }

  if (S.armed) {
    placeNode(S.armed.type, w.x, w.y, S.armed.type === 'CHIP' ? { chip: S.armed.chip } : null);
    if (!ev.shiftKey) armPart(null);
    return;
  }

  /* a wire waiting for its second click */
  if (S.pendingWire) {
    const pend = S.pendingWire;
    S.pendingWire = null;
    landWire(pend.end, w, touch, pend.restore, true);
    endBatch();
    return;
  }

  /* an end of the wire you are pointing at, lifted off and re-routed */
  const handle = hitWireHandle(w, touch);
  if (handle) {
    beginBatch();
    startRewire(handle.wire, handle.end, w, p);
    return;
  }

  const hit = hitTest(w, touch);
  if (hit.kind === 'port') {
    // An input takes only one wire, so grabbing a connected one pulls the plug
    // out rather than starting a second wire that would replace it anyway.
    if (hit.side === 'in') {
      const plugged = S.work.wires.find((x) => x.b.n === hit.node && x.b.i === hit.i);
      if (plugged) { beginBatch(); startRewire(plugged, 'b', w, p); return; }
    }
    const pos = hit.pos;
    beginBatch();
    S.drag = {
      kind: 'wire', end: { n: hit.node, s: hit.side, i: hit.i },
      from: { x: pos.x, y: pos.y }, to: { x: w.x, y: w.y }, rev: hit.side === 'in',
      sx0: p.x, sy0: p.y,
    };
    return;
  }
  if (hit.kind === 'node') {
    const node = nodeById(S.work, hit.node);
    if (!S.sel.has(node.id)) select([node.id], [], ev.shiftKey);
    else if (ev.shiftKey) { S.sel.delete(node.id); renderInspector(); return; }
    if (node.type === 'IN' && node.momentary) { node.value = 1; }
    S.drag = {
      kind: 'move', sx: p.x, sy: p.y, moved: false, node: node.id,
      start: S.work.nodes.filter((n) => S.sel.has(n.id)).map((n) => ({ n, x: n.x, y: n.y })),
    };
    return;
  }
  if (hit.kind === 'wire') {
    // The middle of a wire still branches: drag from it and you get a second
    // wire out of the same output, which is how one signal feeds many inputs.
    const wr = S.work.wires.find((x) => x.id === hit.wire);
    select([], [wr.id], ev.shiftKey);
    const a = endPos(S.work, wr.a);
    beginBatch();
    S.drag = { kind: 'branch', end: { ...wr.a }, from: { x: a.x, y: a.y }, to: { x: w.x, y: w.y }, sx: p.x, sy: p.y, moved: false };
    return;
  }
  if (touch) { S.drag = { kind: 'pan', sx: p.x, sy: p.y, cx: S.cam.x, cy: S.cam.y }; return; }
  if (!ev.shiftKey) select([]);
  S.drag = { kind: 'marquee', x0: w.x, y0: w.y, x1: w.x, y1: w.y, add: ev.shiftKey };
});

cv.addEventListener('pointermove', (ev) => {
  if (ptrs.has(ev.pointerId)) ptrs.set(ev.pointerId, pointerPos(ev));
  if (pinch && ptrs.size >= 2) { movePinch(); return; }
  const p = pointerPos(ev);
  const w = toWorld(p.x, p.y);

  const d = S.drag;
  if (!d) {
    const touch = ev.pointerType === 'touch';
    const onHandle = hitWireHandle(w, touch);
    const hit = hitTest(w, touch);
    S.hover = hit.kind === 'port'
      ? { kind: 'port', node: hit.node, side: hit.side, i: hit.i, world: w }
      : hit.kind === 'wire'
        ? { kind: 'wire', wire: hit.wire, world: w }
        : { kind: hit.kind, world: w };
    if (S.play) {
      cv.style.cursor = nearestInput(w) ? 'pointer' : 'default';
      return;
    }
    cv.style.cursor = S.pendingWire ? 'crosshair' : onHandle ? 'grab'
      : hit.kind === 'port' ? 'crosshair'
        : hit.kind === 'node' ? 'move' : S.armed ? 'copy' : 'default';
    return;
  }
  S.hover = { kind: 'drag', world: w };
  switch (d.kind) {
    case 'pan':
      S.cam.x = d.cx + (p.x - d.sx); S.cam.y = d.cy + (p.y - d.sy);
      break;
    case 'move': {
      const dx = (p.x - d.sx) / S.cam.z, dy = (p.y - d.sy) / S.cam.z;
      if (Math.abs(p.x - d.sx) + Math.abs(p.y - d.sy) > 3) {
        if (!d.moved) { d.moved = true; pushUndo(); }
        for (const s of d.start) { s.n.x = snap(s.x + dx); s.n.y = snap(s.y + dy); }
        applyAlignSnap(d.start.map((s) => s.n));
      }
      break;
    }
    case 'branch':
      if (Math.abs(p.x - d.sx) + Math.abs(p.y - d.sy) > 4) d.moved = true;
      d.to = w;
      if (d.moved) { S.drag = { kind: 'wire', end: d.end, from: d.from, to: w, rev: false, sx0: d.sx, sy0: d.sy }; }
      break;
    case 'wire':
      d.to = w;
      break;
    case 'marquee':
      d.x1 = w.x; d.y1 = w.y;
      break;
  }
});

function finishDrag(ev) {
  /* A momentary input springs back however the press ended. This has to happen
     before the early returns below: in Use mode pressing one starts no drag at
     all, so the sweep at the bottom would never be reached. */
  for (const n of S.work.nodes) if (n.type === 'IN' && n.momentary) n.value = 0;
  const d = S.drag;
  S.drag = null;
  if (!d) return;
  const p = pointerPos(ev);
  const w = toWorld(p.x, p.y);
  if (d.kind === 'pan') {
    // A right-click that did not turn into a pan means "delete this" — except
    // in Use mode, where right-hold is simply how you move the view.
    if (!S.play && d.btn === 2 && Math.abs(p.x - d.sx) + Math.abs(p.y - d.sy) < 5) deleteAt(w);
    return;
  }
  if (d.kind === 'wire') {
    const touch = ev.pointerType === 'touch';
    const slack = touch ? 12 : 6;
    if (Math.abs(p.x - (d.sx0 || p.x)) + Math.abs(p.y - (d.sy0 || p.y)) < slack) {
      // Barely moved: treat it as "click here, then click there" instead, which
      // is far kinder than dragging — especially with a finger.
      S.pendingWire = { end: d.end, from: d.from, rev: d.rev, restore: d.restore };
      S.hover = { kind: 'aim', world: w };
      toast('Now click where it should go. Esc cancels.');
      return;                                    // batch stays open until it lands
    }
    landWire(d.end, w, touch, d.restore);
  } else if (d.kind === 'move' && !d.moved) {
    const node = nodeById(S.work, d.node);
    // Flipping a switch is not a structural edit, so it is not undoable — but
    // it is worth remembering which way the switches were left.
    if (node && node.type === 'IN' && !node.momentary) { node.value = node.value ? 0 : 1; scheduleSave(); }
    else if (node && node.type === 'CONST') { pushUndo(); node.value = node.value ? 0 : 1; }
  } else if (d.kind === 'marquee') {
    const x0 = Math.min(d.x0, d.x1), x1 = Math.max(d.x0, d.x1);
    const y0 = Math.min(d.y0, d.y1), y1 = Math.max(d.y0, d.y1);
    const ids = S.work.nodes.filter((n) => {
      const g = gm(n);
      return g.x + g.w >= x0 && g.x <= x1 && g.y + g.h >= y0 && g.y <= y1;
    }).map((n) => n.id);
    select(ids, [], d.add);
  }
  endBatch();
}

cv.addEventListener('pointerup', (ev) => {
  ptrs.delete(ev.pointerId);
  if (pinch) { if (ptrs.size < 2) pinch = null; return; }
  finishDrag(ev);
});
cv.addEventListener('pointercancel', (ev) => {
  ptrs.delete(ev.pointerId);
  if (S.drag && S.drag.restore) S.work.wires.push(S.drag.restore);   // put a lifted wire back
  S.drag = null; pinch = null; endBatch();
});
cv.addEventListener('pointerleave', () => { if (!S.drag) S.hover = null; });
cv.addEventListener('contextmenu', (ev) => {
  ev.preventDefault();
  // Right-click means "cancel what I am placing" if anything is in hand, and
  // "delete what is under the pointer" otherwise. The delete itself happens on
  // release, so a right-drag can still pan; this flag stops one press doing both.
  if (S.pendingWire) {
    if (S.pendingWire.restore) { S.work.wires.push(S.pendingWire.restore); markDirty(); }
    S.pendingWire = null; S.armCancel = true; endBatch();
  }
  if (S.armed) { armPart(null); S.armCancel = true; }
});
cv.addEventListener('dblclick', (ev) => {
  const p = pointerPos(ev), w = toWorld(p.x, p.y);
  const hit = hitTest(w);
  if (hit.kind === 'node') {
    const n = nodeById(S.work, hit.node);
    if (n && n.type === 'CHIP' && LIB[n.chip]) openChip(n.chip);
  }
});

cv.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const c = cam();
  const p = pointerPos(ev);
  if (ev.shiftKey && !ev.ctrlKey) { c.x -= ev.deltaY; return; }
  const f = Math.exp(-ev.deltaY * (ev.deltaMode === 1 ? 0.05 : 0.0016));
  zoomAt(p.x, p.y, f);
}, { passive: false });

function zoomAt(sx, sy, factor) {
  const c = cam();
  const z = clamp(c.z * factor, 0.12, 6);
  const k = z / c.z;
  c.x = sx - (sx - c.x) * k;
  c.y = sy - (sy - c.y) * k;
  c.z = z;
}

function startPinch() {
  const [a, b] = Array.from(ptrs.values());
  const c = cam();
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: c.x, cy: c.y, cz: c.z };
  S.drag = null;
}
function movePinch() {
  const [a, b] = Array.from(ptrs.values());
  const d = Math.hypot(a.x - b.x, a.y - b.y);
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  const c = cam();
  const z = clamp(pinch.cz * (d / Math.max(1, pinch.d)), 0.12, 6);
  const k = z / pinch.cz;
  c.z = z;
  c.x = mx - (pinch.mx - pinch.cx) * k;
  c.y = my - (pinch.my - pinch.cy) * k;
}

/* ---- keyboard ----------------------------------------------------------- */

const typing = () => {
  const a = document.activeElement;
  return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT');
};

window.addEventListener('keydown', (ev) => {
  if (S.operating) { operateKey(ev); return; }
  if (ev.key === ' ' && !typing()) { spaceDown = true; }
  if (typing()) {
    if (ev.key === 'Escape') document.activeElement.blur();
    return;
  }
  const mod = ev.ctrlKey || ev.metaKey;
  const k = ev.key.toLowerCase();
  if (mod && k === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { ev.preventDefault(); redo(); return; }
  if (mod && k === 'd') { ev.preventDefault(); duplicateSelection(); return; }
  if (mod && k === 'c') { ev.preventDefault(); copySelection(); return; }
  if (mod && k === 'v') { ev.preventDefault(); pasteClipboard(); return; }
  if (mod && k === 'a') {
    ev.preventDefault();
    select(S.work.nodes.map((n) => n.id), S.work.wires.map((w) => w.id));
    return;
  }
  if (mod && k === 's') { ev.preventDefault(); saveNow(); toast('Saved to this browser.'); return; }
  if (k === 'e') { setPlay(!S.play); toast(S.play ? 'Use mode — clicks only work the switches' : 'Edit mode'); return; }
  if (k === 'r') { ev.preventDefault(); rotateSelection(ev.shiftKey ? -1 : 1); return; }
  if (k === 'j') {
    ev.preventDefault();
    addJointToSelection(S.hover && S.hover.world);
    return;
  }
  if (k === 'l') {
    ev.preventDefault();
    straightenWires(S.work.nodes.filter((n) => S.sel.has(n.id)));
    return;
  }
  switch (ev.key) {
    case 'Delete': case 'Backspace':
      if (S.play) break;
      ev.preventDefault(); deleteSelection();
      break;
    case 'Escape':
      if (S.drag && S.drag.restore) { S.work.wires.push(S.drag.restore); markDirty(); }
      if (S.pendingWire) {
        if (S.pendingWire.restore) { S.work.wires.push(S.pendingWire.restore); markDirty(); }
        S.pendingWire = null;
      }
      armPart(null); select([]); S.drag = null; endBatch(); closeModal();
      break;
    case 'f': fitView(); break;
    case 'F': ev.shiftKey ? toggleFullscreen() : fitView(); break;
    case ' ':
      ev.preventDefault(); setRunning(!S.run); break;
    case 'ArrowLeft': case 'ArrowRight': case 'ArrowUp': case 'ArrowDown': {
      if (S.play || !S.sel.size) break;
      ev.preventDefault();
      const step = ev.shiftKey ? GRID * 5 : GRID;
      const dx = (ev.key === 'ArrowRight') - (ev.key === 'ArrowLeft');
      const dy = (ev.key === 'ArrowDown') - (ev.key === 'ArrowUp');
      pushUndo();
      for (const n of S.work.nodes) if (S.sel.has(n.id)) { n.x += dx * step; n.y += dy * step; }
      break;
    }
  }
});
window.addEventListener('keyup', (ev) => { if (ev.key === ' ') spaceDown = false; });

/* ---- view helpers ------------------------------------------------------- */

function contentBounds() {
  return contentBoundsOf(S.work.nodes);
}

function fitView() {
  resize();                       // the canvas may have just changed shape
  const b = contentBounds();
  const c = cam();
  if (!b) { c.x = VW / 2; c.y = VH / 2; c.z = 1; return; }
  const pad = 60;
  const z = clamp(Math.min((VW - pad * 2) / Math.max(1, b.x1 - b.x0), (VH - pad * 2) / Math.max(1, b.y1 - b.y0)), 0.12, 2);
  c.z = z;
  c.x = VW / 2 - ((b.x0 + b.x1) / 2) * z;
  c.y = VH / 2 - ((b.y0 + b.y1) / 2) * z;
}

function setRunning(on) {
  S.run = on;
  $('#btn-run').textContent = on ? '⏸' : '▶';
  $('#btn-run').title = on ? 'Pause (Space)' : 'Run (Space)';
}

/* ---- the Operate view -----------------------------------------------------
   A TERMINAL or a KEYBOARD anywhere in the circuit means there is something
   to run it as, not just watch it — so the button that opens this view is
   shown or hidden by whether one is on the board, never toggled by hand. */
function hasComputerIO() {
  return S.work.nodes.some((n) => n.type === 'TERMINAL' || n.type === 'KEYBOARD');
}

function refreshOperateButton() {
  $('#btn-operate').hidden = !hasComputerIO();
}

function openOperate() {
  S.operating = true;
  $('#operate').hidden = false;
  const hasTerminal = S.work.nodes.some((n) => n.type === 'TERMINAL');
  $('#op-empty').hidden = hasTerminal || S.work.nodes.some((n) => n.type === 'KEYBOARD');
  updateOperateScreen();
}

function closeOperate() {
  S.operating = false;
  $('#operate').hidden = true;
}

/** What every TERMINAL on the board has printed, one under the next — most
    circuits will only have the one, but nothing stops wiring up several. */
function updateOperateScreen() {
  const terms = S.work.nodes.filter((n) => n.type === 'TERMINAL');
  const text = terms.map((n) => n.buf || '').join('\n───\n');
  const el = $('#op-text');
  if (el.textContent !== text) {
    el.textContent = text;
    $('#op-screen').scrollTop = $('#op-screen').scrollHeight;
  }
}

/** A keypress while Operate is open feeds every KEYBOARD on the board — there
    is only one keyboard on a real desk, however many parts are listening. */
function operateKey(ev) {
  if (ev.key === 'Escape') { closeOperate(); return; }
  if (ev.key === 'Backspace' || ev.key === 'Tab') ev.preventDefault();  // don't navigate or shift focus
  const code = asciiOf(ev.key);
  if (code == null) return;
  for (const n of S.work.nodes) {
    if (n.type !== 'KEYBOARD') continue;
    if (!n._queue) n._queue = [];
    n._queue.push(code);
  }
}
function asciiOf(key) {
  if (key.length === 1) return key.charCodeAt(0);
  if (key === 'Enter') return 13;
  if (key === 'Backspace') return 8;
  if (key === 'Tab') return 9;
  return null;                          // arrows, modifiers, function keys: nothing to send yet
}

/* ==========================================================================
   8 · THE FRAME LOOP
   ========================================================================== */

function recompile() {
  const carry = S.sim ? S.sim.states() : null;
  S.compiled = compile(S.work);
  S.sim = new Sim(S.compiled, carry);
  S.dirty = false;
  setWarnings(S.compiled.errors.map((e) => ({ text: e, bad: true })));
}

let fpsT = 0, fpsN = 0, tickT = 0, tickN = 0, statTxt = '';

function frame(now) {
  requestAnimationFrame(frame);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (S.dirty) recompile();
  if (S.sim) {
    const n = S.run ? SPEEDS[S.speedIx] : 0;
    for (let i = 0; i < n; i++) S.sim.tick(now);
    tickN += n;
  }
  if (S.operating) updateOperateScreen(); else drawEditor();

  fpsN++;
  if (now - fpsT > 500) {
    const fps = (fpsN * 1000) / (now - fpsT);
    const tps = (tickN * 1000) / (now - fpsT);
    fpsT = now; fpsN = 0; tickN = 0;
    const c = S.compiled;
    const n = c ? c.prims.length : 0;
    const nets = c ? c.nets : 0;
    statTxt = `<b>${n}</b> parts · <b>${nets}</b> nets · `
      + `<b>${fmtRate(tps)}</b> ticks/s · <b>${fps.toFixed(0)}</b> fps`;
    $('#status-stats').innerHTML = statTxt;
  }
}

function fmtRate(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return n.toFixed(0);
}

/* ==========================================================================
   9 · SIDEBARS, DIALOGS AND MESSAGES
   ========================================================================== */

let toastT = 0;
function toast(msg, bad) {
  const n = $('#hint');
  n.textContent = msg;
  n.style.borderColor = bad ? 'var(--danger)' : 'var(--line)';
  n.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => n.classList.remove('show'), bad ? 3400 : 2200);
}

function setWarnings(list) { S.compileWarn = list || []; paintWarnings(); }
function paintWarnings() {
  const all = (S.compileWarn || []).concat(S.runWarn || []);
  const box = $('#warnbox');
  box.innerHTML = '';
  for (const w of all.slice(0, 5)) {
    box.append(h('div', { class: 'warn' + (w.bad ? ' bad' : '') , html: w.text }));
  }
}

/* ---- palette ------------------------------------------------------------ */

/* The same shapes again, small, so you learn what an OR looks like while you
   are picking one rather than only after placing it. Anything without a
   distinctive shape keeps its coloured square. */
const SYMBOL_SVG = {
  and: 'M2 1.5 H8 C15.5 1.5 15.5 12.5 8 12.5 H2 Z',
  or: 'M2 1.5 Q9.5 1.5 16 7 Q9.5 12.5 2 12.5 Q5.6 7 2 1.5 Z',
  xor: 'M4 1.5 Q11 1.5 17 7 Q11 12.5 4 12.5 Q7.6 7 4 1.5 Z',
  tri: 'M3 1.5 L15 7 L3 12.5 Z',
};

function gateSwatch(type, color) {
  const kind = GATE_SHAPE[type];
  if (!kind) return h('span', { class: 'sw', style: `background:${color || GATE_COLORS.gate}` });
  const bubble = (PARTS[type] || {}).bubble;
  const svg = `<svg class="symsw" viewBox="0 0 22 14" aria-hidden="true">`
    + (kind === 'xor' ? '<path d="M1 1.5 Q4.6 7 1 12.5" fill="none"/>' : '')
    + `<path d="${SYMBOL_SVG[kind]}"/>`
    + (bubble ? '<circle cx="18.6" cy="7" r="1.9"/>' : '')
    + '</svg>';
  return h('span', { class: 'symwrap', html: svg });
}

function armPart(p) {
  /* Reaching for a part is unambiguously an edit, so say so and switch rather
     than refusing the click and leaving the user to work out why. */
  if (p && S.play) { setPlay(false); toast('Back in Edit mode.'); }
  S.armed = p;
  if (p) S.pendingWire = null;
  const sub = p ? (p.chip || p.ic || '') : '';
  $$('.pal-item').forEach((e) => e.classList.toggle('armed',
    !!p && e.dataset.type === p.type && e.dataset.chip === sub));
  if (p) {
    toast('Click the board to place it. Esc cancels.');
    $('#app').classList.remove('pal-open');
  } else {
    $('#hint').classList.remove('show');           // the "now click" hint is spent
  }
}

function renderPalette() {
  const host = $('#pal-scroll');
  const q = $('#pal-q').value.trim().toLowerCase();
  host.innerHTML = '';

  const groups = new Map();
  for (const [type, part] of Object.entries(PARTS)) {
    if (q && !part.name.toLowerCase().includes(q) && !type.toLowerCase().includes(q)) continue;
    const g = part.group || 'Parts';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push({ type, part, name: part.name, color: GATE_COLORS[part.cat] });
  }
  const mine = [];
  for (const d of Object.values(LIB).sort((a, b) => a.name.localeCompare(b.name))) {
    if (d.lib) continue;                               // library chips are listed in full further down
    if (q && !d.name.toLowerCase().includes(q)) continue;
    mine.push({ type: 'CHIP', chip: d.id, name: d.name, color: d.color, part: CHIP_PART });
  }
  if (mine.length) groups.set('My chips', mine);

  for (const [name, items] of groups) {
    host.append(h('div', { class: 'pal-group' }, h('h3', {}, name), h('span', { class: 'rule' })));
    const wrap = h('div', { class: 'pal-items' });
    for (const it of items) {
      const btn = h('button', {
        class: 'pal-item', type: 'button', title: it.part.tip || '',
        'data-type': it.type, 'data-chip': it.chip || '',
        onpointerdown: (ev) => {
          ev.preventDefault();
          if (it.lazy) { const id = installLib(it.lazy); scheduleSave(); renderPalette(); armPart({ type: 'CHIP', chip: id }); return; }
          const same = S.armed && S.armed.type === it.type && S.armed.chip === it.chip;
          armPart(same ? null : { type: it.type, chip: it.chip });
        },
      }, gateSwatch(it.type, it.color), it.name);
      wrap.append(btn);
    }
    host.append(wrap);
  }
  paintLibraryShelves(host, q);
  if (!host.children.length) host.append(h('p', { class: 'pal-empty' }, 'Nothing matches that.'));
  if (!q) {
    host.append(h('div', { class: 'stack', style: 'margin-top:12px' },
      h('button', { class: 'btn', style: 'width:100%', onclick: openLibraryBrowser }, 'Bigger view of the chip library…'),
      h('button', { class: 'btn', style: 'width:100%', onclick: openLibrary }, 'Manage my chips…')));
  }
}

/* The whole chip library, always on show: one fold-out list per kind of chip,
   every chip in it ready to pick up. Pressing one adds it to your parts the
   first time and then picks it up, so there is nothing to install first. */
const palOpen = new Set();
function paintLibraryShelves(host, q) {
  const match = (e) => !q || (e.name + ' ' + e.cat + ' ' + e.key + ' ' + e.desc).toLowerCase().includes(q);
  const total = LIBRARY.filter(match).length;
  if (!total) return;
  host.append(h('div', { class: 'pal-group' }, h('h3', {}, 'Chip library'), h('span', { class: 'rule' }),
    h('span', { class: 'muted' }, String(total))));
  if (!q) host.append(h('p', { class: 'pal-empty' }, 'Ready-made chips, from single gates to whole computers. Open a list and pick one.'));
  for (const cat of LIB_CAT_ORDER) {
    const items = LIBRARY.filter((e) => e.cat === cat && match(e));
    if (!items.length) continue;
    const box = h('details', { class: 'palcat' });
    if (q || palOpen.has(cat)) box.open = true;
    box.addEventListener('toggle', () => { if (q) return; if (box.open) palOpen.add(cat); else palOpen.delete(cat); });
    box.append(h('summary', {},
      h('span', { class: 'sw', style: 'background:' + LIB_CAT_COLOR[cat] }), h('b', {}, cat), h('span', { class: 'meta' }, String(items.length))));
    for (const e of items) {
      const id = libId(e.key);
      box.append(h('button', {
        class: 'pal-item named', type: 'button', title: e.desc, 'data-type': 'CHIP', 'data-chip': id,
        onpointerdown: (ev) => {
          ev.preventDefault();
