<!--
  ===========================================================================
  Logic Gate Simulator — a digital logic simulator that runs in one file.
  ---------------------------------------------------------------------------
  A schematic board. Drop gates, wire them together, toggle inputs, and watch
  the signals move. Any circuit you build can be packaged into a reusable
  CHIP, which then appears in the palette and can be dropped into bigger
  circuits (chips inside chips, as deep as you like). That is the "build a
  computer out of NAND gates" workflow.

  The physical bench — a breadboard with real 74-series chips, discrete parts
  and a bare design board — is a separate app in this repository:
  breadboard.html.

  HOW IT SIMULATES. The circuit compiles down to a netlist of primitive gates
  joined by nets. Every net holds one bit, and every tick each gate reads its
  inputs and writes its outputs *simultaneously* — a unit-delay model. That single choice is what makes feedback work: cross-coupled NAND
  gates latch, a ring of inverters oscillates, and an edge-triggered flip-flop
  built from gates behaves like the real thing.

  NO BUILD STEP, NO NETWORK. Everything (markup, styling, engine, examples) is
  in this file, so it runs from a web server or straight off the filesystem,
  online or off. Nothing is uploaded; your work is saved in localStorage and
  can be exported to a JSON file.
  ===========================================================================
-->

<style>
/* ==========================================================================
   THEME
   Dark by default (a lit workbench in a dark room), light when the system asks
   for it. The [data-theme] attribute on <html> lets the in-app toggle win.
   ========================================================================== */
:root{
  --bg:#0f141a; --panel:#151d26; --panel-2:#1b2634; --panel-3:#22303f;
  --line:#2a3849; --line-soft:#213040;
  --ink:#dbe6f2; --ink-soft:#93a5b9; --ink-faint:#61738a;
  --accent:#ffc247;          /* a HIGH signal */
  --accent-dim:#7a5c1f;
  --low:#3d4b5c;             /* a LOW signal */
  --select:#5cc8ff;
  --danger:#ff6b5e; --warn:#ffb03a; --ok:#4bd684;
  --wire-hi:#ffc247; --wire-lo:#41505f;
  --chip:#2f4257; --chip-ink:#dbe6f2;
  --grid:#1b2733; --grid-strong:#23323f;
  --board:#e8e4d8; --board-line:#c9c4b4; --board-hole:#8f8b7e;
  --shadow:0 6px 22px rgba(0,0,0,.45);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --rail:236px; --rail-r:270px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#eef1f5; --panel:#ffffff; --panel-2:#f3f5f9; --panel-3:#e6eaf1;
    --line:#d3dae4; --line-soft:#e2e7ee;
    --ink:#16202b; --ink-soft:#5a6b7d; --ink-faint:#8b9aab;
    --accent:#e08a00; --accent-dim:#f0c581;
    --low:#b4c0cd; --select:#0f83d6;
    --wire-hi:#e08a00; --wire-lo:#aab6c4;
    --chip:#c9d6e4; --chip-ink:#16202b;
    --grid:#e2e7ee; --grid-strong:#d6dde6;
    --shadow:0 6px 22px rgba(20,35,55,.14);
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#151d26; --panel-2:#1b2634; --panel-3:#22303f;
  --line:#2a3849; --line-soft:#213040;
  --ink:#dbe6f2; --ink-soft:#93a5b9; --ink-faint:#61738a;
  --accent:#ffc247; --accent-dim:#7a5c1f; --low:#3d4b5c; --select:#5cc8ff;
  --wire-hi:#ffc247; --wire-lo:#41505f; --chip:#2f4257; --chip-ink:#dbe6f2;
  --grid:#1b2733; --grid-strong:#23323f;
  --shadow:0 6px 22px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --panel-2:#f3f5f9; --panel-3:#e6eaf1;
  --line:#d3dae4; --line-soft:#e2e7ee;
  --ink:#16202b; --ink-soft:#5a6b7d; --ink-faint:#8b9aab;
  --accent:#e08a00; --accent-dim:#f0c581; --low:#b4c0cd; --select:#0f83d6;
  --wire-hi:#e08a00; --wire-lo:#aab6c4; --chip:#c9d6e4; --chip-ink:#16202b;
  --grid:#e2e7ee; --grid-strong:#d6dde6;
  --shadow:0 6px 22px rgba(20,35,55,.14);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button,input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ==========================================================================
   APP SHELL — three columns (palette · stage · inspector), three rows.
   ========================================================================== */
#app{
  display:grid;height:100%;
  grid-template-columns:var(--rail) minmax(0,1fr) var(--rail-r);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "pal stage insp" "bar bar bar";
  padding-top:var(--safe-top);
}
#app.hide-insp{grid-template-columns:var(--rail) minmax(0,1fr) 0}
#app.hide-insp #inspector{display:none}

/* ---- top bar ---- */
#topbar{
  grid-area:top;display:flex;align-items:center;gap:10px;padding:7px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);min-height:46px;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .mark{
  width:22px;height:22px;border-radius:6px;background:var(--accent);color:#1a1206;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto;
}
.brand .sub{color:var(--ink-faint);font-weight:400;font-size:12px}
.seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{
  background:none;border:0;padding:5px 11px;border-radius:7px;cursor:pointer;
  color:var(--ink-soft);font-size:13px;white-space:nowrap;
}
.seg button.on{background:var(--panel-3);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.grow{flex:1 1 auto;min-width:0}
#crumbs{
  display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:12.5px;
  min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
#crumbs .chipname{color:var(--ink);font-weight:600}
#crumbs .crumb-name{
  background:none;border:0;padding:2px 4px;border-radius:6px;cursor:pointer;
  color:var(--ink);font-weight:600;font-size:12.5px;
}
#crumbs .crumb-name:hover{background:var(--panel-2);color:var(--select)}
#crumbs .crumb-name .pen{color:var(--ink-faint);font-weight:400}
#crumbs button{background:none;border:0;color:var(--select);cursor:pointer;padding:0;font-size:12.5px}
.tools{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.btn{
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:5px 10px;cursor:pointer;color:var(--ink);white-space:nowrap;font-size:13px;
}
.btn:hover{background:var(--panel-3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{padding:5px 8px;min-width:32px;text-align:center}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.wreck{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.wreck:hover{filter:brightness(1.08)}

/* ---- palette ---- */
#palette{
  grid-area:pal;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
.pal-search{padding:8px;border-bottom:1px solid var(--line-soft)}
.pal-search input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;outline:none;
}
.pal-search input:focus{border-color:var(--select)}
.pal-scroll{overflow-y:auto;padding:6px 8px 14px;flex:1 1 auto;min-height:0}
.pal-group{margin:8px 0 2px;display:flex;align-items:center;gap:6px}
.pal-group h3{
  margin:0;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;
}
.pal-group .rule{flex:1;height:1px;background:var(--line-soft)}
.pal-items{display:flex;flex-wrap:wrap;gap:5px}
.pal-item{
  display:flex;align-items:center;gap:6px;background:var(--panel-2);
  border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:grab;
  font-size:12.5px;user-select:none;-webkit-user-select:none;touch-action:none;
}
.pal-item:hover{border-color:var(--select)}
.pal-item.armed{border-color:var(--accent);background:var(--panel-3);box-shadow:0 0 0 1px var(--accent) inset}
.pal-item .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto;background:var(--chip)}
/* the gate's real schematic shape, in place of the coloured square */
.pal-item .symwrap{display:flex;flex:0 0 auto}
.typeval{display:inline-flex;align-items:center;gap:7px}
.rotrow{display:flex;align-items:center;gap:6px}
.rotrow span{flex:1;text-align:center;color:var(--ink-faint);font-size:11.5px}
.rotrow .btn{flex:0 0 auto;padding:4px 11px;font-size:14px;line-height:1}
.symsw{width:20px;height:13px;display:block}
.symsw path,.symsw circle{fill:var(--chip);stroke:var(--ink-faint);stroke-width:1.1}
.symsw path[fill="none"]{fill:none}
.pal-item.armed .symsw path,.pal-item.armed .symsw circle{stroke:var(--accent)}
/* Chips get their part number and a plain-English name underneath, because
   "74151" tells a beginner nothing on its own. */
.pal-item.named{
  width:100%;flex-direction:column;align-items:flex-start;gap:1px;
  padding:6px 9px;text-align:left;line-height:1.3;
}
.pal-item.named .top{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px}
.pal-item.named .sub{color:var(--ink-faint);font-size:11px;padding-left:16px}
.pal-item.armed.named .sub{color:var(--ink-soft)}
.pal-item.named .top .lvl{margin-left:auto}
.pal-item.named .sub{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.palcat{margin:4px 0}
.palcat>summary{display:flex;align-items:center;gap:8px;padding:7px 4px;cursor:pointer;list-style:none;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.palcat>summary::-webkit-details-marker{display:none}
.palcat>summary::before{content:"▸";color:var(--ink-faint);font-size:11px}
.palcat[open]>summary::before{content:"▾"}
.palcat>summary .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.palcat>summary .meta{margin-left:auto;color:var(--ink-faint);font-size:11.5px;font-family:var(--mono)}
.palcat>.pal-item{margin-top:4px}
.pal-item .gear{margin-left:2px;color:var(--ink-faint);font-size:11px}
.pal-empty{color:var(--ink-faint);font-size:12px;padding:6px 2px}

/* ---- stage ---- */
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:var(--bg);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
.float{position:absolute;z-index:5}
.dock{
  display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:5px 6px;box-shadow:var(--shadow);
}
#simdock{left:10px;bottom:10px}
#zoomdock{right:10px;bottom:10px}
#simdock input[type=range]{width:96px;accent-color:var(--accent)}
.dock .lbl{color:var(--ink-faint);font-size:11px;padding:0 2px;white-space:nowrap}
#hint{
  left:50%;transform:translateX(-50%);top:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:5px 14px;box-shadow:var(--shadow);font-size:12.5px;color:var(--ink-soft);
  pointer-events:none;opacity:0;transition:opacity .18s;max-width:min(90%,560px);text-align:center;
}
#hint.show{opacity:1}
#warnbox{
  right:10px;top:10px;max-width:min(340px,60vw);display:flex;flex-direction:column;gap:6px;
  pointer-events:none;
}
.warn{
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:8px;padding:6px 10px;font-size:12px;color:var(--ink-soft);box-shadow:var(--shadow);
}
.warn.bad{border-left-color:var(--danger)}
.warn b{color:var(--ink);font-weight:600}

/* ---- inspector ---- */
#inspector{
  grid-area:insp;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow-y:auto;
}
.insp-sec{border-bottom:1px solid var(--line-soft);padding:10px 12px}
.insp-sec h3{
  margin:0 0 8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:700;
}
.row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.row label{color:var(--ink-soft);font-size:12.5px;flex:0 0 84px}
.row .ctl{flex:1 1 auto;min-width:0}
input[type=text],input[type=number],select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  padding:5px 8px;outline:none;
}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--select)}
input[type=range]{width:100%;accent-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:5px}
.swatch{width:22px;height:22px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.muted{color:var(--ink-faint);font-size:12px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:2px 0}
.kv span:first-child{color:var(--ink-soft)}
.kv span:last-child{font-family:var(--mono)}
.ttable{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
.ttable th,.ttable td{padding:2px 5px;text-align:center;border-bottom:1px solid var(--line-soft)}
.ttable th{color:var(--ink-faint);font-weight:600;position:sticky;top:0;background:var(--panel)}
.ttable td.one{color:var(--accent)}
.ttable td.zero{color:var(--ink-faint)}
.ttable .sep{border-left:1px solid var(--line)}
.tt-wrap{max-height:260px;overflow:auto;border:1px solid var(--line-soft);border-radius:8px}
.stack{display:flex;flex-direction:column;gap:6px}
.madeof{margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft)}
h4.does{
  margin:10px 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:700;
}
.madeof h4{margin:0 0 5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.madeof p{margin:0 0 8px;line-height:1.45}
.memgrid{
  display:flex;flex-wrap:wrap;gap:3px;margin:8px 0 2px;max-height:150px;overflow-y:auto;
  font-family:var(--mono);font-size:11px;
}
.memcell{
  min-width:24px;text-align:center;padding:2px 3px;border-radius:4px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-soft);
}
.memcell.now{background:var(--accent);border-color:var(--accent);color:#1a1206;font-weight:700}
textarea.memtext{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;
  padding:6px 8px;font-family:var(--mono);font-size:11.5px;outline:none;resize:vertical;
}
textarea.memtext:focus{border-color:var(--select)}
canvas.preview{
  width:100%;height:140px;display:block;background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;cursor:zoom-in;
}
canvas.preview:hover{border-color:var(--select)}
/* short enough that the caption, the picture, the line under it and the
   "open up every…" row all fit between the sticky header and footer, even
   when the caption runs to two lines */
canvas.preview.big{height:min(48vh,430px);cursor:grab;touch-action:none}
.diagtrail{
  margin:0 0 8px;font-size:12px;color:var(--ink-faint);
}
.diagtrail button{
  background:none;border:0;padding:0;color:var(--select);cursor:pointer;font-size:12px;
}
.diagtrail button:hover{text-decoration:underline}
.diagtrail .sep{color:var(--ink-faint)}
.diagtrail b{color:var(--ink)}
.madeof .zoomhint{
  margin:5px 0 0;font-size:11px;color:var(--ink-faint);text-align:center;
}
.zoomhint .linky{
  font:inherit;background:none;border:0;padding:0;color:var(--select);cursor:pointer;
}
.zoomhint .linky:hover{text-decoration:underline}
/* "open up every D FLIP-FLOP" — one chip per kind of part in the picture */
.openups{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:6px;margin:9px 0 0;font-size:11px;color:var(--ink-faint);
}
.openups button{
  font:inherit;padding:3px 9px;border-radius:999px;cursor:pointer;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
}
.openups button:hover{border-color:var(--select);color:var(--select)}
.pinlist{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:11.5px}
.pinlist div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.pinlist .n{color:var(--ink-faint)}

/* ---- status bar ---- */
#statusbar{
  grid-area:bar;display:flex;align-items:center;gap:14px;padding:3px 10px;
  background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;
  color:var(--ink-faint);min-height:24px;padding-bottom:calc(3px + var(--safe-bot));
}
#statusbar .sep{width:1px;height:12px;background:var(--line)}
#statusbar .tip{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#statusbar b{color:var(--ink-soft);font-weight:600;font-family:var(--mono)}

/* ==========================================================================
   MODALS
   ========================================================================== */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
#modal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}

/* ---- the Operate view ----------------------------------------------------
   A screen and a keyboard, and nothing else — no palette, no wires, no
   inspector. What is on it is entirely up to whatever the circuit underneath
   was made to print; this is only the glass it prints onto. */
/* An ID selector setting display outranks the UA stylesheet's [hidden]{display:
   none}, so display has to be set per hidden-state explicitly here — otherwise
   the [hidden] attribute toggles nothing and this covers the screen forever. */
#operate{
  display:none;
  position:fixed;inset:0;z-index:60;background:#0b0f0c;
  flex-direction:column;padding:var(--safe-top) 0 var(--safe-bot);
}
#operate:not([hidden]){display:flex}
#op-bar{
  display:flex;align-items:center;gap:10px;padding:9px 14px;background:#0f140f;
  border-bottom:1px solid #1c2b1c;flex:0 0 auto;
}
#op-label{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#5a8f5a;font-weight:700;
}
#op-bar .btn{background:#132013;border-color:#254025;color:#8fd98f}
#op-bar .btn:hover{background:#1a2e1a}
#op-screen{
  flex:1 1 auto;min-height:0;overflow-y:auto;padding:22px 26px;
  font-family:var(--mono);font-size:15px;line-height:1.5;color:#7fe27f;
  text-shadow:0 0 6px rgba(127,226,127,.35);
}
#op-text{margin:0;white-space:pre-wrap;word-break:break-word;display:inline}
#op-cursor{animation:op-blink 1s step-end infinite}
@media (prefers-reduced-motion:reduce){#op-cursor{animation:none}}
@keyframes op-blink{50%{opacity:0}}
#op-empty{
  margin:auto;max-width:440px;text-align:center;padding:0 24px;
  font-family:var(--ui);color:#5a8f5a;font-size:14px;line-height:1.5;
}
#op-empty b{color:#8fd98f;font-family:var(--mono)}
.sheet{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);max-width:640px;width:100%;max-height:86vh;overflow:auto;
}
.sheet.wide{max-width:860px}
/* the whole window, for the big diagrams */
.sheet.huge{max-width:none;width:100%;height:100%;max-height:none}
/* leaves room for the caption, the hint and the "open up every…" row, so the
   sticky footer never covers them */
.sheet.huge canvas.preview.big{height:calc(100vh - 310px)}
.sheet header{
  display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--panel);z-index:1;
}
.sheet header h2{margin:0;font-size:15px}
.sheet .body{padding:14px 16px}
.sheet footer{
  display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--panel);
}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px}
.card{
  text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;cursor:pointer;
}
.card:hover{border-color:var(--select)}
.card b{display:block;margin-bottom:3px}
.card span{color:var(--ink-faint);font-size:12px;line-height:1.35;display:block}
.libtools{display:flex;gap:8px;align-items:center;margin:0 0 6px;flex-wrap:wrap}
.libtools input{flex:1 1 200px;min-width:0}
.libcat{display:flex;align-items:center;gap:8px;margin:18px 0 4px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.libcat .sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto}
.libcat .meta{color:var(--ink-faint);font-size:11.5px;font-family:var(--mono)}
.librow{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.librow .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.librow .nm{font-weight:600}
.librow p{margin:4px 0 7px;color:var(--ink-faint);font-size:12.5px;line-height:1.4}
.librow .acts{display:flex;gap:6px;flex-wrap:wrap}
.lvl{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.lvl-raw{color:#c9a25c;border-color:#7a5c1f}
.lvl-simple{color:#4bd684;border-color:#2c6b46}
.lvl-intermediate{color:#5cc8ff;border-color:#2b6a8c}
.lvl-advanced{color:#c77dff;border-color:#6b4a8c}
.lvl-computer{color:#ff8a7a;border-color:#8c3f35}
.help h4{margin:16px 0 6px;font-size:13px}
.help p,.help li{color:var(--ink-soft);font-size:13px}
.help ul{margin:6px 0;padding-left:18px}
.help kbd{
  font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--ink);
}
.help code{font-family:var(--mono);font-size:12px;color:var(--accent)}
.chiprow{
  display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel-2);margin-bottom:6px;
}
.chiprow .sw{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.chiprow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chiprow .meta{color:var(--ink-faint);font-size:11.5px;font-family:var(--mono)}

/* ==========================================================================
   NARROW SCREENS — rails become slide-over drawers.
   ========================================================================== */
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "stage" "bar"}
  #palette,#inspector{
    position:fixed;z-index:30;top:calc(46px + var(--safe-top));bottom:0;width:min(280px,84vw);
    box-shadow:var(--shadow);transition:transform .2s ease;
  }
  #palette{left:0;transform:translateX(-101%)}
  #inspector{right:0;transform:translateX(101%);width:min(300px,88vw)}
  #app.pal-open #palette{transform:none}
  #app.insp-open #inspector{transform:none;display:flex}
  #app.hide-insp #inspector{display:flex}
  .brand .sub{display:none}
  #crumbs{display:none}
}
/* On a phone the top bar cannot hold everything, so the less-used controls
   move into a "⋯" sheet and the two stage docks shrink to fit side by side. */
.narrow-only{display:none}
@media (max-width:560px){
  .tools .wide-only{display:none}
  .seg.wide-only{display:none}
  .brand span.nm{display:none}
  .narrow-only{display:inline-block}
  #topbar{gap:6px;padding:6px}
  .seg button{padding:5px 8px}
  #simdock{left:8px;bottom:8px;gap:3px}
  #simdock .lbl{display:none}
  #simdock input[type=range]{width:64px}
  #zoomdock{right:8px;bottom:8px;gap:3px}
  .dock{padding:4px}
}
.drawer-btn{display:none}
@media (max-width:900px){.drawer-btn{display:inline-block}}
</style>
</head>

<body>
<div id="app">

  <!-- ==================== TOP BAR ==================== -->
  <header id="topbar">
    <button class="btn icon drawer-btn" id="btn-pal" title="Parts">☰</button>
    <div class="brand">
      <span class="mark" aria-hidden="true">&amp;</span>
      <span class="nm">Logic Gates</span>
    </div>

    <a class="btn wide-only" href="breadboard.html" title="The physical bench: breadboard and design board">Breadboard ↗</a>

    <div class="seg wide-only" role="tablist" aria-label="What clicking does">
      <button id="act-edit" class="on" role="tab" title="Place, wire and move things (E)">✎ Edit</button>
      <button id="act-run" role="tab" title="Only work the switches — nothing can be re-wired (E)">▶ Use</button>
    </div>
    <!-- the same switch on a phone, where the bar cannot hold two more labels
         and fat fingers make it matter most -->
    <button class="btn icon narrow-only" id="act-toggle" title="Switch to Use (E)">✎</button>

    <div id="crumbs" class="grow"></div>

    <div class="tools">
      <button class="btn icon" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="btn icon wide-only" id="btn-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
      <button class="btn primary" id="btn-operate" title="Switch to the screen and keyboard this circuit is wired to" hidden>▶ Operate</button>
      <button class="btn wide-only" id="btn-chip" title="Package this circuit as a reusable chip">Make chip</button>
      <button class="btn wide-only" id="btn-examples">Examples</button>
      <button class="btn wide-only" id="btn-file">File</button>
      <button class="btn icon wide-only" id="btn-full" title="Fullscreen (Shift+F)">⛶</button>
      <button class="btn icon wide-only" id="btn-help" title="Help">?</button>
      <button class="btn icon wide-only" id="btn-theme" title="Light / dark">◐</button>
      <button class="btn icon narrow-only" id="btn-more" title="More">⋯</button>
      <button class="btn icon drawer-btn" id="btn-insp" title="Inspector">⚙</button>
    </div>
  </header>

  <!-- ==================== PALETTE ==================== -->
  <aside id="palette">
    <div class="pal-search">
      <input id="pal-q" type="text" placeholder="Search parts…" autocomplete="off" spellcheck="false">
    </div>
    <div class="pal-scroll" id="pal-scroll"></div>
  </aside>

  <!-- ==================== STAGE ==================== -->
  <main id="stage">
    <canvas id="cv"></canvas>

    <p class="float" id="hint"></p>
    <div class="float" id="warnbox"></div>

    <div class="float dock" id="simdock">
      <button class="btn icon" id="btn-run" title="Run / pause (Space)">⏸</button>
      <button class="btn icon" id="btn-step" title="Advance one tick">⏭</button>
      <span class="lbl">speed</span>
      <input id="sim-speed" type="range" min="0" max="10" step="1" value="6" title="Ticks per frame">
      <span class="lbl" id="speed-lbl">32×</span>
    </div>

    <div class="float dock" id="zoomdock">
      <button class="btn icon" id="btn-zout" title="Zoom out">−</button>
      <button class="btn icon" id="btn-zin" title="Zoom in">+</button>
      <button class="btn icon" id="btn-fit" title="Fit to view (F)">⤢</button>
    </div>
  </main>

  <!-- ==================== INSPECTOR ==================== -->
  <aside id="inspector"></aside>

  <!-- ==================== STATUS BAR ==================== -->
  <footer id="statusbar">
    <span class="tip" id="status-tip"></span>
    <span class="sep"></span>
    <span id="status-stats"></span>
  </footer>
</div>

<!-- ==================== MODAL HOST ==================== -->
<div id="modal" aria-modal="true" role="dialog">
  <div class="scrim" data-close="1"></div>
  <div class="sheet" id="modal-sheet"></div>
</div>

<!-- ==================== OPERATE VIEW ====================
     What TERMINAL prints and KEYBOARD reads, full size — the screen and
     keyboard the circuit underneath is actually wired to, instead of the
     gates that make it work. The simulation keeps running behind this;
     leaving does not pause anything. -->
<div id="operate" hidden>
  <div id="op-bar">
    <span id="op-label">OPERATE</span>
    <span class="grow"></span>
    <button class="btn" id="op-close" title="Back to the circuit (Esc)">✎ Back to circuit</button>
  </div>
  <div id="op-screen"><pre id="op-text"></pre><span id="op-cursor">█</span></div>
  <p id="op-empty" hidden>Nothing is wired to a screen or a keyboard yet — drop a <b>TERMINAL</b> or
    <b>KEYBOARD</b> part (under Computer, in the palette) to give this circuit something to run on.</p>
</div>

<input type="file" id="file-input" accept="application/json,.json" hidden>

<script>
'use strict';
/* ==========================================================================
   0 · SMALL HELPERS
   ========================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rnd = (n = 8) => Math.random().toString(36).slice(2, 2 + n);
const uid = () => rnd(4) + Date.now().toString(36).slice(-4);
const clone = (o) => JSON.parse(JSON.stringify(o));
const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;

/** Build a DOM element from a tag, an attribute bag and children. */
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return n;
}

/** Union-find over arbitrary string keys — the backbone of both netlists. */
class DSU {
  constructor() { this.idx = new Map(); this.parent = []; }
  id(key) {
    let i = this.idx.get(key);
    if (i === undefined) { i = this.parent.length; this.idx.set(key, i); this.parent.push(i); }
    return i;
  }
  find(i) { while (this.parent[i] !== i) { this.parent[i] = this.parent[this.parent[i]]; i = this.parent[i]; } return i; }
  union(a, b) { const ra = this.find(a), rb = this.find(b); if (ra !== rb) this.parent[rb] = ra; return ra; }
  rootOf(key) { return this.find(this.id(key)); }
}

/* ==========================================================================
   1 · PART DEFINITIONS (the primitives every circuit bottoms out in)

   Each entry describes how a part looks, how many ports it has, and — for the
   parts that actually compute something — what it does on a tick. Anything not
   listed here is a user-made chip, which the compiler expands into these.
   ========================================================================== */

const GATE_COLORS = {
  io: '#3f7d55', src: '#7a5aa8', gate: '#2f4257', seq: '#7d5233',
  blk: '#6b5a2e',
  disp: '#365f7d', plumb: '#4a4f58',
};

const PORT_GAP = 20;     // vertical spacing between a part's ports
const GRID = 10;         // editor snap grid, in world units

/** Bit helpers used by the gate bodies. */
const andOf = (a) => a.every(Boolean) ? 1 : 0;
const orOf = (a) => a.some(Boolean) ? 1 : 0;
const xorOf = (a) => a.reduce((s, v) => s ^ (v ? 1 : 0), 0);

/** Helpers for the wide parts: a row of ports read or written as one number. */
const namesOf = (prefix, n) => Array.from({ length: n }, (_, i) => prefix + i);
const readNum = (p, v, from, n) => { let x = 0; for (let i = 0; i < n; i++) if (v[p.ins[from + i]]) x += 2 ** i; return x; };
const putNum = (p, put, from, n, x) => { for (let i = 0; i < n; i++) put(p.outs[from + i], Math.floor(x / 2 ** i) % 2); };

const PARTS = {
  /* ---- chip boundary ------------------------------------------------- */
  IN: {
    name: 'Input pin', cat: 'io', nick: "a switch", plain: "A pin on the edge of your circuit, and a switch you can flip: click it to change between 0 and 1. When you package the circuit as a chip, each of these becomes one of that chip's input connections.", group: 'Signals', shape: 'pin',
    ins: () => [], outs: () => [''], w: 30, h: 30,
    make: () => ({ label: 'in', value: 0, momentary: false }),
    tip: 'A pin on the edge of the chip. Click it to flip it between 0 and 1.',
    sim: (p, v, put) => put(p.outs[0], p.node.value ? 1 : 0),
  },
  OUT: {
    name: 'Output pin', cat: 'io', nick: "a result", plain: "A pin on the edge of your circuit. It lights up when the signal reaching it is 1, and becomes one of the chip's output connections when you package it.", group: 'Signals', shape: 'pin',
    ins: () => [''], outs: () => [], w: 30, h: 30,
    make: () => ({ label: 'out' }),
    tip: 'A pin on the edge of the chip. Lights up when the signal is 1.',
  },
  CONST: {
    name: 'Constant', cat: 'src', nick: "always 0, or always 1", plain: "Holds one value forever; click it to change which. Handy for tying an input you are not using to a fixed level.", group: 'Signals', shape: 'const',
    ins: () => [], outs: () => [''], w: 40, h: 30,
    make: () => ({ value: 1 }),
    tip: 'A permanent 0 or 1. Click to flip it.',
    sim: (p, v, put) => put(p.outs[0], p.node.value ? 1 : 0),
  },
  CLOCK: {
    name: 'Clock', cat: 'src', nick: "a steady pulse", plain: "Turns itself on and off forever, at whatever rate you set in this panel. This is what drives counters and flip-flops.", group: 'Signals', shape: 'clock',
    ins: () => [], outs: () => [''], w: 46, h: 30,
    make: () => ({ hz: 2 }),
    tip: 'A square wave. Set its rate in the inspector.',
    sim: (p, v, put, ctx) => {
      const half = 500 / Math.max(0.05, p.node.hz || 2);
      if (p.st.t === undefined) { p.st.t = ctx.now; p.st.q = 0; }
      // Catch up in whole half-periods so a slow frame does not desynchronise it.
      while (ctx.now - p.st.t >= half) { p.st.t += half; p.st.q ^= 1; }
      put(p.outs[0], p.st.q);
    },
  },

  /* ---- gates ---------------------------------------------------------- */
  AND: { name: 'AND', cat: 'gate', nick: "both", plain: "On only when every one of its inputs is on. Think \u201cthis AND that\u201d.", group: 'Gates', vin: true, tip: '1 only when every input is 1.',
    sim: (p, v, put) => put(p.outs[0], andOf(p.ins.map((n) => v[n]))) },
  OR: { name: 'OR', cat: 'gate', nick: "either", plain: "On when at least one of its inputs is on \u2014 or both. Think \u201cthis OR that\u201d.", group: 'Gates', vin: true, tip: '1 when at least one input is 1.',
    sim: (p, v, put) => put(p.outs[0], orOf(p.ins.map((n) => v[n]))) },
  NAND: { name: 'NAND', cat: 'gate', nick: "not both", plain: "On unless every input is on \u2014 an AND with its answer flipped. Every other gate can be built out of NANDs, which is why they are everywhere.", group: 'Gates', vin: true, bubble: true,
    tip: 'AND, inverted. Every other gate can be built from these.',
    sim: (p, v, put) => put(p.outs[0], andOf(p.ins.map((n) => v[n])) ^ 1) },
  NOR: { name: 'NOR', cat: 'gate', nick: "neither", plain: "On only when all of its inputs are off \u2014 an OR with its answer flipped. Like the NAND, it is enough on its own to build anything.", group: 'Gates', vin: true, bubble: true, tip: 'OR, inverted.',
    sim: (p, v, put) => put(p.outs[0], orOf(p.ins.map((n) => v[n])) ^ 1) },
  XOR: { name: 'XOR', cat: 'gate', nick: "different", plain: "On when its two inputs disagree. Adding two bits is an XOR for the answer and an AND for the carry \u2014 that is the whole half adder.", group: 'Gates', vin: true, tip: '1 when an odd number of inputs are 1.',
    sim: (p, v, put) => put(p.outs[0], xorOf(p.ins.map((n) => v[n]))) },
  XNOR: { name: 'XNOR', cat: 'gate', nick: "the same", plain: "On when its inputs match. An XOR with its answer flipped, and the quickest way to ask whether two things agree.", group: 'Gates', vin: true, bubble: true, tip: 'XOR, inverted — 1 when the inputs match.',
    sim: (p, v, put) => put(p.outs[0], xorOf(p.ins.map((n) => v[n])) ^ 1) },
  NOT: {
    name: 'NOT', cat: 'gate', nick: "the opposite", plain: "Flips its input over: 1 becomes 0 and 0 becomes 1. Also called an inverter.", group: 'Gates', bubble: true, w: 46,
    ins: () => [''], outs: () => [''], tip: 'Flips the bit.',
    sim: (p, v, put) => put(p.outs[0], v[p.ins[0]] ^ 1),
  },
  BUF: {
    name: 'BUFFER', cat: 'gate', nick: "a pause", plain: "Passes its input straight through, one tick later. The answer is unchanged; the delay is the point.", group: 'Gates', w: 56,
    ins: () => [''], outs: () => [''], tip: 'Passes the bit through, one tick later.',
    sim: (p, v, put) => put(p.outs[0], v[p.ins[0]]),
  },

  /* ---- memory ---------------------------------------------------------
     Provided ready-made because they are what you reach for once the
     combinational stuff works — but nothing stops you building your own out
     of NANDs and packaging that instead. */
  DFF: {
    name: 'D FLIP-FLOP', cat: 'seq', nick: "one bit of memory", plain: "At the instant the clock rises it takes a copy of D and holds it, whatever D does afterwards, until the next rising edge. This is how anything remembers anything.", group: 'Memory', w: 76,
    ins: () => ['D', '>'], outs: () => ['Q', 'Q̄'],
    tip: 'Copies D to Q on each rising edge of the clock input.',
    sim: (p, v, put) => {
      const d = v[p.ins[0]], c = v[p.ins[1]];
      if (c && !p.st.pc) p.st.q = d;
      p.st.pc = c;
      put(p.outs[0], p.st.q | 0); put(p.outs[1], (p.st.q | 0) ^ 1);
    },
  },
  DLATCH: {
    name: 'D LATCH', cat: 'seq', nick: "one bit, while the door is open", plain: "While the enable input is 1 the output simply follows D. The moment enable drops to 0 it freezes whatever was there.", group: 'Memory', w: 66,
    ins: () => ['D', 'E'], outs: () => ['Q', 'Q̄'],
    tip: 'While enable is 1, Q follows D. When it drops to 0, Q holds.',
    sim: (p, v, put) => {
      if (v[p.ins[1]]) p.st.q = v[p.ins[0]];
      put(p.outs[0], p.st.q | 0); put(p.outs[1], (p.st.q | 0) ^ 1);
    },
  },
  SRLATCH: {
    name: 'SR LATCH', cat: 'seq', nick: "set it, reset it", plain: "Two inputs and one remembered bit. A 1 on S sets the bit; a 1 on R clears it; with both low it holds what it had. Both high at once is the forbidden state — a real NOR latch drives both outputs low, and so does this one, until you let go.", group: 'Memory', w: 76,
    ins: () => ['S', 'R'], outs: () => ['Q', 'Q̄'],
    tip: 'S sets it, R clears it, neither holds. Both at once is forbidden.',
    sim: (p, v, put) => {
      const s = v[p.ins[0]], r = v[p.ins[1]];
      if (s && r) { put(p.outs[0], 0); put(p.outs[1], 0); return; }
      if (s) p.st.q = 1; else if (r) p.st.q = 0;
      put(p.outs[0], p.st.q | 0); put(p.outs[1], (p.st.q | 0) ^ 1);
    },
  },
  JKFF: {
    name: 'JK FLIP-FLOP', cat: 'seq', sync: true, nick: "set, clear, hold or flip", plain: "A D flip-flop with more to say. On each rising clock edge: J and K both 0 holds the bit, J alone sets it, K alone clears it, and both together flip it over. The flip is what makes it the heart of every counter.", group: 'Memory', w: 90,
    ins: () => ['J', 'K', '>'], outs: () => ['Q', 'Q̄'],
    tip: 'On the clock edge: 00 hold, 10 set, 01 clear, 11 toggle.',
    sim: (p, v, put) => {
      const j = v[p.ins[0]], k = v[p.ins[1]], c = v[p.ins[2]];
      if (c && !p.st.pc) { if (j && k) p.st.q = (p.st.q | 0) ^ 1; else if (j) p.st.q = 1; else if (k) p.st.q = 0; }
      p.st.pc = c;
      put(p.outs[0], p.st.q | 0); put(p.outs[1], (p.st.q | 0) ^ 1);
    },
  },
  TFF: {
    name: 'T FLIP-FLOP', cat: 'seq', sync: true, nick: "flips on every tick", plain: "Each rising clock edge, if T is 1, the stored bit flips over; if T is 0 it holds. Feed T a constant 1 and the output is the clock cut in half — chain a few and you are counting in binary.", group: 'Memory', w: 90,
    ins: () => ['T', '>'], outs: () => ['Q', 'Q̄'],
    tip: 'Toggles on each clock edge while T is 1.',
    sim: (p, v, put) => {
      const t = v[p.ins[0]], c = v[p.ins[1]];
      if (c && !p.st.pc && t) p.st.q = (p.st.q | 0) ^ 1;
      p.st.pc = c;
      put(p.outs[0], p.st.q | 0); put(p.outs[1], (p.st.q | 0) ^ 1);
    },
  },
  DFFR: {
    name: 'D FF + CLEAR/SET', cat: 'seq', sync: true, nick: "a flip-flop you can reset", plain: "The ordinary D flip-flop, plus two override inputs that act at once, without waiting for a clock: CLR forces the bit to 0 and SET forces it to 1. This is how a machine gets back to a known state when it starts up.", group: 'Memory', w: 96,
    ins: () => ['D', '>', 'CLR', 'SET'], outs: () => ['Q', 'Q̄'],
    tip: 'D flip-flop with immediate clear and set inputs.',
    sim: (p, v, put) => {
      const d = v[p.ins[0]], c = v[p.ins[1]], clr = v[p.ins[2]], set = v[p.ins[3]];
      if (clr) p.st.q = 0; else if (set) p.st.q = 1; else if (c && !p.st.pc) p.st.q = d;
      p.st.pc = c;
      put(p.outs[0], p.st.q | 0); put(p.outs[1], (p.st.q | 0) ^ 1);
    },
  },
  REG: {
    name: 'REGISTER', cat: 'seq', sync: true, group: 'Memory', nick: 'a whole word of memory',
    plain: 'Holds a number of any width you choose. On each rising clock edge: if CLR is 1 it goes back to zero; otherwise, if LD is 1, it takes whatever is on the D inputs. With neither it simply keeps what it had. A register is just a row of flip-flops sharing one clock.',

/* A chip instance is not in PARTS; it is described by the library entry it
   points at. This stand-in supplies the bits the renderer needs. */
const CHIP_PART = { name: 'chip', cat: 'chip', group: 'My chips', tip: 'A chip you built.' };

const CHIP_COLORS = ['#2f4257', '#3f7d55', '#7a5aa8', '#7d5233', '#365f7d', '#a8445a', '#4a7d7a', '#6d7d33'];
const LED_COLORS = ['#ff5b4a', '#ffc247', '#4bd684', '#5cc8ff', '#c77dff', '#ffffff'];

/* ==========================================================================
   2 · THE DESIGN MODEL

   A "def" is one circuit: a bag of nodes plus the wires between them. The
   circuit on screen is a def; every chip in the library is a def too. That
   sameness is the whole trick — packaging a circuit as a chip just moves a def
   into the library, and opening a chip for editing moves a copy back out.
   ========================================================================== */

function newDef(name = 'Untitled') {
  return { id: uid(), name, color: CHIP_COLORS[0], nodes: [], wires: [] };
}

function makeNode(type, x, y, extra) {
  const part = PARTS[type];
  const n = { id: uid(), type, x, y };
  if (part && part.vin) n.n = 2;                    // gates with a variable input count
  if (part && part.make) Object.assign(n, part.make());
  return Object.assign(n, extra || {});
}

/** Input pins and output pins of a def, ordered top-to-bottom.
    That ordering is what decides the port order on every instance of the chip,
    so dragging a pin up or down in the editor reorders the chip's ports. */
function ioOrder(def) {
  const by = (a, b) => a.y - b.y || a.x - b.x;
  return {
    ins: def.nodes.filter((n) => n.type === 'IN').sort(by),
    outs: def.nodes.filter((n) => n.type === 'OUT').sort(by),
  };
}

/** Port names and label for any node, primitive or chip instance. */
function portsOf(node) {
  if (node.type === 'CHIP') {
    const def = LIB[node.chip];
    if (!def) return { ins: [], outs: [], label: '?missing?' };
    const io = ioOrder(def);
    return {
      ins: io.ins.map((p) => p.label || 'in'),
      outs: io.outs.map((p) => p.label || 'out'),
      label: def.name,
    };
  }
  const part = PARTS[node.type];
  if (!part) return { ins: [], outs: [], label: node.type };
  const n = node.n || 2;
  const ins = part.ins ? part.ins(node) : Array.from({ length: n }, () => '');
  const outs = part.outs ? part.outs(node) : [''];
  return { ins, outs, label: part.name };
}

/** Box and port positions in world coordinates. */
const _textW = new Map();
function textWidth(ctx, s, font) {
  const k = font + '|' + s;
  let w = _textW.get(k);
  if (w === undefined) { ctx.font = font; w = ctx.measureText(s).width; _textW.set(k, w); }
  return w;
}

function geom(node, ctx) {
  const p = portsOf(node);
  const part = node.type === 'CHIP' ? CHIP_PART : PARTS[node.type] || {};
  const rows = Math.max(p.ins.length, p.outs.length, 1);
  let w = part.w || 64;
  /* Every part is a whole number of grid squares tall, with its ports on the
     half-lines — which is exactly where wires run. Ten units of padding above
     the first port and below the last puts the row at h/2 for one port and at
     15, 35, 55... for several, whatever the part. Get that wrong by a couple
     of units and no wire can ever be straight: the router snaps to the nearest
     lane, so a port three units off one leaves a kink at every port on the
     board. Heights are therefore always 10 more than a multiple of 20. */
  const h = part.h || Math.max(GRID * 3, rows * PORT_GAP + GRID);
  /* Plain boxes grow to hold their name and their port labels; a part with a
     long name and named ports would otherwise print over itself. */
  if (ctx && !part.shape) {
    const named = p.ins.some((s) => s) || p.outs.some((s) => s);
    const size = node.type === 'CHIP' ? 12 : 11.5;
    w = Math.max(w, textWidth(ctx, p.label, `600 ${size}px ${FONT}`) + (named ? 50 : 22));
  }
  if (node.type === 'TUNNEL' && ctx) w = Math.max(52, textWidth(ctx, node.label || 'net', '11px ' + FONT) + 30);
  /* ...and a whole number of squares wide too, so a part measures the same in
     grid squares wherever it is and whatever its name happens to be. */
  w = Math.ceil(w / GRID) * GRID;
  /* A junction is a dot, not a box. However many wires meet at one, they meet
     in a single place, so its ports sit on top of each other instead of
     spreading down an edge the way a gate's do. */
  const dot = part.shape === 'joint';
  const spread = (count, i) => (dot || count <= 1 ? h / 2 : (h - (count - 1) * PORT_GAP) / 2 + i * PORT_GAP);

  /* Rotation. node.x/node.y stay the top-left of whatever box the part
     occupies on screen, so a quarter turn swaps the width and the height. The
     ports are worked out in the part's own upright frame and then turned about
     the middle, which is the only place the angle has to be reasoned about —
     hit-testing, wires and the marquee all read what comes back here and never
     need to know a part was turned at all. */
  const rot = turnOf(node);
  const quarter = rot === 90 || rot === 270;
  const W = quarter ? h : w, H = quarter ? w : h;
  const cx = node.x + W / 2, cy = node.y + H / 2;
  const x0 = cx - w / 2, y0 = cy - h / 2;            // the upright box, same middle
  const turn = (px, py) => {
    const dx = px - cx, dy = py - cy;
    if (rot === 90) return { x: cx - dy, y: cy + dx };
    if (rot === 180) return { x: cx - dx, y: cy - dy };
    if (rot === 270) return { x: cx + dy, y: cy - dx };
    return { x: px, y: py };
  };
  /* Which way a port faces once the part has been turned: an output leaves to
     its right, an input is met from its left. The wire router needs this to
     know which way to set off. */
  const face = (sx) => {
    if (rot === 90) return { x: 0, y: sx };
    if (rot === 180) return { x: -sx, y: 0 };
    if (rot === 270) return { x: 0, y: -sx };
    return { x: sx, y: 0 };
  };
  const inDir = face(-1), outDir = face(1);
  const port = (name, px, py, dir) => {
    const q = turn(px, py);
    return { name, x: q.x, y: q.y, dx: dir.x, dy: dir.y };
  };
  return {
    x: node.x, y: node.y, w: W, h: H, label: p.label, rot,
    /* the same box unturned, for the drawing code, which turns the canvas
       instead of turning every coordinate it owns */
    up: { x: x0, y: y0, w, h },
    ins: p.ins.map((name, i) => port(name, x0, y0 + spread(p.ins.length, i), inDir)),
    outs: p.outs.map((name, i) => port(name, x0 + w, y0 + spread(p.outs.length, i), outDir)),
  };
}

/** A part's quarter turn, always one of 0, 90, 180, 270. */
const turnOf = (node) => ((((node.rot || 0) / 90 | 0) % 4) + 4) % 4 * 90;

const nodeById = (def, id) => def.nodes.find((n) => n.id === id);

/** Does chip `hostId` already contain chip `needleId`, at any depth?
    Used to refuse the one edit that would make the compiler run forever. */
function chipContains(hostId, needleId, seen = new Set()) {
  if (hostId === needleId) return true;
  if (seen.has(hostId)) return false;
  seen.add(hostId);
  const def = LIB[hostId];
  if (!def) return false;
  return def.nodes.some((n) => n.type === 'CHIP' && chipContains(n.chip, needleId, seen));
}

/* ==========================================================================
   3 · COMPILER — flatten a design into primitives and nets

   Chips are expanded in place, recursively. Everything that ends up
   electrically joined — wires, joints, tunnels of the same name, the pins on
   either side of a chip boundary — is unioned into one net. What comes out is
   a flat array of gates addressing nets by index, which is all the simulator
   needs to know.
   ========================================================================== */

function compile(def) {
  const dsu = new DSU();
  const prims = [];
  const errors = [];
  const seen = [];                       // every pin key we touched, for net numbering

  const K = (path, id, side, i) => `${path}/${id}.${side}${i}`;
  const touch = (k) => { seen.push(k); return dsu.id(k); };

  function walk(def, path, bound, stack) {
    const io = ioOrder(def);
    const tunnels = new Map();

    for (const node of def.nodes) {
      const ports = portsOf(node);
      const inK = ports.ins.map((_, i) => K(path, node.id, 'i', i));
      const outK = ports.outs.map((_, i) => K(path, node.id, 'o', i));
      inK.forEach(touch); outK.forEach(touch);

      switch (node.type) {
        case 'IN': {
          // Top level: a switch the user can flip. Inside a chip: just the
          // near side of the boundary, fused with the caller's wire.
          const idx = io.ins.indexOf(node);
          if (bound && bound.ins[idx] != null) dsu.union(dsu.id(outK[0]), dsu.id(bound.ins[idx]));
          else if (!bound) prims.push({ type: 'IN', node, path, ins: [], outs: outK, st: {} });
          break;
        }
        case 'OUT': {
          const idx = io.outs.indexOf(node);
          if (bound && bound.outs[idx] != null) dsu.union(dsu.id(inK[0]), dsu.id(bound.outs[idx]));
          break;
        }
        case 'JOINT':
          // Everything that meets here is one net, however many wires arrive.
          for (const k of inK) dsu.union(dsu.id(k), dsu.id(outK[0]));
          break;
        case 'TUNNEL': {
          dsu.union(dsu.id(inK[0]), dsu.id(outK[0]));
          const name = (node.label || 'net').trim().toLowerCase();
          if (tunnels.has(name)) dsu.union(dsu.id(tunnels.get(name)), dsu.id(inK[0]));
          else tunnels.set(name, inK[0]);
          break;
        }
        case 'CHIP': {
          const child = LIB[node.chip];
          if (!child) { errors.push(`A missing chip is placed in "${def.name}".`); break; }
          if (stack.includes(node.chip)) { errors.push(`"${child.name}" contains itself — that branch was skipped.`); break; }
          walk(child, path + '/' + node.id, { ins: inK, outs: outK }, stack.concat(node.chip));
          break;
        }
        default: {
          const part = PARTS[node.type];
          if (!part) { errors.push(`Unknown part "${node.type}".`); break; }
          prims.push({ type: node.type, node, path, ins: inK, outs: outK, st: {} });
        }
      }
    }

    for (const w of def.wires) {
      const a = endKey(def, path, w.a), b = endKey(def, path, w.b);
      if (a == null || b == null) continue;
      dsu.union(touch(a), touch(b));
    }
  }

  /* A wire can outlive the pin it was plugged into: lower a gate's input
     count, or edit a chip's definition to drop one of its IN/OUT pins, and
     every wire that pointed at the pin that is now gone is left holding a
     reference to nothing. Every other broken thing in a circuit — a missing
     chip, one that contains itself — gets said out loud rather than quietly
     dropped, so this does too, instead of the wire just vanishing with no
     word about why. */
  function endKey(def, path, e) {
    const node = nodeById(def, e.n);
    if (!node) {
      errors.push(`A wire in "${def.name}" runs to a part that isn't there any more.`);
      return null;
    }
    const ports = portsOf(node);
    const count = e.s === 'in' ? ports.ins.length : ports.outs.length;
    if (e.i >= count) {
      errors.push(`A wire in "${def.name}" is left over from a pin that "${ports.label}" no longer has.`);
      return null;                                     // port disappeared (input count lowered)
    }
    return K(path, e.n, e.s === 'in' ? 'i' : 'o', e.i);
  }

  walk(def, '', null, []);

  /* Number the nets, then rewrite every pin key as a net index. */
  const netOf = new Map();
  let count = 0;
  const net = (k) => {
    const root = dsu.find(dsu.id(k));
    let n = netOf.get(root);
    if (n === undefined) { n = count++; netOf.set(root, n); }
    return n;
  };
  for (const k of seen) net(k);
  for (const p of prims) { p.ins = p.ins.map(net); p.outs = p.outs.map(net); }

  /* A lookup so the renderer can ask "what is this port's value?". Only
     top-level ports matter for drawing, and those all live at path "". */
  const portNet = new Map();
  for (const k of seen) if (k.startsWith('/') && k.indexOf('/', 1) === -1) portNet.set(k.slice(1), net(k));

  return { def, prims, nets: count, portNet, errors };
}

/* ==========================================================================
   4 · SIMULATOR — unit-delay, synchronous

   One tick: every primitive reads the net values from the previous tick and
   drives its outputs; only then do the new values become visible. Gates
   therefore all take exactly one tick, which is what makes feedback loops
   behave — a NAND pair holds its state, a ring of inverters rings.
   ========================================================================== */

/* Real gates are not all equally quick, and a latch depends on it: two
   perfectly matched cross-coupled NANDs would sit and oscillate forever, which
   is metastability — a real circuit escapes it because one gate is a shade
   faster than the other. Handing out a small spread of propagation delays does
   the same job here. Consecutive gates never draw the same pair, so a
   cross-coupled pair always has a tie-break. */
const DELAY_PLAN = [[1, 0], [2, 0], [2, 1], [3, 0], [3, 1], [3, 2]];

class Sim {
  constructor(compiled, carry) {
    this.c = compiled;
    this.v = new Uint8Array(compiled.nets);       // this tick's values
    this.next = new Uint8Array(compiled.nets);    // swapped in, never reallocated
    this.driven = new Uint8Array(compiled.nets);
    this.clash = new Uint8Array(compiled.nets);
    this.ticks = 0;
    this.last = new Array(compiled.prims.length).fill(null);
    compiled.prims.forEach((p, i) => {
      // A fresh Sim is a fresh machine — unless a recompile handed us the
      // flip-flop contents, so that editing one corner of a circuit does not
      // wipe the memory in another.
      const st = carry ? carry.get(p.path + '/' + p.node.id) : null;
      p.st = st || {};
      const d = DELAY_PLAN[i % DELAY_PLAN.length];
      /* Edge-triggered parts all act on the same tick. Staggering them like the
         gates would let one flip-flop catch another's NEW output on the very
         edge they share, and a shift register would then run through itself. */
      if (PARTS[p.type] && PARTS[p.type].sync) { p.per = 1; p.ph = 0; } else { p.per = d[0]; p.ph = d[1]; }
    });
  }
  states() {
    const m = new Map();
    for (const p of this.c.prims) if (Object.keys(p.st).length) m.set(p.path + '/' + p.node.id, p.st);
    return m;
  }
  tick(now) {
    const v = this.v, drive = this.next, driven = this.driven, clash = this.clash;
    drive.fill(0); driven.fill(0); clash.fill(0);
    const put = (net, val) => {
      const b = val ? 1 : 0;
      if (driven[net] && drive[net] !== b) clash[net] = 1;   // two outputs disagreeing
      driven[net] = 1; drive[net] |= b;
    };
    const ctx = { now };
    const prims = this.c.prims;
    for (let i = 0; i < prims.length; i++) {
      const p = prims[i];
      const fn = PARTS[p.type] && PARTS[p.type].sim;
      if (!fn) continue;
      const held = this.last[i];
      if (held && (this.ticks + p.ph) % p.per !== 0) {
        // Still propagating: keep driving what it last decided.
        for (let k = 0; k < held.length; k += 2) put(held[k], held[k + 1]);
      } else {
        const rec = held || (this.last[i] = []);   // reused, not reallocated
        rec.length = 0;
        fn(p, v, (net, val) => { rec.push(net, val ? 1 : 0); put(net, val); }, ctx);
      }
    }
    this.v = drive; this.next = v;   // swap; undriven nets fell to 0 in the fill
    this.ticks++;
    return this.v;
  }
  /** Run until nothing changes (combinational) or we give up (sequential).
      Needs a few quiet ticks in a row, because the slowest gate only speaks
      every third one. */
  settle(max = 400, now = 0) {
    let quiet = 0;
    for (let i = 0; i < max; i++) {
      const before = this.v;                       // still intact right after the swap
      this.tick(now);
      quiet = sameBits(before, this.v) ? quiet + 1 : 0;
      if (quiet >= 4) return true;
    }
    return false;
  }
  val(net) { return net === undefined ? 0 : this.v[net]; }
}

function sameBits(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

/* ==========================================================================
   5 · APPLICATION STATE
   ========================================================================== */

const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const MONO = 'ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace';
const SPEEDS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024];

let LIB = {};                                   // id -> chip def (see partOf/portsOf)

const S = {
  work: newDef('Untitled'),                     // the circuit on the board
  editing: null,                                // library id, when editing a saved chip
  cam: { x: 0, y: 0, z: 1 },
  sel: new Set(), selWires: new Set(),
  /* Edit or Run. In Run nothing you click can change the wiring — clicks only
     work the thing you have built. Without it, reaching for a switch on a
     crowded board keeps starting a wire you did not want, and the fix for
     that should not be "be more careful". */
  play: false,
  operating: false,                             // the Operate view is covering the board
  run: true, speedIx: 6,
  dirty: true, compiled: null, sim: null,
  armed: null,                                  // part waiting to be placed
  drag: null, hover: null,
  undo: [], redo: [],                           // the circuit's history
  compileWarn: [], runWarn: [],
  ttable: null, stash: null, pendingWire: null,
};

const cv = $('#cv');
/* Not const: the inspector's little "what it's made of" diagrams borrow the
   drawing code by pointing this at their own canvas for one frame. */
let ctx = cv.getContext('2d');
const gm = (n) => geom(n, ctx);
let VW = 0, VH = 0, DPR = 1;

let C = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = (n, f) => (cs.getPropertyValue(n) || f).trim() || f;
  C = {
    bg: g('--bg', '#0f141a'), grid: g('--grid', '#1b2733'), gridStrong: g('--grid-strong', '#23323f'),
    ink: g('--ink', '#dbe6f2'), inkSoft: g('--ink-soft', '#93a5b9'), inkFaint: g('--ink-faint', '#61738a'),
    line: g('--line', '#2a3849'), panel: g('--panel', '#151d26'), panel2: g('--panel-2', '#1b2634'),
    hi: g('--wire-hi', '#ffc247'), lo: g('--wire-lo', '#41505f'), accent: g('--accent', '#ffc247'),
    sel: g('--select', '#5cc8ff'), danger: g('--danger', '#ff6b5e'), warn: g('--warn', '#ffb03a'),
    ok: g('--ok', '#4bd684'),
    chip: g('--chip', '#2f4257'), chipInk: g('--chip-ink', '#dbe6f2'),
    board: g('--board', '#e8e4d8'), boardLine: g('--board-line', '#c9c4b4'), boardHole: g('--board-hole', '#8f8b7e'),
  };
  _textW.clear();
}

function resize() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  VW = Math.max(1, Math.round(r.width)); VH = Math.max(1, Math.round(r.height));
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
}

const cam = () => S.cam;
const toWorld = (sx, sy) => { const c = cam(); return { x: (sx - c.x) / c.z, y: (sy - c.y) / c.z }; };
const toScreen = (wx, wy) => { const c = cam(); return { x: wx * c.z + c.x, y: wy * c.z + c.y }; };
function pointerPos(ev) {
  const r = cv.getBoundingClientRect();
  return { x: ev.clientX - r.left, y: ev.clientY - r.top };
}

/* ==========================================================================
   6 · DRAWING THE CIRCUIT EDITOR
   ========================================================================== */

function roundRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function drawGrid() {
  const c = cam();
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, VW, VH);
  if (c.z < 0.35) return;
  const step = GRID * c.z * (c.z < 0.7 ? 5 : 1);
  const ox = ((c.x % step) + step) % step, oy = ((c.y % step) + step) % step;
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = ox; x < VW; x += step) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, VH); }
  for (let y = oy; y < VH; y += step) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(VW, Math.round(y) + 0.5); }
  ctx.stroke();
  // A heavier line every ten squares, so panning has a sense of scale.
  const big = step * 10;
  const bx = ((c.x % big) + big) % big, by = ((c.y % big) + big) % big;
  ctx.strokeStyle = C.gridStrong;
  ctx.beginPath();
  for (let x = bx; x < VW; x += big) { ctx.moveTo(Math.round(x) + 0.5, 0); ctx.lineTo(Math.round(x) + 0.5, VH); }
  for (let y = by; y < VH; y += big) { ctx.moveTo(0, Math.round(y) + 0.5); ctx.lineTo(VW, Math.round(y) + 0.5); }
  ctx.stroke();
}

/** Where a wire endpoint sits in world coordinates. */
function endPos(def, e) {
  const node = nodeById(def, e.n);
  if (!node) return null;
  const g = gm(node);
  const list = e.s === 'in' ? g.ins : g.outs;
  return list[e.i] || null;
}

/* ---- routing a wire round the parts ---------------------------------------
   A straight line from port to port runs through whatever is in the way, and a
   curve to something BEHIND the source loops right back over itself, which is
   where most of the spaghetti came from. So a wire is planned as a few
   axis-aligned runs that dodge the boxes, and drawn with the corners rounded
   off so it still reads as a wire rather than a circuit-board trace.

   Candidates are tried cheapest-looking first and the first clean one wins; if
   every one is blocked the old curve is used, because a wire that is drawn
   awkwardly is far better than a wire that is not drawn. */
const WIRE_STUB = 13;                                // straight bit off a port
const WIRE_ROUND = 9;                                // corner radius
const JOINT_DOT = 3.5;                               // radius of a solder dot
const OBSTACLE_PAD = 7;
const ROUTE_LIMIT = 320;                             // parts, above which routing is skipped

let obstacleCache = { key: '', rects: [] };

/** Every part's box, padded, with the ids kept so a wire can ignore its own ends. */
function wireObstacles() {
  const key = S.work.nodes.length + ':' + S.work.nodes.map((n) => `${n.x},${n.y},${n.rot || 0}`).join(';');
  if (obstacleCache.key === key) return obstacleCache.rects;
  const rects = S.work.nodes.map((n) => {
    const g = gm(n);
    /* Clearance in proportion to the thing. A junction is one grid square, and
       fencing it off like a chip put a twenty-four unit no-go area round a dot
       seven across — so wires went the long way round something they could
       have passed within a hair of. */
    const pad = Math.max(g.w, g.h) <= GRID * 2 ? 2 : OBSTACLE_PAD;
    return {
      id: n.id,
      x0: g.x - pad, y0: g.y - pad,
      x1: g.x + g.w + pad, y1: g.y + g.h + pad,
    };
  });
  obstacleCache = { key, rects };
  return rects;
}

const segHitsRect = (p, q, r) => {
  const x0 = Math.min(p.x, q.x), x1 = Math.max(p.x, q.x);
  const y0 = Math.min(p.y, q.y), y1 = Math.max(p.y, q.y);
  return x1 > r.x0 && x0 < r.x1 && y1 > r.y0 && y0 < r.y1;
};

/* Only the two stubs are exempt — they start on a port, which is on the edge of
   a box, so they cannot help touching it. Everything between them has to clear
   EVERY box including the wire's own two, which is what stops a wire that has to
   come back on itself from taking the short cut straight through the chip it
   just left. */
const routeClear = (pts, rects) => {
  for (let i = 1; i < pts.length - 2; i++) {
    for (const r of rects) {
      if (segHitsRect(pts[i], pts[i + 1], r)) return false;
    }
  }
  return true;
};

/** The points a wire runs through, ends included. Falls back to null when the
    old curve should be used instead. */
/* How far apart two wires' vertical runs must sit. Twelve was not enough — two
   lanes that close read as one thick line with a kink in it rather than as two
   wires, which defeats the point of separating them at all. At this distance
   they are plainly two, and there is room for the eye to follow either one. */
/* ---- the grid router ------------------------------------------------------
   Parts sit on the ten-unit grid. Wires run on the lines halfway between —
   ...5 rather than ...0 — so a wire can never lie along a part's edge, where
   you cannot tell whether it is touching the part or passing it.

   From there it is a shortest-path search over those half-lines, with two
   things added to the cost of a step. Turning costs much more than going
   straight, so a route comes out with as few corners as it can manage rather
   than staircasing. And a lane somebody else is already using costs more than
   an empty one, so wires spread out instead of piling onto the same line —
   which is what makes crossings visible, and what the hand-rolled lane
   stepping was a poor imitation of. */
const CELL = GRID;                                   // one step of the search
const HALF = GRID / 2;                               // wires live on the half lines
const TURN_COST = 12;                                // corners are expensive
const BUSY_COST = 6;                                 // so is somebody else's lane
/* Going over a part: allowed, and dear enough that a wire goes round anything
   it can get round. Four hundred was not "dear", it was "never": a wire would
   walk the width of the board rather than step over one gate, and the long way
   round is what you actually saw. Sixty prices a crossing at about what going
   round a gate costs, so the detour still wins whenever there is room for it
   and only a wire that is genuinely boxed in goes over the top — where the
   crossing is bridged, so it reads correctly. */
const THROUGH_COST = 60;
/* Zero, not one: the obstacle rects already carry a seven-unit pad, and a
   further whole cell on top made the blocked ring wider than the stub is long,
   so a wire was walled in at its own port before it had gone anywhere. */
const PAD_CELLS = 0;

const laneX = (gx) => HALF + gx * CELL;
const cellOf = (x) => Math.round((x - HALF) / CELL);

/** A tiny binary heap, so the search does not sort its whole frontier. */
function heap() {
  const a = [];
  return {
    size: () => a.length,
    push(item) {
      a.push(item);
      let i = a.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (a[p].f <= a[i].f) break;
        [a[p], a[i]] = [a[i], a[p]]; i = p;
      }
    },
    pop() {
      const top = a[0], last = a.pop();
      if (a.length) {
        a[0] = last;
        let i = 0;
        for (;;) {
          const l = i * 2 + 1, r = l + 1;
          let m = i;
          if (l < a.length && a[l].f < a[m].f) m = l;
          if (r < a.length && a[r].f < a[m].f) m = r;
          if (m === i) break;
          [a[m], a[i]] = [a[i], a[m]]; i = m;
        }
      }
      return top;
    },
  };
}

const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

/** Shortest tidy path between two half-grid points, or null if there is none. */
function gridRoute(A, B, rects, used) {
  const pad = 140;
  const x0 = Math.min(A.x, B.x) - pad, x1 = Math.max(A.x, B.x) + pad;
  const y0 = Math.min(A.y, B.y) - pad, y1 = Math.max(A.y, B.y) + pad;
  const gx0 = cellOf(x0), gx1 = cellOf(x1), gy0 = cellOf(y0), gy1 = cellOf(y1);
  const W = gx1 - gx0 + 1, H = gy1 - gy0 + 1;
  if (W * H > 90000) return null;                    // too far apart to be worth it

  const sx = cellOf(A.x), sy = cellOf(A.y);
  const tx = cellOf(B.x), ty = cellOf(B.y);
  const idx = (gx, gy) => (gy - gy0) * W + (gx - gx0);
  const inside = (gx, gy) => gx >= gx0 && gx <= gx1 && gy >= gy0 && gy <= gy1;

  /* which cells a part occupies — with a little clearance, except right at the
     two ends, where the wire has to be allowed out of its own port */
  const blocked = new Uint8Array(W * H);
  const clear = CELL * 1.3;
  const lo = (v) => Math.floor((v - HALF) / CELL), hi = (v) => Math.ceil((v - HALF) / CELL);
  for (const r of rects) {
    /* round outwards, never inwards — a cell that is even partly inside a part
       has to count as blocked, or a wire slips along the very edge of it */
    const a0 = lo(r.x0) - PAD_CELLS, a1 = hi(r.x1) + PAD_CELLS;
    const b0 = lo(r.y0) - PAD_CELLS, b1 = hi(r.y1) + PAD_CELLS;
    for (let gy = Math.max(b0, gy0); gy <= Math.min(b1, gy1); gy++) {
      for (let gx = Math.max(a0, gx0); gx <= Math.min(a1, gx1); gx++) blocked[idx(gx, gy)] = 1;
    }
  }
  /* Free exactly the cells the two stubs pass through and nothing else. The
     port is on a part's edge, so its own first cells are bound to be blocked —
     but opening a generous disc around each end punched holes in whatever
     happened to be next door, and a search that cannot even start falls back to
     the old curve, which goes straight through everything. */
  for (const [port, end] of [[A.port, A], [B.port, B]]) {
    const steps = Math.ceil(Math.hypot(end.x - (port ? port.x : end.x),
      end.y - (port ? port.y : end.y)) / CELL) + 2;
    for (let i = 0; i <= steps; i++) {
      const t = steps ? i / steps : 0;
      const px = (port ? port.x : end.x) + ((end.x - (port ? port.x : end.x)) * t);
      const py = (port ? port.y : end.y) + ((end.y - (port ? port.y : end.y)) * t);
      const gx = cellOf(px), gy = cellOf(py);
      if (inside(gx, gy)) blocked[idx(gx, gy)] = 0;
    }
    const gx = cellOf(end.x), gy = cellOf(end.y);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (inside(gx + dx, gy + dy)
        && Math.hypot(laneX(gx + dx) - end.x, laneX(gy + dy) - end.y) <= clear) {
        blocked[idx(gx + dx, gy + dy)] = 0;
      }
    }
  }
  if (!inside(sx, sy) || !inside(tx, ty)) return null;

  /* The best cost seen at each (cell, direction) so far, keyed as a plain
     index rather than a "x,y,d" string. A search box can hold tens of
     thousands of cells, and a wire that spans most of the board needs one of
     these for every cell it even looks at — building and hashing a string for
     each was the actual cost of routing a long wire, far more than the search
     itself. -1 marks a state never reached. */
  const bestG = new Int32Array(W * H * 4).fill(-1);
  const stateOf = (gx, gy, d) => idx(gx, gy) * 4 + d;
  const q = heap();
  const h = (gx, gy) => (Math.abs(gx - tx) + Math.abs(gy - ty));
  for (let d = 0; d < 4; d++) q.push({ gx: sx, gy: sy, d, g: 0, f: h(sx, sy), from: null });
  let goal = null, steps = 0;
  while (q.size() && steps++ < 120000) {
    const cur = q.pop();
    if (cur.gx === tx && cur.gy === ty) { goal = cur; break; }
    const key = stateOf(cur.gx, cur.gy, cur.d);
    if (bestG[key] !== -1 && bestG[key] <= cur.g) continue;
    bestG[key] = cur.g;
    for (let d = 0; d < 4; d++) {
      const nx = cur.gx + DIRS[d][0], ny = cur.gy + DIRS[d][1];
      if (!inside(nx, ny)) continue;
      /* A part is dear, not impassable. Hard walls meant a wire that was boxed
         in found no route at all and fell back to a curve straight across the
         board — worse in every way than going over one chip. At this price it
         will walk a very long way round first, and where it does cross, the
         crossing is bridged. */
      let g = cur.g + 1 + (blocked[idx(nx, ny)] ? THROUGH_COST : 0);
      if (cur.from !== null && d !== cur.d) g += TURN_COST;
      /* Only somebody else's lane in the direction we are travelling costs
         anything. Crossing one is free: a crossing gets a bridge, and paying
         to avoid it is what sent wires the long way round. */
      if (used && used.has(`${nx},${ny},${DIRS[d][0] ? 'h' : 'v'}`)) g += BUSY_COST;
      const nk = stateOf(nx, ny, d);
      if (bestG[nk] !== -1 && bestG[nk] <= g) continue;
      q.push({ gx: nx, gy: ny, d, g, f: g + h(nx, ny), from: cur });
    }
  }
  if (!goal) return null;

  const pts = [];
  for (let n = goal; n; n = n.from) pts.push({ x: laneX(n.gx), y: laneX(n.gy) });
  pts.reverse();
  /* drop the points in the middle of a straight run */
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const p = out[out.length - 1], c = pts[i], n = pts[i + 1];
    const straight = (p.x === c.x && c.x === n.x) || (p.y === c.y && c.y === n.y);
    if (!straight) out.push(c);
  }
  out.push(pts[pts.length - 1]);
  return out;
}

function routeWire(a, b, fromJoint, used) {
  if (S.work.nodes.length > ROUTE_LIMIT) return null;
  const rects = wireObstacles();
  /* out of the port on a straight stub first, so a wire always leaves square
     to the part rather than at once heading off sideways */
  const A = { x: a.x + (a.dx || 1) * WIRE_STUB, y: a.y + (a.dy || 0) * WIRE_STUB, port: a };
  const B = { x: b.x + (b.dx || -1) * WIRE_STUB, y: b.y + (b.dy || 0) * WIRE_STUB, port: b };
  const path = gridRoute(A, B, rects, used);
  if (!path) return null;
  const full = [{ x: a.x, y: a.y }, ...path, { x: b.x, y: b.y }];
  return full.filter((q, i) => i === 0
    || Math.abs(q.x - full[i - 1].x) > 0.4 || Math.abs(q.y - full[i - 1].y) > 0.4);
}

/** Every wire's route, worked out in one pass so each can see which lanes the
    ones before it have already taken, and remembered until something moves. */
let routeTable = { key: '', map: new Map() };
function allRoutes() {
  const key = wireObstacles().map((r) => `${Math.round(r.x0)},${Math.round(r.y0)}`).join(';')
    + '|' + S.work.wires.map((w) => w.id).join(',');
  if (routeTable.key === key) return routeTable.map;
  const map = new Map();
  /* every cell a route has claimed, so the next wire prefers a free lane —
     this is what stops two of them lying on the same line */
  const used = new Set();
  for (const wr of S.work.wires) {
    const a = endPos(S.work, wr.a), b = endPos(S.work, wr.b);
    if (!a || !b) continue;
    const src = nodeById(S.work, wr.a.n);
    const pts = routeWire(a, b, !!src && src.type === 'JOINT', used);
    map.set(wr.id, pts);
    if (pts) {
      /* Which way each lane was claimed, not merely that it was. Two wires
         lying along the same lane are one line to look at and must be kept
         apart; two wires crossing are a crossing, which is drawn with a bridge
         and reads perfectly well. Recording the direction lets the next wire
         pay for the first and cross for nothing. */
      for (let i = 1; i < pts.length - 2; i++) {
        const q = pts[i], r = pts[i + 1];
        const axis = Math.abs(r.x - q.x) >= Math.abs(r.y - q.y) ? 'h' : 'v';
        const gx0 = cellOf(Math.min(q.x, r.x)), gx1 = cellOf(Math.max(q.x, r.x));
        const gy0 = cellOf(Math.min(q.y, r.y)), gy1 = cellOf(Math.max(q.y, r.y));
        for (let gy = gy0; gy <= gy1; gy++) {
          for (let gx = gx0; gx <= gx1; gx++) used.add(`${gx},${gy},${axis}`);
        }
      }
    }
  }
  routeTable = { key, map };
  return map;
}

function wireRoute(wr, a, b) {
  const map = allRoutes();
  return map.has(wr.id) ? map.get(wr.id) : null;
}

/* ---- where wires cross without joining -------------------------------------
   Two wires meeting at a dot are one signal; two wires crossing are two. Drawn
   the same way there is no telling which you are looking at, which is the one
   thing a schematic must never be ambiguous about. So a crossing gets the
   little hop every schematic uses: the wire passing over is bridged, the one
   underneath runs straight through. */
/* A bridge says "these two do not touch" without drawing a whole box over the
   crossing — or even breaking either wire. Both run straight through; a short
   tick crosses the one on top, which is the least a schematic can mark and
   still say the two do not join. Nothing to route round, nothing to repaint
   underneath: a crossing costs one stroke instead of five. */
const HOP_TICK = 4.5;                                // half the length of the tick
let hopCache = { key: '', hops: [] };

const crossAt = (p1, p2, q1, q2) => {
  /* Cheaper than the determinant below, and it rejects almost everything: two
     segments that cannot possibly cross never reach the division at all. */
  if (Math.max(p1.x, p2.x) < Math.min(q1.x, q2.x) || Math.max(q1.x, q2.x) < Math.min(p1.x, p2.x)
    || Math.max(p1.y, p2.y) < Math.min(q1.y, q2.y) || Math.max(q1.y, q2.y) < Math.min(p1.y, p2.y)) return null;
  const d1x = p2.x - p1.x, d1y = p2.y - p1.y;
  const d2x = q2.x - q1.x, d2y = q2.y - q1.y;
  const den = d1x * d2y - d1y * d2x;
  if (Math.abs(den) < 1e-6) return null;             // parallel, so no crossing
  const t = ((q1.x - p1.x) * d2y - (q1.y - p1.y) * d2x) / den;
  const u = ((q1.x - p1.x) * d1y - (q1.y - p1.y) * d1x) / den;
  const edge = 0.05;                                 // keep hops off the corners
  if (t < edge || t > 1 - edge || u < edge || u > 1 - edge) return null;
  return { x: p1.x + d1x * t, y: p1.y + d1y * t, dx: d1x, dy: d1y, len: Math.hypot(d1x, d1y) };
};

/** The box a routed path's points all fall inside — cheap to compare, and it
    is what turns "check every wire against every other wire" into "check
    every wire against the handful that are anywhere near it". */
const boxOf = (pts) => {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) { if (p.x < x0) x0 = p.x; if (p.x > x1) x1 = p.x; if (p.y < y0) y0 = p.y; if (p.y > y1) y1 = p.y; }
  return { x0, y0, x1, y1 };
};
const boxesMeet = (a, b) => a.x0 <= b.x1 && b.x0 <= a.x1 && a.y0 <= b.y1 && b.y0 <= a.y1;

/** Every place two wires cross without sharing an end. The later wire carries
    the tick, so exactly one of each pair does — and it marks the crossing
    even when both wires are the same net: two branches of one signal still
    read as two lines to the eye, and a crossing with no mark looks exactly
    like a bridge that was forgotten, not like a crossing that is safe. */
function wireHops() {
  if (S.work.nodes.length > ROUTE_LIMIT) return [];
  const key = wireObstacles().length + '|'
    + S.work.wires.map((w) => `${w.id}:${w.a.n}.${w.a.s}${w.a.i}-${w.b.n}.${w.b.s}${w.b.i}`).join(';') + '|'
    + S.work.nodes.map((n) => `${n.x},${n.y},${n.rot || 0}`).join(';');
  if (hopCache.key === key) return hopCache.hops;
  const lines = [];
  for (const w of S.work.wires) {
    const a2 = endPos(S.work, w.a), b2 = endPos(S.work, w.b);
