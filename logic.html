          if (LIB[id] && S.armed && S.armed.type === 'CHIP' && S.armed.chip === id) { armPart(null); return; }
          installLib(e.key); scheduleSave(); renderPalette(); armPart({ type: 'CHIP', chip: id });
        },
      }, h('span', { class: 'top' }, h('span', { class: 'sw', style: 'background:' + LIB_CAT_COLOR[cat] }), e.name,
        h('span', { class: 'lvl lvl-' + e.level }, e.level)),
      h('span', { class: 'sub' }, e.desc)));
    }
    host.append(box);
  }
}

/* ---- inspector ---------------------------------------------------------- */

function renderInspector() {
  const host = $('#inspector');
  if (previewObs) previewObs.disconnect();       // the old preview canvases are about to go
  host.innerHTML = '';
  refreshOperateButton();

  const selNodes = S.work.nodes.filter((n) => S.sel.has(n.id));

  /* circuit summary */
  const io = ioOrder(S.work);
  const sec1 = h('div', { class: 'insp-sec' }, h('h3', {}, S.editing ? 'Editing chip' : 'This circuit'));
  sec1.append(h('div', { class: 'row' },
    h('label', {}, 'Name'),
    h('span', { class: 'ctl' }, h('input', {
      type: 'text', value: S.work.name, spellcheck: 'false',
      oninput: (e) => { S.work.name = e.target.value; renderCrumbs(); scheduleSave(); },
    }))));
  sec1.append(h('div', { class: 'kv' }, h('span', {}, 'Parts'), h('span', {}, String(S.work.nodes.length))));
  sec1.append(h('div', { class: 'kv' }, h('span', {}, 'Wires'), h('span', {}, String(S.work.wires.length))));
  sec1.append(h('div', { class: 'kv' }, h('span', {}, 'Pins'),
    h('span', {}, `${io.ins.length} in · ${io.outs.length} out`)));
  sec1.append(h('div', { class: 'stack', style: 'margin-top:8px' },

    h('button', { class: 'btn', onclick: showTruthTable }, 'Truth table'),
    h('button', { class: 'btn', title: 'Nudge parts so the wires between them run dead straight (L)', onclick: () => straightenWires(null) }, 'Line up the wires'),
    S.editing ? h('button', { class: 'btn', onclick: () => leaveChipEdit(false) }, 'Stop editing (discard)') : null,
    h('button', { class: 'btn danger', onclick: clearBoard }, 'Clear the board')));
  host.append(sec1);

  /* selection */
  if (selNodes.length === 1) host.append(nodeInspector(selNodes[0]));
  else if (selNodes.length > 1) {
    host.append(h('div', { class: 'insp-sec' },
      h('h3', {}, 'Selection'),
      h('p', { class: 'muted' }, `${selNodes.length} parts selected.`),
      h('div', { class: 'stack' },
        h('div', { class: 'rotrow' },
          h('button', { class: 'btn', title: 'Turn the whole group a quarter turn (Shift+R)', onclick: () => rotateSelection(-1) }, '↺'),
          h('span', {}, 'Turn all ' + selNodes.length),
          h('button', { class: 'btn', title: 'Turn the whole group a quarter turn (R)', onclick: () => rotateSelection(1) }, '↻')),
        h('button', { class: 'btn', title: 'Nudge these so their wires run dead straight (L)', onclick: () => straightenWires(selNodes) }, 'Line up the wires'),
        h('button', { class: 'btn', onclick: duplicateSelection }, 'Duplicate (Ctrl+D)'),
        h('button', { class: 'btn', title: 'Copy, then hover the board and Ctrl+V to drop it there', onclick: copySelection }, 'Copy (Ctrl+C)'),
        h('button', { class: 'btn danger', onclick: deleteSelection }, 'Delete'))));
  } else if (S.selWires.size) {
    host.append(h('div', { class: 'insp-sec' },
      h('h3', {}, 'Selection'),
      h('p', { class: 'muted' }, `${S.selWires.size} wire(s) selected.`),
      h('div', { class: 'stack' },
        h('button', {
          class: 'btn', title: 'Put a junction on this wire so it can feed more than one input (J)',
          onclick: () => addJointToSelection(null),
        }, 'Add a junction'),
        h('button', { class: 'btn danger', onclick: deleteSelection }, 'Delete'))));
  } else {
    host.append(h('div', { class: 'insp-sec' },
      h('h3', {}, 'Nothing selected'),
      h('p', { class: 'muted' }, S.play
        ? 'Use mode: click at or near an input pin to flip it, or hold a button down — you do not have to hit it exactly. Right-drag moves the view. Nothing you click can move a part or change a wire. Press E, or the ✎ Edit button up top, to build again.'
        : 'Pick a part from the left, then click the board. To wire two parts together, click one port and then the other. Click an input pin to flip it between 0 and 1.')));
  }

  if (S.ttable) host.append(truthTableSection());
}

/** Change a part's size (bit width, select lines…). Its ports are renumbered by
    that, so every wire is re-pointed at the port it was on by NAME, and any
    wire whose port no longer exists is let go rather than left dangling. */
function setNodeParam(node, key, val) {
  if (node[key] === val) return;
  pushUndo();
  const before = portsOf(node);
  node[key] = val;
  const after = portsOf(node);
  S.work.wires = S.work.wires.filter((w) => {
    if (w.b.n === node.id) { const j = after.ins.indexOf(before.ins[w.b.i]); if (j < 0) return false; w.b.i = j; }
    if (w.a.n === node.id) { const j = after.outs.indexOf(before.outs[w.a.i]); if (j < 0) return false; w.a.i = j; }
    return true;
  });
  markDirty(); renderInspector();
}

function nodeInspector(node) {
  const part = node.type === 'CHIP' ? LIB[node.chip] : PARTS[node.type];
  const sec = h('div', { class: 'insp-sec' }, h('h3', {}, 'Selected part'));
  const title = node.type === 'CHIP' ? (part ? part.name : 'missing chip') : part.name;
  /* the name and the shape together, so one teaches the other */
  sec.append(h('div', { class: 'kv' }, h('span', {}, 'Type'),
    h('span', { class: 'typeval' }, GATE_SHAPE[node.type] ? gateSwatch(node.type, null) : null, title)));

  /* What it IS is the type above; what it IS HERE is this. A chain of four
     identical adders is four things called "Full adder", and telling them
     apart is what the schematics of the world use U1, U2, U3 for. */
  if (!S.play) {
    sec.append(h('div', { class: 'row' },
      h('label', {}, 'Called'),
      h('span', { class: 'ctl' }, h('input', {
        type: 'text', value: node.tag || '', spellcheck: 'false',
        placeholder: 'module 0, U1, carry stage…',
        oninput: (e) => {
          node.tag = e.target.value.slice(0, 24);
          markDirty(); scheduleSave();
        },
      }))));
  } else if (node.tag) {
    sec.append(h('div', { class: 'kv' }, h('span', {}, 'Called'), h('span', {}, node.tag)));
  }

  /* The same "here is what this is" treatment the breadboard gets. */
  const prim = PARTS[node.type];
  if (prim && prim.nick) {
    sec.append(h('div', { class: 'kv' }, h('span', {}, 'In plain words'), h('span', {}, prim.nick)));
  }
  const blurb = prim ? (prim.plain || prim.tip)
    : (part ? `A chip you made: ${part.nodes.length} parts inside, wired up the way you left them.` : null);
  if (blurb) {
    sec.append(h('h4', { class: 'does' }, 'What it does'));
    sec.append(h('p', { class: 'muted', style: 'margin:0 0 8px' }, blurb));
  }

  const rerender = () => { markDirty(); renderInspector(); };

  if (node.type === 'IN' || node.type === 'OUT' || node.type === 'TUNNEL') {
    sec.append(h('div', { class: 'row' },
      h('label', {}, node.type === 'TUNNEL' ? 'Net name' : 'Pin name'),
      h('span', { class: 'ctl' }, h('input', {
        type: 'text', value: node.label || '', spellcheck: 'false',
        oninput: (e) => { node.label = e.target.value; markDirty(); },
      }))));
  }
  if (node.type === 'IN') {
    sec.append(h('div', { class: 'row' },
      h('label', {}, 'Behaviour'),
      h('span', { class: 'ctl' }, h('select', {
        onchange: (e) => { node.momentary = e.target.value === 'btn'; node.value = 0; rerender(); },
      }, h('option', { value: 'sw', selected: !node.momentary }, 'Switch (stays put)'),
        h('option', { value: 'btn', selected: !!node.momentary }, 'Button (springs back)')))));
  }
  if (PARTS[node.type] && PARTS[node.type].vin) {
    sec.append(h('div', { class: 'row' },
      h('label', {}, 'Inputs'),
      h('span', { class: 'ctl' }, h('input', {
        type: 'number', min: '2', max: '8', value: String(node.n || 2),
        onchange: (e) => {
          pushUndo();
          node.n = clamp(parseInt(e.target.value, 10) || 2, 2, 8);
          S.work.wires = S.work.wires.filter((w) => !(w.b.n === node.id && w.b.i >= node.n));
          rerender();
        },
      }))));
  }
  for (const prm of (PARTS[node.type] && PARTS[node.type].params) || []) {
    sec.append(h('div', { class: 'row' },
      h('label', {}, prm.label),
      h('span', { class: 'ctl' }, h('input', {
        type: 'number', min: String(prm.min), max: String(prm.max), value: String(node[prm.key]),
        onchange: (e) => { setNodeParam(node, prm.key, clamp(parseInt(e.target.value, 10) || prm.min, prm.min, prm.max)); },
      }))));
  }
  if (node.type === 'NUMIN') {
    sec.append(h('div', { class: 'row' },
      h('label', {}, 'Value'),
      h('span', { class: 'ctl' }, h('input', {
        type: 'number', min: '0', value: String(node.value | 0),
        oninput: (e) => {
          const max = (1 << (node.bits || 8)) - 1;
          node.value = clamp(parseInt(e.target.value, 10) || 0, 0, max);
          scheduleSave();
        },
      }))));
  }
  if (node.type === 'CLOCK') {
    sec.append(h('div', { class: 'row' },
      h('label', {}, 'Rate (Hz)'),
      h('span', { class: 'ctl' }, h('input', {
        type: 'number', min: '0.1', max: '50', step: '0.1', value: String(node.hz),
        oninput: (e) => { node.hz = clamp(parseFloat(e.target.value) || 1, 0.05, 200); scheduleSave(); },
      }))));
  }
  if (node.color !== undefined) {
    const row = h('div', { class: 'swatches' });
    for (const col of LED_COLORS) {
      row.append(h('button', {
        class: 'swatch' + (node.color === col ? ' on' : ''), style: `background:${col}`,
        onclick: () => { node.color = col; rerender(); },
      }));
    }
    sec.append(h('div', { class: 'row' }, h('label', {}, 'Colour'), h('span', { class: 'ctl' }, row)));
  }
  if (node.type === 'CHIP' && part) {
    sec.append(h('div', { class: 'stack', style: 'margin-top:6px' },
      h('button', { class: 'btn', onclick: () => openChip(node.chip) }, 'Open this chip')));
  }
  if (!S.play) sec.append(h('div', { class: 'stack', style: 'margin-top:8px' },
    h('div', { class: 'rotrow' },
      h('button', { class: 'btn', title: 'Turn it a quarter turn (Shift+R)', onclick: () => rotateSelection(-1) }, '↺'),
      h('span', {}, turnOf(node) ? `Turned ${turnOf(node)}°` : 'Upright'),
      h('button', { class: 'btn', title: 'Turn it a quarter turn (R)', onclick: () => rotateSelection(1) }, '↻')),
    h('button', { class: 'btn', title: 'Copy, then hover the board and Ctrl+V to drop it there', onclick: copySelection }, 'Copy (Ctrl+C)'),
    h('button', { class: 'btn danger', onclick: deleteSelection }, 'Delete part')));

  if (node.type === 'ROM' || node.type === 'RAM') sec.append(memoryEditor(node));

  const rec = RECIPES[node.type];
  if (rec) sec.append(madeOfBlock(rec.text, rec.make, 'Build it on the board', null, node.type));
  /* The bigger parts have a twin in the chip library, built from plain gates. */
  const twin = LIB_TWIN[node.type] && !rec ? libEntry(LIB_TWIN[node.type]) : null;
  if (twin) {
    sec.append(madeOfBlock(
      `This part does in one step what a circuit of gates does in many. Here is such a circuit — the library’s “${twin.name}”: ${twin.desc}`,
      () => clone(LIB[installLib(twin.key, true)]), 'Build it on the board', 'Built from gates instead'));
  }

  /* The diagram above is a small one so it can be read. This builds the array
     at the size this part is actually set to, which is the honest answer to
     "how much is in there" — and usually a surprise. */
  if (node.type === 'RAM' && rec) {
    const words = 1 << (node.abits || 4), nd = node.dbits || 8;
    const est = ramArraySize(node.abits || 4, node.dbits || 8);
    sec.append(h('div', { class: 'stack', style: 'margin-top:6px' },
      h('button', {
        class: 'btn', onclick: () => {
          if (est > 2500) {
            toast(`${words} × ${nd} comes to ${est} parts — too many to draw at once. Try fewer address bits.`, true);
            return;
          }
          insertDef(ramArray(node.abits || 4, node.dbits || 8));
        },
      }, `Build all ${words} × ${nd} of it (~${est} parts)`),
      h('button', {
        class: 'btn', onclick: () => openDiagram(
          'One cell on its own. SELECT and WRITE together let the clock edge through, so only the chosen cell stores anything; SELECT alone guards the way out.',
          rec.cell, 'Build one cell', 'One RAM cell', 'RAM'),
      }, 'Show just one cell')));
  }
  else if (node.type === 'CHIP' && part && part.nodes.length) {
    sec.append(madeOfBlock(`What you drew inside “${part.name}”.`, () => clone(part), 'Copy it onto the board'));
  }
  return sec;
}

/* ---- "what it's made of" ------------------------------------------------
   The diagram is the real circuit, drawn with the same code as the board and
   simulated for a moment first, so the wires show their actual levels. */

/* One observer for all preview canvases: it fires when a canvas first gets a
   size, which covers the panel being laid out and the drawer being opened on a
   phone. renderInspector disconnects it before rebuilding. */
const previewObs = window.ResizeObserver
  ? new ResizeObserver((entries) => {
    for (const e of entries) if (e.target._def) drawDefInto(e.target, e.target._def);
  })
  : null;

function madeOfBlock(text, makeDef, buttonLabel, title, forType) {
  const canvas = h('canvas', {
    class: 'preview', title: 'Click to see it bigger',
    onclick: () => openDiagram(text, makeDef, buttonLabel, title, forType),
  });
  canvas._def = makeDef();
  if (previewObs) previewObs.observe(canvas);
  else requestAnimationFrame(() => drawDefInto(canvas, canvas._def));
  return h('div', { class: 'madeof' },
    h('h4', {}, title || 'What it’s made of'),
    h('p', { class: 'muted' }, text),
    canvas,
    h('p', { class: 'zoomhint' }, 'Click the picture to see it bigger'),
    buttonLabel ? h('button', {
      class: 'btn', style: 'margin-top:5px;width:100%',
      onclick: () => insertDef(makeDef()),
    }, buttonLabel) : null);
}

/* ---- going down a level at a time ----------------------------------------
   A RAM is made of flip-flops and gates; a flip-flop is made of NANDs; a NAND
   is where this simulator stops and transistors begin. Clicking a part inside
   a diagram opens what THAT is made of, keeping a trail behind you. Anything
   already on the trail is not clickable, which is what stops the obvious
   circle — an AND is made of NANDs, and a NAND is an AND with the answer
   flipped — from going round for ever. */

/* ---- taking a whole circuit apart, a layer at a time ---------------------
   Not "look inside this one part" but "replace every part with what it is made
   of, and show me the result". Do it repeatedly and a memory becomes a field of
   NAND gates, which is what it honestly is. */

/** An AND of any width: a NAND, then that NAND's answer flipped. */
function gateFromNands(kind, n) {
  const b = builder(kind + ' from NANDs');
  const pins = [];
  for (let i = 0; i < n; i++) pins.push(b.pin('A' + i, 0, i * 90));
  const invert = kind === 'OR' || kind === 'NOR';
  const feed = pins.map((p, i) => {
    if (!invert) return p;
    const g = b.add('NAND', 180, i * 90, { n: 2 });
    b.w(p, 0, g, 0); b.w(p, 0, g, 1);
    return g;
  });
  const mid = b.add('NAND', 380, (n - 1) * 45, { n: Math.max(2, n) });
  feed.forEach((f, i) => b.w(f, 0, mid, i));
  if (n === 1) b.w(feed[0], 0, mid, 1);
  let last = mid;
  if (kind === 'AND' || kind === 'NOR') {            // NAND -> AND, OR -> NOR
    last = b.add('NAND', 550, (n - 1) * 45, { n: 2 });
    b.w(mid, 0, last, 0); b.w(mid, 0, last, 1);
  }
  const o = b.out('out', 720, (n - 1) * 45 + 8);
  b.w(last, 0, o, 0);
  return { def: b.def, ins: pins.map((p) => p.label), outs: ['out'] };
}

/* Which recipe stands in for a part when the whole circuit is broken down, and
   which of its pins line up with which of the part's ports — by name, because
   a recipe's pins are not always in the same order as the part's. NAND is
   missing on purpose: it is the floor. A builder that returns null means "leave
   this one alone", which is how a three-input XOR stays put: the recipe for it
   only knows two. */
const EXPANSIONS = {
  NOT: () => ({ def: recNOT(), ins: ['in'], outs: ['out'] }),
  BUF: () => ({ def: recBUF(), ins: ['in'], outs: ['out'] }),
  XOR: (node) => ((node.n || 2) === 2 ? { def: recXOR(), ins: ['A', 'B'], outs: ['out'] } : null),
  XNOR: (node) => ((node.n || 2) === 2 ? { def: recXNOR(), ins: ['A', 'B'], outs: ['out'] } : null),
  DLATCH: () => ({ def: recDLATCH(), ins: ['D', 'E'], outs: ['Q', 'Q̄'] }),
  DFF: () => ({ def: exNandDFF(), ins: ['D', 'CLK'], outs: ['Q', 'Q̄'] }),
  AND: (node) => gateFromNands('AND', node.n || 2),
  OR: (node) => gateFromNands('OR', node.n || 2),
  NOR: (node) => gateFromNands('NOR', node.n || 2),
};

/** Can this particular part be swapped for something simpler? */
const hasRecipe = (node) => !!(EXPANSIONS[node.type] && EXPANSIONS[node.type](node));

/** Is there anything in here that a press of "Simpler" would actually change? */
function anySimpler(def) {
  return def.nodes.some(hasRecipe);
}

/** Every kind of part in here that could be opened up, commonest first, with
    how many of each there are. This is what the "open up just one kind"
    buttons are made from. */
function openableTypes(def) {
  const counts = new Map();
  for (const n of def.nodes) if (hasRecipe(n)) counts.set(n.type, (counts.get(n.type) || 0) + 1);
  return [...counts.entries()].sort((a, b) => b[1] - a[1]);
}

/** Replace every part that has a simpler form with that form, wired up in its
    place. Pass a type name as `only` to open up just that one kind and leave
    the rest of the circuit standing — which is how you see all eight flip-flops
    inside a RAM as NANDs while the decoder around them is still recognisable.
    Returns null when there is nothing left to replace. */
function expandOnce(def, only) {
  const SPREAD = 2.6;
  const out = newDef(def.name);
  out.color = def.color;
  const kept = new Map();                            // parts left as they were
  const inMap = new Map(), outMap = new Map();       // how a replaced part's ports map inwards
  let changed = false;

  for (const node of def.nodes) {
    const build = only && node.type !== only ? null : EXPANSIONS[node.type];
    const recipe = build && build(node);
    if (!recipe) {
      const c = clone(node); c.id = uid();
      c.x = node.x * SPREAD; c.y = node.y * SPREAD;
      out.nodes.push(c); kept.set(node.id, c.id);
      continue;
    }
    changed = true;
    const { def: sub, ins: inNames, outs: outNames } = recipe;
    const inner = new Map();
    const box = contentBoundsOf(sub.nodes) || { x0: 0, y0: 0, x1: 1, y1: 1 };
    const k = Math.min(0.85, 340 / Math.max(1, box.x1 - box.x0));
    for (const n of sub.nodes) {
      if (n.type === 'IN' || n.type === 'OUT') continue;
      const c = clone(n); c.id = uid();
      c.x = node.x * SPREAD + (n.x - box.x0) * k;
      c.y = node.y * SPREAD + (n.y - box.y0) * k;
      out.nodes.push(c); inner.set(n.id, c.id);
    }
    for (const w of sub.wires) {
      if (inner.has(w.a.n) && inner.has(w.b.n)) {
        out.wires.push({
          id: uid(),
          a: { n: inner.get(w.a.n), s: w.a.s, i: w.a.i },
          b: { n: inner.get(w.b.n), s: w.b.s, i: w.b.i },
        });
      }
    }
    const pinNamed = (name, type) => sub.nodes.find((n) => n.type === type && n.label === name);
    inMap.set(node.id, inNames.map((nm) => {
      const pin = pinNamed(nm, 'IN');
      if (!pin) return [];
      return sub.wires.filter((w) => w.a.n === pin.id && inner.has(w.b.n))
        .map((w) => ({ n: inner.get(w.b.n), s: w.b.s, i: w.b.i }));
    }));
    outMap.set(node.id, outNames.map((nm) => {
      const pin = pinNamed(nm, 'OUT');
      const w = pin && sub.wires.find((x) => x.b.n === pin.id && inner.has(x.a.n));
      return w ? { n: inner.get(w.a.n), s: 'out', i: w.a.i } : null;
    }));
  }

  for (const w of def.wires) {
    const srcs = outMap.has(w.a.n)
      ? [outMap.get(w.a.n)[w.a.i]].filter(Boolean)
      : kept.has(w.a.n) ? [{ n: kept.get(w.a.n), s: 'out', i: w.a.i }] : [];
    const dsts = inMap.has(w.b.n)
      ? (inMap.get(w.b.n)[w.b.i] || [])
      : kept.has(w.b.n) ? [{ n: kept.get(w.b.n), s: 'in', i: w.b.i }] : [];
    for (const a of srcs) for (const b of dsts) out.wires.push({ id: uid(), a: { ...a }, b: { ...b } });
  }
  return changed ? out : null;
}

/** A one-line census of what a circuit is currently made of. Pins are counted
    too, so the numbers add up to the total the caption quotes. */
function partsCensus(def) {
  const counts = {};
  for (const n of def.nodes) counts[n.type] = (counts[n.type] || 0) + 1;
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  return names.map((t) => `${counts[t]} × ${(PARTS[t] || {}).name || t}`).join(', ') || 'nothing';
}

let diagTrail = [];

function openDiagram(text, makeDef, buttonLabel, title, type) {
  diagTrail = [{ title: title || 'What it’s made of', text, make: makeDef, button: buttonLabel, type }];
  renderDiagram();
}

function descendable(node) {
  const rec = RECIPES[node.type];
  if (!rec || !rec.make) return false;
  /* On a broken-down level the NAND has just been called the floor, so it must
     not also be a door back up to "an AND and a NOT". Only the parts that
     another press of Simpler would replace are worth opening. */
  const lvl = diagTrail[diagTrail.length - 1];
  if (lvl && lvl.type === '__level' && !(EXPANSIONS[node.type] && EXPANSIONS[node.type](node))) return false;
  return !diagTrail.some((l) => l.type === node.type);
}

function renderDiagram() {
  const lvl = diagTrail[diagTrail.length - 1];
  if (!lvl.def) lvl.def = lvl.make();

  const canvas = h('canvas', { class: 'preview big' });
  const trail = h('p', { class: 'diagtrail' });
  diagTrail.forEach((step, i) => {
    if (i) trail.append(h('span', { class: 'sep' }, ' › '));
    trail.append(i === diagTrail.length - 1
      ? h('b', {}, step.title)
      : h('button', {
        onclick: () => { diagTrail.length = i + 1; renderDiagram(); },
      }, step.title));
  });

  /* Open up every part, or every part of one kind. Opening one kind at a time
     is the useful one: all eight flip-flops in a RAM become NANDs while the
     decoder around them stays as ANDs, so you can still see which clump of six
     NANDs is which flip-flop. */
  const openUp = (only) => {
    const next = expandOnce(lvl.def, only);
    if (!next) return;
    if (next.nodes.length > 1600) {
      toast(`That would come to ${next.nodes.length} parts — too many to draw at once.`, true);
      return;
    }
    const nameOf = (t) => (PARTS[t] || {}).name || t;
    const many = only ? lvl.def.nodes.filter((n) => n.type === only).length : 0;
    /* The line under the canvas already says whether this is the bottom, so the
       caption only has to say what just happened. */
    diagTrail.push({
      title: only ? `${nameOf(only)} opened up · ${next.nodes.length} parts`
        : `simpler · ${next.nodes.length} parts`,
      text: (only
        ? `All ${many} of the ${nameOf(only)}s have been swapped for what they are made of, each one wired into its own place. Everything else is exactly as it was. `
        : `Every part with a simpler form has been swapped for it, wired into the same place. `)
        + `${lvl.def.nodes.length} parts became ${next.nodes.length}: ${partsCensus(next)}.`,
      def: next, make: () => next, button: 'Build it on the board', type: '__level',
    });
    renderDiagram();
  };

  const kinds = openableTypes(lvl.def);
  const body = h('div', {},
    diagTrail.length > 1 ? trail : null,
    h('p', { class: 'muted', style: 'margin:0 0 10px' }, lvl.text),
    canvas,
    h('p', { class: 'zoomhint' },
      'Scroll to zoom, drag to move. ',
      h('button', {
        class: 'linky',
        onclick: () => { lvl.cam = null; renderDiagram(); },
      }, 'Fit it all in'),
      lvl.def.nodes.some(descendable)
        ? ' · Click any part with a ⌄ on it to see what that is made of'
        : ' · Nothing here goes any simpler. Below a NAND are transistors — the breadboard has those.'),
    kinds.length ? h('div', { class: 'openups' },
      h('span', {}, 'Open up every…'),
      ...kinds.map(([type, n]) => h('button', {
        title: `Replace all ${n} of them with what they are made of, and leave the rest alone`,
        onclick: () => openUp(type),
      }, `${(PARTS[type] || {}).name || type} (${n})`))) : null);

  const canSimplify = kinds.length > 0;
  const foot = h('div', {},
    diagTrail.length > 1
      ? h('button', {
        class: 'btn', style: 'margin-right:auto;float:left',
        onclick: () => { diagTrail.pop(); renderDiagram(); },
      }, '← Back up')
      : null,
    h('button', {
      class: 'btn', style: 'float:left', disabled: !canSimplify,
      title: canSimplify
        ? 'Replace every part at once with what it is made of'
        : 'Everything here is already a NAND gate or a pin',
      onclick: () => openUp(null),
    }, canSimplify ? 'Simpler ↓' : 'All NANDs'),
    h('button', { class: 'btn', onclick: closeModal }, 'Close'),
    h('button', {
      class: 'btn primary', style: 'margin-left:8px',
      onclick: () => { closeModal(); insertDef(lvl.make()); },
    }, lvl.button || 'Build it on the board'));

  const draw = () => drawDefInto(canvas, lvl.def, 1.6, true, { cam: lvl.cam, cache: lvl });
  /* growing the sheet changes the canvas size, so the fitted view has to be
     worked out again from scratch */
  openModal('What it’s made of', body, foot, true,
    { onResize: () => requestAnimationFrame(() => { lvl.cam = null; draw(); lvl.cam = { ...canvas._cam }; }) });
  requestAnimationFrame(() => {
    draw();
    if (!lvl.cam && canvas._cam) lvl.cam = { ...canvas._cam };   // remember where it started
  });

  const world = (ev) => {
    const r = canvas.getBoundingClientRect(), cam = canvas._cam;
    if (!cam) return null;
    return { x: (ev.clientX - r.left - cam.x) / cam.z, y: (ev.clientY - r.top - cam.y) / cam.z };
  };
  const at = (ev) => {
    const w = world(ev);
    if (!w) return null;
    for (let i = lvl.def.nodes.length - 1; i >= 0; i--) {
      const n = lvl.def.nodes[i], g = gm(n);
      if (w.x >= g.x && w.x <= g.x + g.w && w.y >= g.y && w.y <= g.y + g.h) return n;
    }
    return null;
  };

  /* Fitting a hundred gates into one box makes them too small to read, so the
     picture can be pushed around and zoomed like the board itself. A drag that
     moves is a pan; a drag that does not is a click on whatever is under it. */
  let drag = null, panned = 0;
  canvas.onpointerdown = (ev) => {
    if (!lvl.cam) return;
    canvas.setPointerCapture(ev.pointerId);
    panned = 0;
    drag = { x: ev.clientX, y: ev.clientY, cx: lvl.cam.x, cy: lvl.cam.y, moved: 0 };
  };
  canvas.onpointermove = (ev) => {
    if (!drag) {
      const n = at(ev);
      canvas.style.cursor = n && descendable(n) ? 'zoom-in' : 'grab';
      return;
    }
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
    lvl.cam.x = drag.cx + dx; lvl.cam.y = drag.cy + dy;
    canvas.style.cursor = 'grabbing';
    draw();
  };
  /* the click comes after the pointerup, so how far it moved has to outlive it */
  const endDrag = () => { if (drag) panned = drag.moved; drag = null; canvas.style.cursor = 'grab'; };
  canvas.onpointerup = endDrag;
  canvas.onpointercancel = endDrag;
  canvas.addEventListener('wheel', (ev) => {
    if (!lvl.cam) return;
    ev.preventDefault();
    const w = world(ev);
    if (!w) return;
    const z = clamp(lvl.cam.z * Math.exp(-ev.deltaY * 0.0015), 0.05, 3);
    const r = canvas.getBoundingClientRect();
    lvl.cam = { z, x: ev.clientX - r.left - w.x * z, y: ev.clientY - r.top - w.y * z };
    draw();
  }, { passive: false });

  canvas.onclick = (ev) => {
    if (panned > 4) { panned = 0; return; }             // that was a pan, not a click
    const n = at(ev);
    if (!n || !descendable(n)) return;
    const rec = RECIPES[n.type];
    diagTrail.push({
      title: portsOf(n).label, text: rec.text, make: rec.make,
      button: 'Build it on the board', type: n.type,
    });
    renderDiagram();
  };
}

/** Render a def into a canvas by lending the drawing code our state.
 *
 * `opts.cam` draws from that camera instead of fitting the whole thing in —
 * that is what lets the big diagram be scrolled and zoomed. `opts.cache` is an
 * object to hang the compiled netlist and settled simulator on, so panning a
 * thousand-gate picture does not re-settle it on every frame. */
function drawDefInto(canvas, def, maxZoom, markDeeper, opts) {
  const { cam: given, cache } = opts || {};
  const r = canvas.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);

  const keep = {
    ctx, work: S.work, compiled: S.compiled, sim: S.sim, sel: S.sel,
    selWires: S.selWires, hover: S.hover, cam: S.cam, armed: S.armed,
  };
  try {
    ctx = canvas.getContext('2d');
    S.work = def;
    S.sel = new Set(); S.selWires = new Set(); S.hover = null; S.armed = null;
    if (cache && cache._compiled && cache._sim) {
      S.compiled = cache._compiled; S.sim = cache._sim;
    } else {
      S.compiled = compile(def);
      S.sim = new Sim(S.compiled);
      S.sim.settle(120, 0);
      if (cache) { cache._compiled = S.compiled; cache._sim = S.sim; }
    }

    const b = contentBounds();
    if (!b) return;
    const pad = 16;
    const fit = clamp(Math.min((r.width - pad * 2) / Math.max(1, b.x1 - b.x0),
      (r.height - pad * 2) / Math.max(1, b.y1 - b.y0)), 0.08, maxZoom || 0.9);
    const z = given ? given.z : fit;
    S.cam = given ? { x: given.x, y: given.y, z }
      : { x: r.width / 2 - ((b.x0 + b.x1) / 2) * z, y: r.height / 2 - ((b.y0 + b.y1) / 2) * z, z };

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, r.width, r.height);
    ctx.save();
    ctx.translate(S.cam.x, S.cam.y); ctx.scale(z, z);
    drawWorld();
    /* a chevron on anything you can open up further */
    if (markDeeper) {
      for (const n of def.nodes) {
        if (!descendable(n)) continue;
        const g = gm(n);
        /* a gate symbol has nothing in its bottom-right corner to hang this on,
           so it moves to where the shape actually is */
        const inset = GATE_SHAPE[n.type] ? g.w * 0.32 : 7 / z;
        const x = g.x + g.w - inset, y = g.y + g.h - 6 / z, k = 4 / z;
        ctx.strokeStyle = C.sel; ctx.lineWidth = 2 / z; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x - k, y - k * 0.6); ctx.lineTo(x, y + k * 0.5); ctx.lineTo(x + k, y - k * 0.6);
        ctx.stroke();
      }
    }
    ctx.restore();
    canvas._cam = { x: S.cam.x, y: S.cam.y, z };
  } finally {
    ctx = keep.ctx; S.work = keep.work; S.compiled = keep.compiled; S.sim = keep.sim;
    S.sel = keep.sel; S.selWires = keep.selWires; S.hover = keep.hover;
    S.cam = keep.cam; S.armed = keep.armed;
  }
}

/** Drop a copy of a def onto the board, below whatever is already there. */
function insertDef(def) {
  pushUndo();
  const b = contentBounds();
  const ox = b ? b.x0 : 60, oy = b ? b.y1 + 70 : 60;
  const map = new Map(), added = [];
  for (const n of def.nodes) {
    const c = clone(n);
    c.id = uid(); c.x = snap(c.x + ox); c.y = snap(c.y + oy);
    map.set(n.id, c.id); added.push(c);
  }
  S.work.nodes.push(...added);
  for (const w of def.wires) {
    if (!map.has(w.a.n) || !map.has(w.b.n)) continue;
    S.work.wires.push({
      id: uid(),
      a: { n: map.get(w.a.n), s: w.a.s, i: w.a.i },
      b: { n: map.get(w.b.n), s: w.b.s, i: w.b.i },
    });
  }
  select(added.map((n) => n.id));
  const nb = contentBoundsOf(added);
  if (nb) {
    S.cam.x = VW / 2 - ((nb.x0 + nb.x1) / 2) * S.cam.z;
    S.cam.y = VH / 2 - ((nb.y0 + nb.y1) / 2) * S.cam.z;
  }
  toast('Added below your circuit — take it apart and see.');
}

/** The box a set of parts occupies — including the names printed beside the
    input and output pins, which sit outside the part itself and would
    otherwise be sliced off whenever the view is fitted. */
function contentBoundsOf(nodes) {
  if (!nodes.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    const g = gm(n);
    let lx = g.x, rx = g.x + g.w;
    if (n.label && (n.type === 'IN' || n.type === 'OUT')) {
      const w = textWidth(ctx, n.label, '11px ' + FONT) + 12;
      if (n.type === 'IN') lx -= w; else rx += w;
    }
    x0 = Math.min(x0, lx); y0 = Math.min(y0, g.y);
    x1 = Math.max(x1, rx); y1 = Math.max(y1, g.y + g.h);
  }
  return { x0, y0, x1, y1 };
}

/* ---- what is stored in a memory ------------------------------------------
   Typing a list of numbers into a box is, at bottom, what writing a program
   is. The grid below shows every address at once and lights up the one being
   read, so you can watch a program being walked through. */

function memoryEditor(node) {
  const size = 1 << (node.abits || 4);
  const nd = node.dbits || 8;
  const digits = Math.ceil(nd / 4);
  if (!node.data) node.data = [];
  const hex = (v) => ((v | 0) & ((1 << nd) - 1)).toString(16).toUpperCase().padStart(digits, '0');

  const sec = h('div', { class: 'madeof' }, h('h4', {}, 'What is stored in it'));

  sec.append(h('div', { class: 'row' },
    h('label', {}, 'Address bits'),
    h('span', { class: 'ctl' }, h('input', {
      type: 'number', min: '1', max: '8', value: String(node.abits || 4),
      onchange: (e) => {
        pushUndo();
        node.abits = clamp(parseInt(e.target.value, 10) || 4, 1, 8);
        S.work.wires = S.work.wires.filter((w) => !(w.b.n === node.id && w.b.i >= portsOf(node).ins.length));
        markDirty(); renderInspector();
      },
    }))));
  sec.append(h('div', { class: 'row' },
    h('label', {}, 'Bits per word'),
    h('span', { class: 'ctl' }, h('input', {
      type: 'number', min: '1', max: '16', value: String(nd),
      onchange: (e) => {
        pushUndo();
        node.dbits = clamp(parseInt(e.target.value, 10) || 8, 1, 16);
        markDirty(); renderInspector();
      },
    }))));

  /* the live grid */
  const grid = h('div', { class: 'memgrid' });
  const cells = [];
  for (let i = 0; i < size; i++) {
    const cell = h('span', { class: 'memcell', title: 'address ' + i }, hex(node.data[i]));
    cells.push(cell);
    grid.append(cell);
  }
  sec.append(grid);
  // repaint the highlight as the circuit runs, without rebuilding the panel
  const tick = () => {
    if (!grid.isConnected) return;
    const prim = S.compiled && S.compiled.prims.find((p) => p.node === node);
    const at = prim && prim.st ? prim.st.addr : -1;
    for (let i = 0; i < cells.length; i++) {
      const want = hex(node.data[i]);
      if (cells[i].textContent !== want) cells[i].textContent = want;
      cells[i].classList.toggle('now', i === at);
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  const box = h('textarea', {
    class: 'memtext', spellcheck: 'false', rows: '4',
    placeholder: 'One value per space or line, in hex — e.g.  01 02 04 08',
  });
  box.value = Array.from({ length: size }, (_, i) => hex(node.data[i])).join(' ');
  sec.append(h('p', { class: 'muted', style: 'margin:8px 0 4px;font-size:12px' },
    node.type === 'ROM'
      ? 'Type the contents here, in hex, and press Load. That is the program.'
      : 'Type starting contents here and press Load. The circuit writes over them as it runs.'));
  sec.append(box);
  sec.append(h('div', { class: 'stack', style: 'margin-top:6px' },
    h('button', {
      class: 'btn', onclick: () => {
        pushUndo();
        const vals = box.value.trim().split(/[\s,]+/).filter(Boolean)
          .map((t) => parseInt(t, 16) || 0);
        node.data = Array.from({ length: size }, (_, i) => vals[i] | 0);
        markDirty(); renderInspector();
        toast('Loaded ' + size + ' words.');
      },
    }, 'Load into memory'),
    h('button', {
      class: 'btn danger', onclick: () => {
        pushUndo(); node.data = []; markDirty(); renderInspector();
      },
    }, 'Wipe it')));

  /* A ROM is where a program lives, so it can be written in assembly as well
     as in hex: this turns text into the words the two processors in the chip
     library read. */
  if (node.type === 'ROM') {
    const isa = h('select', {}, h('option', { value: '4' }, 'TINY-4 (8-bit words)'), h('option', { value: '8' }, 'TINY-8 (16-bit words)'));
    const src = h('textarea', { class: 'memtext', spellcheck: 'false', rows: '8', placeholder: 'LDI 0\nloop: OUT\n      ADDI 1\n      JMP loop' });
    const sample = h('select', {
      onchange: (e) => {
        const p = PROGRAMS[e.target.value];
        if (p) { src.value = p[1].trim(); isa.value = /8$/.test(e.target.value) ? '8' : '4'; }
        e.target.value = '';
      },
    }, h('option', { value: '' }, 'Load a sample program…'), ...Object.keys(PROGRAMS).map((k) => h('option', { value: k }, PROGRAMS[k][0])));
    sec.append(h('h4', { style: 'margin-top:14px' }, 'Or write a program'));
    sec.append(h('p', { class: 'muted', style: 'margin:0 0 6px;font-size:12px' },
      'For the TINY processors in the chip library. TINY-4: LDI LDA STA ADD SUB AND OR XOR JMP JZ JNZ ADDI OUT JC HLT, each with one number or label. TINY-8: LDI r,n · MOV r,r · ADD SUB AND OR XOR CMP r,r · ADDI r,n · LD r,[a] · ST r,[a] · JMP JZ JNZ label · OUT r · HLT, with registers r0–r3. Labels end in a colon; ; starts a comment.'));
    sec.append(h('div', { class: 'row' }, h('label', {}, 'Processor'), h('span', { class: 'ctl' }, isa)));
    sec.append(h('div', { class: 'row' }, h('label', {}, 'Examples'), h('span', { class: 'ctl' }, sample)));
    sec.append(src);
    sec.append(h('div', { class: 'stack', style: 'margin-top:6px' }, h('button', {
      class: 'btn primary', onclick: () => {
        try {
          const words = (isa.value === '8' ? assemble8 : assemble4)(src.value);
          if (words.length > size) throw new Error(`That is ${words.length} instructions and this ROM holds ${size}. Give it more address bits.`);
          pushUndo();
          node.dbits = isa.value === '8' ? 16 : 8;
          node.data = words;
          markDirty(); renderInspector();
          toast(`Assembled ${words.length} instructions into the ROM.`);
        } catch (err) { toast(err.message, true); }
      },
    }, 'Assemble into this ROM')));
  }
  return sec;
}

/* ---- truth table -------------------------------------------------------- */

function computeTruthTable(def) {
  const d = clone(def);
  const io = ioOrder(d);
  if (!io.ins.length) return { error: 'This circuit has no input pins.' };
  if (!io.outs.length) return { error: 'This circuit has no output pins.' };
  if (io.ins.length > 12) return { error: `${io.ins.length} inputs would need ${2 ** io.ins.length} rows.` };
  const compiled = compile(d);
  const rows = [];
  let unstable = false;
  const total = 1 << io.ins.length;
  for (let m = 0; m < total; m++) {
    io.ins.forEach((p, i) => { p.value = (m >> (io.ins.length - 1 - i)) & 1; });
    const sim = new Sim(compiled);
    const stable = sim.settle(300, 0);
    if (!stable) unstable = true;
    rows.push({
      in: io.ins.map((p) => p.value),
      out: io.outs.map((p) => sim.val(compiled.portNet.get(p.id + '.i0'))),
    });
  }
  return {
    ins: io.ins.map((p, i) => p.label || 'in' + i),
    outs: io.outs.map((p, i) => p.label || 'out' + i),
    rows, unstable,
  };
}

function showTruthTable() {
  S.ttable = computeTruthTable(S.work);
  renderInspector();
  $('#app').classList.add('insp-open');
}

function truthTableSection() {
  const t = S.ttable;
  const sec = h('div', { class: 'insp-sec' },
    h('h3', {}, 'Truth table'),
    h('button', {
      class: 'btn', style: 'float:right;margin-top:-30px',
      onclick: () => { S.ttable = null; renderInspector(); },
    }, '✕'));
  if (t.error) { sec.append(h('p', { class: 'muted' }, t.error)); return sec; }
  if (t.unstable) {
    sec.append(h('p', { class: 'muted' },
      'Some rows never settled — this circuit has memory or oscillates, so the table shows where it happened to be.'));
  }
  const head = h('tr', {},
    ...t.ins.map((n) => h('th', {}, n)),
    ...t.outs.map((n, i) => h('th', { class: i === 0 ? 'sep' : '' }, n)));
  const body = t.rows.map((r) => h('tr', {},
    ...r.in.map((v) => h('td', { class: v ? 'one' : 'zero' }, String(v))),
    ...r.out.map((v, i) => h('td', { class: (v ? 'one' : 'zero') + (i === 0 ? ' sep' : '') }, String(v)))));
  sec.append(h('div', { class: 'tt-wrap' }, h('table', { class: 'ttable' }, h('thead', {}, head), h('tbody', {}, ...body))));
  return sec;
}

/* ---- modals ------------------------------------------------------------- */

/* `grow` adds a button that stretches the sheet to fill the window. The
   diagrams want it: a page embedded in a chat panel may not be allowed real
   fullscreen, but it can always use every pixel it does have. The choice is
   remembered, because someone who wants one big diagram wants the next one
   big too. */
let modalBig = false;

function openModal(title, bodyEl, footEl, wide, grow) {
  const sheet = $('#modal-sheet');
  const apply = () => { sheet.classList.toggle('huge', grow && modalBig); };
  sheet.className = 'sheet' + (wide ? ' wide' : '');
  sheet.innerHTML = '';
  sheet.append(
    h('header', {}, h('h2', {}, title), h('span', { class: 'grow' }),
      grow ? h('button', {
        class: 'btn icon', id: 'modal-grow',
        title: 'Use the whole window',
        onclick: () => { modalBig = !modalBig; apply(); if (grow.onResize) grow.onResize(); },
      }, '⤢') : null,
      h('button', { class: 'btn icon', id: 'modal-close', onclick: closeModal }, '✕')),
    h('div', { class: 'body' }, bodyEl));
  if (footEl) sheet.append(h('footer', {}, footEl));
  apply();
  $('#modal').classList.add('open');
}
let modalOnClose = null;
function closeModal() {
  $('#modal').classList.remove('open');
  const f = modalOnClose;
  modalOnClose = null;
  if (f) f();
}
$('#modal').addEventListener('click', (e) => { if (e.target.dataset.close) closeModal(); });

/** Ask before doing something destructive.

    This used to be window.confirm, which is fine on its own site but is
    silently ignored when the page is embedded in a sandboxed frame — the
    button simply did nothing. Asking in the page works everywhere, and looks
    like the rest of the app besides. */
function ask(question, detail, confirmLabel) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (done) return; done = true; closeModal(); resolve(v); };
    openModal(question,
      h('p', { class: 'muted', style: 'margin:0' }, detail || ''),
      h('div', {},
        h('button', { class: 'btn', onclick: () => finish(false) }, 'Cancel'),
        h('button', {
          class: 'btn wreck', style: 'margin-left:8px', onclick: () => finish(true),
        }, confirmLabel || 'Yes, do it')));
    modalOnClose = () => finish(false);          // the ✕ and the backdrop mean "no"
  });
}

/* ---- packaging a circuit into a chip ------------------------------------ */

function openMakeChip() {
  const io = ioOrder(S.work);
  if (!S.work.nodes.length) { toast('There is nothing on the board yet.', true); return; }
  if (!io.outs.length) { toast('Add at least one output pin first.', true); return; }

  const editing = S.editing ? LIB[S.editing] : null;
  const nameIn = h('input', { type: 'text', value: editing ? editing.name : S.work.name, spellcheck: 'false' });
  let color = editing ? editing.color : CHIP_COLORS[Object.keys(LIB).length % CHIP_COLORS.length];
  const sw = h('div', { class: 'swatches' });
  const paint = () => $$('.swatch', sw).forEach((b, i) => b.classList.toggle('on', CHIP_COLORS[i] === color));
  CHIP_COLORS.forEach((c) => sw.append(h('button', {
    class: 'swatch', style: `background:${c}`, onclick: () => { color = c; paint(); },
  })));
  setTimeout(paint);

  const pins = h('div', { class: 'pinlist' },
    ...io.ins.map((p, i) => h('div', {}, h('span', { class: 'n' }, `in ${i + 1}`), h('span', {}, p.label || '—'))),
    ...io.outs.map((p, i) => h('div', {}, h('span', { class: 'n' }, `out ${i + 1}`), h('span', {}, p.label || '—'))));

  const body = h('div', {},
    h('p', { class: 'muted' }, editing
      ? 'Saving updates every copy of this chip already placed in other circuits.'
      : 'The circuit becomes a single part in your palette. Its input and output pins become the chip’s ports, ordered top to bottom.'),
    h('div', { class: 'row' }, h('label', {}, 'Name'), h('span', { class: 'ctl' }, nameIn)),
    h('div', { class: 'row' }, h('label', {}, 'Colour'), h('span', { class: 'ctl' }, sw)),
    h('h4', { style: 'margin:14px 0 6px;font-size:12px' }, 'Ports'), pins);

  const go = () => {
    const name = nameIn.value.trim();
    if (!name) { toast('Give the chip a name.', true); return; }
    if (editing) {
      const keep = LIB[S.editing];
      const upd = clone(S.work);
      upd.id = keep.id; upd.name = name; upd.color = color;
      LIB[keep.id] = upd;
      closeModal(); leaveChipEdit(true);
      toast(`Saved “${name}”.`);
    } else {
      const def = clone(S.work);
      def.id = uid(); def.name = name; def.color = color;
      LIB[def.id] = def;
      S.work = newDef('Untitled');
      S.undo.length = 0; S.redo.length = 0;
      S.sel.clear(); S.selWires.clear();
      closeModal();
      markDirty(); renderPalette(); renderInspector(); renderCrumbs(); syncUndoButtons();
      toast(`“${name}” is in your palette. The board is clear for the next one.`);
    }
  };
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  openModal(editing ? 'Save chip' : 'Package as a chip',
    body, h('div', {}, h('button', { class: 'btn', onclick: closeModal }, 'Cancel'),
      h('button', { class: 'btn primary', onclick: go, style: 'margin-left:8px' },
        editing ? 'Save changes' : 'Create chip')));
  setTimeout(() => nameIn.focus(), 30);
}

function openChip(id) {
  const def = LIB[id];
  if (!def) return;
  if (S.editing === id) return;
  if (S.editing) { toast('Finish editing the current chip first.', true); return; }
  S.stash = { work: S.work, undo: S.undo, redo: S.redo, cam: { ...S.cam } };
  S.work = clone(def);
  S.editing = id;
  S.undo = []; S.redo = [];
  S.sel.clear(); S.selWires.clear();
  closeModal();
  markDirty(); renderCrumbs(); renderInspector(); syncUndoButtons();
  fitView();
  toast(`Editing “${def.name}”. Save when you are done.`);
}

function leaveChipEdit(saved) {
  if (!S.editing) return;
  S.editing = null;
  if (S.stash) {
    S.work = S.stash.work; S.undo = S.stash.undo; S.redo = S.stash.redo;
    Object.assign(S.cam, S.stash.cam);
    S.stash = null;
  }
  S.sel.clear(); S.selWires.clear();
  markDirty(); renderCrumbs(); renderPalette(); renderInspector(); syncUndoButtons();
  if (!saved) toast('Left the chip unchanged.');
}

function openLibrary() {
  const body = h('div', {});
  body.append(h('div', { class: 'stack', style: 'margin-bottom:12px' },
    h('button', { class: 'btn primary', onclick: () => { closeModal(); openLibraryBrowser(); } }, 'Bigger view of the chip library…')));
  const chips = Object.values(LIB).sort((a, b) => a.name.localeCompare(b.name));
  if (!chips.length) {
    body.append(h('p', { class: 'muted' },
      'No chips yet. Build something on the board, give it input and output pins, then press “Package as a chip”.'));
  }
  for (const d of chips) {
    const io = ioOrder(d);
    const used = usersOf(d.id);
    body.append(h('div', { class: 'chiprow' },
      h('span', { class: 'sw', style: `background:${d.color}` }),
      h('span', { class: 'nm' }, d.name),
      h('span', { class: 'meta' }, `${d.lib ? d.lib.cat + ' · ' : ''}${io.ins.length}→${io.outs.length}${used.length ? ' · used ×' + used.length : ''}`),
      h('button', { class: 'btn', onclick: () => { closeModal(); armPart({ type: 'CHIP', chip: d.id }); } }, 'Place'),
      h('button', { class: 'btn', onclick: () => openChip(d.id) }, 'Edit'),
      h('button', {
        class: 'btn danger', onclick: () => {
          if (S.editing === d.id) { toast('That is the chip you are editing. Finish first.', true); return; }
          const u = usersOf(d.id);
          if (u.length) { toast(`“${d.name}” is inside ${u.join(', ')}. Remove those copies first.`, true); return; }
          delete LIB[d.id];
          markDirty(); renderPalette(); openLibrary();
        },
      }, 'Delete')));
  }
  openModal('My chips', body, h('button', { class: 'btn', onclick: closeModal }, 'Done'), true);
}

/** Which circuits contain this chip (so deleting cannot orphan anything). */
function usersOf(id) {
  const out = [];
  const scan = (def, label) => { if (def.nodes.some((n) => n.type === 'CHIP' && n.chip === id)) out.push(label); };
  scan(S.work, 'the board');
  for (const d of Object.values(LIB)) if (d.id !== id) scan(d, `“${d.name}”`);
  return out;
}

async function clearBoard() {
  if (!S.work.nodes.length) return;
  if (!await ask('Clear the board?', 'Everything on it goes. Your saved chips are not affected, and Ctrl+Z brings it back.', 'Clear it')) return;
  pushUndo();
  S.work.nodes = []; S.work.wires = [];
  S.sel.clear(); S.selWires.clear();
  renderInspector();
}

function renderCrumbs() {
  const c = $('#crumbs');
  c.innerHTML = '';
  if (S.editing && LIB[S.editing]) {
    c.append(h('span', {}, 'Editing chip '), h('span', { class: 'chipname' }, LIB[S.editing].name),
      h('span', {}, ' · '),
      h('button', { onclick: openMakeChip }, 'save'), h('span', {}, ' / '),
      h('button', { onclick: () => leaveChipEdit(false) }, 'discard'));
  } else {
    /* It used to show the bare name, which told you nothing about what it was.
       Now it says what it is and invites you to change it. */
    const named = (S.work.name || '').trim() && S.work.name !== 'Untitled';
    c.append(h('span', {}, 'Circuit: '));
    c.append(h('button', {
      class: 'crumb-name', title: 'Rename this circuit',
      onclick: renameCircuit,
    }, named ? S.work.name : 'Untitled — click to name it', h('span', { class: 'pen' }, ' ✎')));
  }
}

function renameCircuit() {
  const input = h('input', { type: 'text', value: S.work.name || '', spellcheck: 'false' });
  const go = () => {
    S.work.name = input.value.trim() || 'Untitled';
    closeModal(); renderCrumbs(); renderInspector(); scheduleSave();
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  openModal('Name this circuit',
    h('div', {},
      h('p', { class: 'muted', style: 'margin:0 0 10px' },
        'Just a label for what you are building, so you can tell one from another. '
        + 'It becomes the chip’s name if you package this circuit up.'),
      h('div', { class: 'row' }, h('label', {}, 'Name'), h('span', { class: 'ctl' }, input))),
    h('div', {},
      h('button', { class: 'btn', onclick: closeModal }, 'Cancel'),
      h('button', { class: 'btn primary', style: 'margin-left:8px', onclick: go }, 'Rename')));
  setTimeout(() => { input.focus(); input.select(); }, 30);
}

/* ==========================================================================
   10 · SAVING — localStorage, plus JSON in and out
   ========================================================================== */

const KEY = 'coriantumr.gates.v1';
/* Before Logic Lab was split into two apps, the circuit was saved in the same
   file as the breadboards; a first visit picks it up from there. */
const LEGACY_KEY = 'coriantumr.logiclab.v1';
let saveT = 0;
function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(saveNow, 500); }
/* Keys beginning with "_" are scratch fields the compiler hangs off parts
   (resolved nets, whether an LED is lit). They never belong in a save file. */
const noScratch = (k, v) => (k.charAt(0) === '_' ? undefined : v);
const serialize = (space) => JSON.stringify(snapshot(), noScratch, space);

function saveNow() {
  try {
    localStorage.setItem(KEY, serialize());
  } catch (e) { /* private mode, quota — the app still runs, just without memory */ }
}
function snapshot() {
  return {
    v: 1, lib: LIB, work: S.work, editing: S.editing,
    stash: S.stash ? { work: S.stash.work } : null,
    prefs: { theme: document.documentElement.dataset.theme || '', speed: S.speedIx, play: S.play },
  };
}
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(KEY) || localStorage.getItem(LEGACY_KEY); } catch (e) { raw = null; }
  if (!raw) return false;
  try { applySnapshot(JSON.parse(raw)); return true; } catch (e) { return false; }
}
function applySnapshot(d) {
  if (!d || typeof d !== 'object') throw new Error('not a Logic Gates file');
  LIB = d.lib && typeof d.lib === 'object' ? d.lib : {};
  S.work = d.work && d.work.nodes ? d.work : newDef('Untitled');
  S.editing = d.editing && LIB[d.editing] ? d.editing : null;
  S.stash = d.stash && d.stash.work ? { work: d.stash.work, undo: [], redo: [], cam: { x: 0, y: 0, z: 1 } } : null;
  if (S.editing && !S.stash) S.stash = { work: newDef('Untitled'), undo: [], redo: [], cam: { x: 0, y: 0, z: 1 } };
  if (d.prefs) {
    if (d.prefs.theme) document.documentElement.dataset.theme = d.prefs.theme;
    if (typeof d.prefs.speed === 'number') S.speedIx = clamp(d.prefs.speed, 0, SPEEDS.length - 1);
    S.play = !!d.prefs.play;
  }
  S.undo = []; S.redo = [];
  S.dirty = true;
}

function exportJSON() {
  const blob = new Blob([serialize(1)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'logic-gates.json' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

$('#file-input').addEventListener('change', (ev) => {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      applySnapshot(JSON.parse(r.result));
      closeModal();
      renderPalette(); renderInspector(); renderCrumbs(); syncUndoButtons();
      fitView();
      toast('Loaded.');
    } catch (e) { toast('That file did not look like a Logic Gates export.', true); }
  };
  r.readAsText(f);
  ev.target.value = '';
});

/** The phone overflow sheet: everything the narrow top bar cannot show.
    Packaging a chip and the truth table live in the inspector drawer already. */
function openMoreMenu() {

/* Fullscreen. Worth having because this page is often looked at inside
   something else — an embed, a chat panel, a narrow window — and a hundred
   gates need the room. A frame that was not given permission refuses the
   request, so say what to do instead rather than failing silently. */
function fullscreenOn() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function toggleFullscreen() {
  const el = document.documentElement;
  if (fullscreenOn()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    return;
  }
  const go = el.requestFullscreen || el.webkitRequestFullscreen;
  const nope = () => toast(
    'The page this is embedded in will not allow fullscreen. Open it in its own '
    + 'browser tab, then press F11 (⌃⌘F on a Mac).', true);
  if (!go) { nope(); return; }
  try {
    const p = go.call(el);
    if (p && p.catch) p.catch(nope);
  } catch (e) { nope(); }
}

function syncFullscreenButton() {
  const b = $('#btn-full');
  if (!b) return;
  const on = fullscreenOn();
  b.classList.toggle('on', on);
  b.title = on ? 'Leave fullscreen (Shift+F)' : 'Fullscreen (Shift+F)';

function cycleTheme() {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : cur === 'light' ? '' : 'dark';
  if (next) document.documentElement.dataset.theme = next;
  else delete document.documentElement.dataset.theme;
  readColors(); scheduleSave();
  toast(next ? `${next} theme` : 'following the system theme');

/* ==========================================================================
   15 · EXAMPLES

   Built in code rather than pasted in as JSON, so the wiring is readable and
   stays honest if a part ever changes shape.
   ========================================================================== */

function builder(name, color) {
  const d = newDef(name);
  d.color = color || CHIP_COLORS[0];
  const api = {
    def: d,
    /* Coordinates go on the grid on the way in. Everything you place by hand
       already lands there, and a part half a square off is a part whose ports
       miss the wire lanes — so a few examples written with a stray 75 or 124
       in them were the only things on the board that could not line up. */
    add: (type, x, y, extra) => {
      const n = makeNode(type, snap(x), snap(y), extra);
      d.nodes.push(n);
      return n;
    },
    pin: (label, x, y) => api.add('IN', x, y, { label }),
    out: (label, x, y) => api.add('OUT', x, y, { label }),
    w: (a, ai, b, bi) => {
      d.wires.push({ id: uid(), a: { n: a.id, s: 'out', i: ai }, b: { n: b.id, s: 'in', i: bi } });
    },
  };
  return api;
}

  const b = builder('4-bit counter', CHIP_COLORS[7]);
  const clk = b.add('CLOCK', 60, 200, { hz: 3 });
  const ff = [0, 1, 2, 3].map((i) => b.add('DFF', 190 + i * 150, 100));
  const hex = b.add('HEX', 820, 60);
  ff.forEach((f, i) => {
    b.w(f, 1, f, 0);                                    // Q̄ back to D — a toggle
    if (i === 0) b.w(clk, 0, f, 1); else b.w(ff[i - 1], 1, f, 1);
    b.w(f, 0, hex, 3 - i);                              // Q0 is the ones column
  });
  const o = [0, 1, 2, 3].map((i) => b.out('Q' + i, 700, 260 + i * 60));
  ff.forEach((f, i) => b.w(f, 0, o[i], 0));

function exAdder4() {
  const half = exHalfAdder(), full = exFullAdder();
  const b = builder('4-bit adder', CHIP_COLORS[0]);
  const zero = b.add('CONST', 60, 560, { value: 0 });
  const fa = [0, 1, 2, 3].map((i) => b.add('CHIP', 330, 40 + i * 130, { chip: full.id }));
  const A = [], B = [];
  for (let i = 0; i < 4; i++) {
    A.push(b.pin('A' + i, 60, 30 + i * 130));
    B.push(b.pin('B' + i, 60, 75 + i * 130));
    b.w(A[i], 0, fa[i], 0); b.w(B[i], 0, fa[i], 1);
  }
  b.w(zero, 0, fa[0], 2);
  for (let i = 1; i < 4; i++) b.w(fa[i - 1], 1, fa[i], 2);
  const hex = b.add('HEX', 700, 180);
  const S = [0, 1, 2, 3].map((i) => b.out('S' + i, 560, 40 + i * 130));
  for (let i = 0; i < 4; i++) { b.w(fa[i], 0, S[i], 0); b.w(fa[i], 0, hex, 3 - i); }
  const co = b.out('Cout', 560, 560);
  b.w(fa[3], 1, co, 0);
  return { work: b.def, chips: [half, full] };
}

/* A whole memory, generated at whatever size you ask for. Three regions, and
   every memory chip ever made is these three: a decoder turning the address
   into one live line, a grid of one-bit cells, and an OR per bit collecting
   the column — safe to join because unselected cells sit at 0. */
/** Exactly how many parts an array of this size comes to, without building it. */
function ramArraySize(abits, dbits) {
  abits = clamp(abits | 0, 1, 8); dbits = clamp(dbits | 0, 1, 16);
  const words = 1 << abits;
  const decode = abits + (abits === 1 ? 0 : words);      // inverters + one AND per word
  const cells = words * dbits * 2;                        // a flip-flop and a read gate each
  const collect = (words - 1) * dbits;                    // the OR chain down each column
  const pins = abits + dbits * 2 + 2;
  return decode + words + cells + collect + pins;
}

function ramArray(abits, dbits, name) {
  abits = clamp(abits | 0, 1, 8);
  dbits = clamp(dbits | 0, 1, 16);
  const words = 1 << abits;
  const b = builder(name || `RAM · ${words} × ${dbits}`, CHIP_COLORS[3]);
  const ROW = 130, CELL_W = 260;

  const addr = [];
  for (let i = 0; i < abits; i++) addr.push(b.pin('A' + i, 0, i * 90));
  const din = [];
  for (let i = 0; i < dbits; i++) din.push(b.pin('D' + i, 0, (abits + 1 + i) * 90));
  const wr = b.pin('WRITE', 0, (abits + dbits + 2) * 90);
  const ck = b.pin('CLK', 0, (abits + dbits + 3) * 90);

  /* address decoder */
  const inv = addr.map((a, i) => { const n = b.add('NOT', 170, i * 90); b.w(a, 0, n, 0); return n; });
  const sel = [];
  for (let w = 0; w < words; w++) {
    if (abits === 1) { sel.push(w & 1 ? addr[0] : inv[0]); continue; }
    const g = b.add('AND', 340, w * ROW, { n: abits });
    for (let i = 0; i < abits; i++) b.w((w >> i) & 1 ? addr[i] : inv[i], 0, g, i);
    sel.push(g);
  }

  /* one write gate per word, then the grid of cells */
  const readOf = [];
  for (let w = 0; w < words; w++) {
    const we = b.add('AND', 540, w * ROW + 20, { n: 3 });
    b.w(sel[w], 0, we, 0); b.w(wr, 0, we, 1); b.w(ck, 0, we, 2);
    for (let d = 0; d < dbits; d++) {
      const x = 740 + d * CELL_W;
      const ff = b.add('DFF', x, w * ROW);
      b.w(din[d], 0, ff, 0); b.w(we, 0, ff, 1);
      const rd = b.add('AND', x + 130, w * ROW + 10);
      b.w(ff, 0, rd, 0); b.w(sel[w], 0, rd, 1);
      (readOf[d] || (readOf[d] = [])).push(rd);
    }
  }

  /* collect each column */
  const outX = 740 + dbits * CELL_W + 60;
  for (let d = 0; d < dbits; d++) {
    let acc = readOf[d][0];
    for (let w = 1; w < words; w++) {
      const o = b.add('OR', outX + w * 90, d * ROW * 2);
      b.w(acc, 0, o, 0); b.w(readOf[d][w], 0, o, 1);
      acc = o;
    }
    const q = b.out('Q' + d, outX + words * 90 + 120, d * ROW * 2 + 16);
    b.w(acc, 0, q, 0);
  }
  return b.def;
}

/* The decoder a hex digit needs: four bits in, seven bars out. Built straight
   from SEG_BITS, the same table the display itself draws from, so the picture
   cannot drift away from the thing it explains.

   It is the plainest way there is — one AND per number, wired so it is on for
   exactly that number and nothing else, then each bar is an OR of the numbers
   it appears in. Sixteen ANDs shared between all seven bars, which is why this
   comes to about thirty gates and not two hundred. A real 7447 does the same
   job with fewer, by spotting patterns; this one is meant to be read. */
function recSevenSeg() {
  const b = builder('Working out which bars to light', CHIP_COLORS[4]);
  const BARS = ['a', 'b', 'c', 'd', 'e', 'f', 'g'];
  const pin = ['8', '4', '2', '1'].map((nm, i) => b.pin(nm, 0, i * 90));
  const inv = pin.map((p, i) => { const g = b.add('NOT', 170, i * 90); b.w(p, 0, g, 0); return g; });

  /* one AND per number, on for that number alone */
  const forNumber = [];
  for (let n = 0; n < 16; n++) {
    const g = b.add('AND', 360, n * 74, { n: 4 });
    for (let k = 0; k < 4; k++) b.w(((n >> (3 - k)) & 1) ? pin[k] : inv[k], 0, g, k);
    forNumber.push(g);
  }

  /* each bar is an OR of every number it appears in — in trees of eight,
     because a gate here takes at most eight inputs */
  BARS.forEach((nm, s) => {
    let level = [];
    for (let n = 0; n < 16; n++) if ((SEG_BITS[n] >> s) & 1) level.push(forNumber[n]);
    let col = 0;
    while (level.length > 1) {
      const next = [];
      for (let i = 0; i < level.length; i += 8) {
        const chunk = level.slice(i, i + 8);
        if (chunk.length === 1) { next.push(chunk[0]); continue; }
        const g = b.add('OR', 640 + col * 190, s * 190 + next.length * 84, { n: chunk.length });
        chunk.forEach((c, k) => b.w(c, 0, g, k));
        next.push(g);
      }
      level = next; col++;
    }
    const o = b.out(nm, 640 + (col + 1) * 190, s * 190 + 8);
    if (level[0]) b.w(level[0], 0, o, 0);
  });
  return b.def;
}

function recRAMCell() {
  const b = builder('One bit of RAM');
  const d = b.pin('D', 0, 0), sel = b.pin('SELECT', 0, 120);
  const wr = b.pin('WRITE', 0, 240), ck = b.pin('CLK', 0, 360);
  const gate = b.add('AND', 200, 190, { n: 3 });       // let the edge through only if chosen
  const ff = b.add('DFF', 400, 40);
  const readOut = b.add('AND', 610, 70);               // and only speak when chosen
  const q = b.out('Q', 790, 86);
  b.w(sel, 0, gate, 0); b.w(wr, 0, gate, 1); b.w(ck, 0, gate, 2);
  b.w(d, 0, ff, 0); b.w(gate, 0, ff, 1);
  b.w(ff, 0, readOut, 0); b.w(sel, 0, readOut, 1);
  b.w(readOut, 0, q, 0);
  return b.def;
}

function recROM() {
  const WORDS = [1, 2, 3, 0];                          // what this one holds
  const b = builder('A four-word ROM');
  const a0 = b.pin('A0', 0, 60), a1 = b.pin('A1', 0, 200);
  const n0 = b.add('NOT', 170, 50), n1 = b.add('NOT', 170, 190);
  b.w(a0, 0, n0, 0); b.w(a1, 0, n1, 0);

  /* one line per address, and each one says which word it picks */
  const sel = [];
  for (let i = 0; i < 4; i++) {
    const g = b.add('AND', 360, i * 130, { n: 2 });
    b.w(i & 1 ? a0 : n0, 0, g, 0);
    b.w(i & 2 ? a1 : n1, 0, g, 1);
    sel.push(g);
    /* Every word line is taken somewhere, even the one holding 0 — it used to
       stop dead in mid-air, which read as a missing connection rather than as
       "this word is all zeros". */
    const tap = b.out(`word ${i} = ${WORDS[i]}`, 560, i * 130 + 16);
    b.w(g, 0, tap, 0);
  }

  /* And here is the data: a wire from a word's line into a bit's OR gate means
     that bit is a 1 in that word. Nothing wired in means that bit is 0. */
  const outs = [];
  for (let bit = 0; bit < 2; bit++) {
    const feeds = [];
    for (let i = 0; i < 4; i++) if ((WORDS[i] >> bit) & 1) feeds.push(sel[i]);
    const o = b.out('D' + bit, 1000, 60 + bit * 260);
    if (!feeds.length) { outs.push(o); continue; }
    if (feeds.length === 1) { b.w(feeds[0], 0, o, 0); outs.push(o); continue; }
    const g = b.add('OR', 800, 40 + bit * 260, { n: feeds.length });
    feeds.forEach((f, k) => b.w(f, 0, g, k));
    b.w(g, 0, o, 0);
    outs.push(o);
  }
  return b.def;
}

/* A program, running. A counter walks through the ROM one address at a time
   and whatever is stored there comes out — which is the whole idea a computer
   is built on, with the instruction decoding left out. */
function exStoredProgram() {
  const b = builder('Stored program', CHIP_COLORS[2]);
  const clk = b.add('CLOCK', 40, 240, { hz: 3 });
  const ff = [0, 1, 2, 3].map((i) => b.add('DFF', 170 + i * 150, 180));
  ff.forEach((f, i) => {
    b.w(f, 1, f, 0);                                   // toggle
    if (i === 0) b.w(clk, 0, f, 1); else b.w(ff[i - 1], 1, f, 1);
  });
  const rom = b.add('ROM', 800, 40, {
    abits: 4, dbits: 8,
    data: [1, 2, 4, 8, 16, 32, 64, 128, 64, 32, 16, 8, 4, 2, 1, 0],
  });
  ff.forEach((f, i) => b.w(f, 0, rom, i));             // counter drives the address
  const num = b.add('NUM', 1010, 40, { bits: 8 });
  const leds = [];
  for (let i = 0; i < 8; i++) {
    const led = b.add('LED', 1160, 30 + i * 34, { color: '#ffc247' });
    b.w(rom, i, led, 0);
    b.w(rom, i, num, i);
    leds.push(led);
  }
  const out = [0, 1, 2, 3].map((i) => b.out('addr' + i, 640, 420 + i * 60));
  ff.forEach((f, i) => b.w(f, 0, out[i], 0));
  return b.def;
}

/** Add an example's chips to the library — but if one of that name is already
    there, use it instead of stacking up another copy. Loading the same example
    twice should not leave you with two "Full adder" chips. */
function installChips(chips, work) {
  const swap = new Map();
  for (const c of chips) {
    const mine = Object.values(LIB).find((d) => d.name === c.name);
    if (mine) swap.set(c.id, mine.id);
    else LIB[c.id] = c;
  }
  if (!swap.size) return;
  const retarget = (def) => {
    for (const n of def.nodes) if (n.type === 'CHIP' && swap.has(n.chip)) n.chip = swap.get(n.chip);
  };
  chips.forEach(retarget);
  retarget(work);
}

async function loadExample(ex) {
  if (S.work.nodes.length) {
    const go = await ask(
      'Replace the circuit on the board?',
      `“${ex.name}” needs the board to itself. Your saved chips are not affected.`,
      'Replace it');
    if (!go) { openExamples(); return; }        // back to the list they came from
  }
  if (S.editing) leaveChipEdit(false);
  const r = ex.make();
  installChips(r.chips || [], r.work);
  S.work = r.work;
  S.undo = []; S.redo = []; S.sel.clear(); S.selWires.clear(); S.ttable = null;
  closeModal();
  markDirty(); renderPalette(); renderInspector(); renderCrumbs(); syncUndoButtons(); fitView();
  toast(`Loaded “${ex.name}”.`);
}

/* ==========================================================================
   15b · THE BUILT-IN CHIP LIBRARY

   A shelf of ready-made circuits, from a NOT gate made out of one NAND up to
   whole working computers. Every one of them is an ordinary chip — the same
   kind you package yourself — built out of this simulator's own parts, so any
   of them can be opened and taken apart to the gates.

   They are written as netlists ("this gate's inputs come from those"), and
   laid out automatically: signals flow left to right, and each part sits in
   a column one step further along than everything feeding it.
   ========================================================================== */

/** A netlist-style circuit builder. Signals are {n, i} — output i of node n. */
function NB(name, color) {
  const d = newDef(name);
  d.color = color || CHIP_COLORS[0];
  const nodes = [], pending = [];
  let k1 = null, k0 = null;
  const add = (type, extra) => { const n = makeNode(type, 0, 0, extra); d.nodes.push(n); nodes.push(n); return n; };
  /* Wire a signal into input `i` of node `n`. A placeholder (see ph) is not
     wired yet: the wire is remembered and made when it is bound. */
  const link = (s, n, i) => {
    if (!s) return;
    if (s.ph) {
      if (s.bound) s = s.bound;                             // already bound: wire it for real
      else { s.ph.push({ n, i }); return; }
    }
    d.wires.push({ id: uid(), a: { n: s.n.id, s: 'out', i: s.i }, b: { n: n.id, s: 'in', i } });
  };
  const outsOf = (n) => { const o = portsOf(n).outs; return o.map((_, i) => ({ n, i })); };
  const api = {
    def: d,
    in: (label) => ({ n: add('IN', { label }), i: 0 }),
    ins: (prefix, count) => Array.from({ length: count }, (_, i) => api.in(prefix + i)),
    out: (label, s) => { const n = add('OUT', { label }); link(s, n, 0); return n; },
    outs: (prefix, list) => list.forEach((s, i) => api.out(prefix + i, s)),
    one: () => k1 || (k1 = { n: add('CONST', { value: 1 }), i: 0 }),
    zero: () => k0 || (k0 = { n: add('CONST', { value: 0 }), i: 0 }),
    /** One gate (or NOT / BUFFER). Returns its single output. */
    gate: (type, ...ins) => {
      const vin = PARTS[type] && PARTS[type].vin;
      const n = add(type, vin ? { n: Math.max(2, ins.length) } : null);
      ins.forEach((s, i) => link(s, n, i));
      return { n, i: 0 };
    },
    /** Any part, given its settings; returns ALL of its outputs. */
    part: (type, extra, ...ins) => {
      const n = add(type, extra);
      ins.forEach((s, i) => link(s, n, i));
      return outsOf(n);
    },
    /** A library chip, installed on first use; returns all its outputs. */
    chip: (key, ...ins) => {
      const id = installLib(key, true);
      const n = add('CHIP', { chip: id });
      ins.forEach((s, i) => link(s, n, i));
      return outsOf(n);
    },
    /** A placeholder for a signal that is not made yet — how feedback is written. */
    ph: () => ({ ph: [] }),
    bind: (p, s) => { p.bound = s; for (const t of p.ph) link(s, t.n, t.i); p.ph.length = 0; },
    /** Print a name above a part, so a big circuit can be read. */
    tag: (s, text) => { if (s && s.n) s.n.tag = text; return s; },
    finish: () => { layoutDef(d); return d; },
  };
  return api;
}

/** Lay a circuit out left to right. A part's column is one more than the
    deepest thing feeding it (feedback wires are ignored for this), pins are
    kept in the order they were made, and inside a column parts line up with
    the middle of what feeds them. */
function layoutDef(d) {
  const nodes = d.nodes, byId = new Map(nodes.map((n) => [n.id, n]));
  const srcs = new Map(nodes.map((n) => [n.id, []]));
  for (const w of d.wires) srcs.get(w.b.n).push(w.a.n);
  const level = new Map(), state = new Map();
  const lv = (n) => {
    if (state.get(n.id) === 2) return level.get(n.id);
    if (state.get(n.id) === 1) return -1;                 // a feedback wire: ignore it
    state.set(n.id, 1);
    let m = 0;
    for (const sid of srcs.get(n.id)) m = Math.max(m, lv(byId.get(sid)) + 1);
    state.set(n.id, 2); level.set(n.id, m);
    return m;
  };
  nodes.forEach(lv);
  const pins = nodes.filter((n) => n.type === 'IN');
  const consts = nodes.filter((n) => n.type === 'CONST');
  const outs = nodes.filter((n) => n.type === 'OUT');
  let top = 0;
  for (const n of nodes) if (n.type !== 'OUT' && n.type !== 'IN' && n.type !== 'CONST') top = Math.max(top, level.get(n.id));
  for (const n of pins.concat(consts)) level.set(n.id, 0);
  for (const n of nodes) if (n.type !== 'OUT' && n.type !== 'IN' && n.type !== 'CONST' && level.get(n.id) < 1) level.set(n.id, 1);
  for (const n of outs) level.set(n.id, top + 1);

  const cols = [];
  for (const n of nodes) (cols[level.get(n.id)] || (cols[level.get(n.id)] = [])).push(n);
  const GAPX = 110, GAPY = 30;
  let x = 40;
  const mid = new Map();                                   // node id -> centre y
  cols.forEach((col, L) => {
    if (!col) return;
    let wmax = 0;
    for (const n of col) wmax = Math.max(wmax, gm(n).w);
    let ordered = col;
    if (L === 0) {
      ordered = pins.concat(consts);
      let y = 0;
      for (const n of ordered) {
        const g = gm(n); n.x = snap(x); n.y = snap(y); y += g.h + (n.type === 'IN' ? 30 : 20);
        mid.set(n.id, n.y + g.h / 2);
      }
    } else {
      const want = (n) => {
        const ys = srcs.get(n.id).map((s) => mid.get(s)).filter((v) => v !== undefined);
        return ys.length ? ys.reduce((a, b) => a + b, 0) / ys.length : 1e9;
      };
      if (outs.includes(col[0])) ordered = col;            // pins keep the order they were made in
      else ordered = col.slice().sort((a, b) => want(a) - want(b));
      let bottom = -1e9;
      for (const n of ordered) {
        const g = gm(n), w = want(n);
        const y = Math.max(bottom + GAPY, snap((w > 1e8 ? bottom + GAPY : w) - g.h / 2));
        n.x = snap(x); n.y = snap(y); bottom = n.y + g.h;
        mid.set(n.id, n.y + g.h / 2);
      }
    }
    x += wmax + GAPX;
  });
  let lo = Infinity;
  for (const n of nodes) lo = Math.min(lo, n.y);
  if (lo !== 0 && isFinite(lo)) for (const n of nodes) n.y = snap(n.y - lo);
}

/* ---- the registry ------------------------------------------------------- */

const LIBRARY = [];
const LIB_LEVELS = [
  ['raw', 'Raw', 'built from nothing but NAND or NOR gates'],
  ['simple', 'Simple', 'a handful of gates'],
  ['intermediate', 'Intermediate', 'several chips working together'],
  ['advanced', 'Advanced', 'a real processor-sized building block'],
  ['computer', 'Computer', 'a machine that runs a program'],
];
const LIB_CAT_ORDER = [
  'Gates from NAND', 'Gates from NOR', 'Latches & flip-flops', 'Selecting & decoding', 'Arithmetic',
  'Comparing & checking', 'Registers & shifting', 'Counters & timing', 'Memory', 'Processors', 'Computers',
];
const LIB_CAT_COLOR = {
  'Gates from NAND': '#2f4257', 'Gates from NOR': '#365f7d', 'Latches & flip-flops': '#7d5233', 'Selecting & decoding': '#4a7d7a',
  'Arithmetic': '#3f7d55', 'Comparing & checking': '#6d7d33', 'Registers & shifting': '#7a5aa8', 'Counters & timing': '#a8445a',
  'Memory': '#5a4a7d', 'Processors': '#8a5a2e', 'Computers': '#b0453a',
};

/** Register a chip. `build(c)` gets a builder and wires it up; or `def` can
    hand back a finished circuit made some other way. */
function lib(key, name, cat, level, desc, build, opt) {
  LIBRARY.push(Object.assign({ key, name, cat, level, desc, build }, opt || {}));
}
const libEntry = (key) => LIBRARY.find((e) => e.key === key);
const libId = (key) => 'lib:' + key;

/** Put a library chip (and everything it is built from) in the chip library.
    `asNeeded` marks one that is only there because something else uses it:
    those stay out of the parts list until you ask for them by name. */
function installLib(key, asNeeded) {
  const id = libId(key);
  if (LIB[id]) { if (!asNeeded && LIB[id].lib) LIB[id].lib.dep = false; return id; }
  const e = libEntry(key);
  if (!e) throw new Error('no library chip called ' + key);
  let d;
  if (e.def) d = e.def();
  else { const c = NB(e.name, LIB_CAT_COLOR[e.cat]); e.build(c); d = c.finish(); }
  d.id = id; d.name = e.name; d.color = LIB_CAT_COLOR[e.cat] || d.color;
  d.lib = { key, cat: e.cat, level: e.level, dep: !!asNeeded };
  LIB[id] = d;
  return id;
}

/** All the AND-of-literals lines of a decoder: one per number. */
function decodeLines(c, A, en) {
  const inv = A.map((a) => c.gate('NOT', a));
  const lines = [];
  for (let n = 0; n < 2 ** A.length; n++) {
    const lits = A.map((_, i) => ((n >> i) & 1 ? A[i] : inv[i]));
    if (en) lits.push(en);
    lines.push(lits.length === 1 ? lits[0] : c.gate('AND', ...lits));
  }
  return lines;
}
/** A multiplexer tree out of 2:1 chips: select[0] picks within pairs. */
function muxTree(c, ins, sel) {
  let level = ins;
  for (const s of sel) {
    const next = [];
    for (let i = 0; i < level.length; i += 2) next.push(c.chip('mux2', level[i], level[i + 1], s)[0]);
    level = next;
  }
  return level[0];
}

/** A ripple-carry adder out of full-adder chips. Returns the sum bits, the
    carry out, and the carry going INTO each bit (needed for overflow). */
function rippleAdd(c, A, B, cin) {
  const S = [], into = [];
  let carry = cin;
  for (let i = 0; i < A.length; i++) {
    into.push(carry);
    const [s, co] = c.chip('full-adder', A[i], B[i], carry);
    S.push(s); carry = co;
  }
  return { S, co: carry, into };
}

/** A small arithmetic logic unit from gates, with the same operations as the ALU part. */
function buildAlu(c, n) {
  const A = c.ins('A', n), B = c.ins('B', n), OP = c.ins('OP', 3), CI = c.in('CI');
  const L = decodeLines(c, OP);
  const sub = L[1];
  const r = rippleAdd(c, A, B.map((b) => c.gate('XOR', b, sub)), c.gate('XOR', CI, sub));
  const F = bitsFn(n, (i) => muxTree(c, [
    r.S[i], r.S[i],
    c.gate('AND', A[i], B[i]), c.gate('OR', A[i], B[i]), c.gate('XOR', A[i], B[i]), c.gate('NOT', A[i]),
    i > 0 ? A[i - 1] : CI, i < n - 1 ? A[i + 1] : CI,
  ], OP));
  const arith = c.gate('OR', L[0], L[1]);
  c.outs('F', F);
  c.out('CO', c.gate('OR', c.gate('AND', arith, c.gate('XOR', r.co, sub)), c.gate('AND', L[6], A[n - 1]), c.gate('AND', L[7], A[0])));
  c.out('Z', c.gate('NOR', ...F)); c.out('N', F[n - 1]);
  c.out('V', c.gate('AND', arith, c.gate('XOR', r.into[n - 1], r.co)));
}

/* ---- comparing and checking -------------------------------------------- */

function buildCompare(c, n) {
  const A = c.ins('A', n), B = c.ins('B', n);
  const eq = A.map((a, i) => c.gate('XNOR', a, B[i]));
  const gt = [], lt = [];
  let pe = null;                                              // "every bit above this one matches"
  for (let i = n - 1; i >= 0; i--) {
    const g = [A[i], c.gate('NOT', B[i])], l = [c.gate('NOT', A[i]), B[i]];
    if (pe) { g.push(pe); l.push(pe); }
    gt.push(c.gate('AND', ...g)); lt.push(c.gate('AND', ...l));
    pe = pe ? c.gate('AND', pe, eq[i]) : eq[i];
  }
  c.out('A>B', n > 1 ? c.gate('OR', ...gt) : gt[0]); c.out('A=B', pe); c.out('A<B', n > 1 ? c.gate('OR', ...lt) : lt[0]);
}
